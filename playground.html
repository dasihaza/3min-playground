<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>놀이터 · 놀이 퀴즈 — 3분 놀이터</title>
<meta name="description" content="3분 놀이터의 놀이터. 3분이면 끝나는 퀴즈와 게임을 즐겨 보세요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/common.css">
<style>
  body {
    background:
      radial-gradient(circle, rgba(0,0,0,.05) 1.4px, transparent 1.6px) 0 0 / 22px 22px,
      linear-gradient(#8fd3ff 0, #d6f1ff 380px, #ffe9b8 380px, #f6d79b 100%);
    min-height: 100vh;
  }
  .hero { position: relative; max-width: 1120px; margin: 0 auto; padding: 10px 20px 0; height: 340px; }
  .hero svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .sign {
    position: absolute; left: 50%; top: 46px; transform: translateX(-50%) rotate(-2deg);
    background: #c98a4b; border-radius: 14px; padding: 16px 34px 18px; text-align: center;
    box-shadow: inset 0 -6px 0 rgba(0,0,0,.15), 0 10px 0 -2px #8a5a3b, 0 14px 24px rgba(0,0,0,.18);
    background-image: repeating-linear-gradient(0deg, rgba(0,0,0,.06) 0 2px, transparent 2px 14px);
    animation: hang 3.6s ease-in-out infinite alternate;
  }
  @keyframes hang { to { transform: translateX(-50%) rotate(2deg); } }
  .sign::before, .sign::after { content: ''; position: absolute; top: -40px; width: 4px; height: 42px; background: #6b6b6b; }
  .sign::before { left: 24%; } .sign::after { right: 24%; }
  .sign h1 { margin: 0; font-size: clamp(30px, 6vw, 46px); color: #fff8e6; text-shadow: 0 3px 0 #8a5a3b; letter-spacing: .02em; }
  .sign p { margin: 2px 0 0; color: #ffecc7; font-size: 15px; }
  .cloud { animation: drift 60s linear infinite; }
  @keyframes drift { from { transform: translateX(-200px); } to { transform: translateX(1300px); } }
  .swing { animation: swing 2.3s ease-in-out infinite alternate; transform-box: view-box; transform-origin: 900px 150px; }
  @keyframes swing { from { transform: rotate(-20deg); } to { transform: rotate(20deg); } }

  main { max-width: 1120px; margin: 0 auto; padding: 0 20px; }
  .intro { text-align: center; font-family: 'Jua', sans-serif; font-size: 19px; color: #7a5326; margin: 6px 0 22px; }
  .programs { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 22px; }
  .card {
    --c: #ff7a59;
    position: relative; display: flex; flex-direction: column; gap: 4px; text-decoration: none;
    background: var(--c); color: #fff; border-radius: 26px; padding: 26px 22px 20px;
    box-shadow: inset 0 -8px 0 rgba(0,0,0,.14), 0 8px 0 rgba(0,0,0,.12);
    transition: transform .2s cubic-bezier(.3,1.6,.5,1);
  }
  .card:hover { transform: translateY(-8px) rotate(-1.5deg); }
  .card:nth-child(even):hover { transform: translateY(-8px) rotate(1.5deg); }
  .bolt { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,.55); box-shadow: inset 0 -2px 0 rgba(0,0,0,.2); }
  .b1 { top: 12px; left: 12px; } .b2 { top: 12px; right: 12px; } .b3 { bottom: 16px; left: 12px; } .b4 { bottom: 16px; right: 12px; }
  .card-emoji {
    width: 70px; height: 70px; border-radius: 50%; display: grid; place-items: center; font-size: 38px;
    background: #fff; box-shadow: 0 4px 0 rgba(0,0,0,.12); margin-bottom: 8px;
  }
  .card h3 { margin: 0; font-size: 24px; text-shadow: 0 2px 0 rgba(0,0,0,.12); }
  .card p { margin: 0; font-size: 14.5px; opacity: .95; flex: 1; }
  .card-cta {
    align-self: flex-start; margin-top: 12px; font-family: 'Jua', sans-serif; font-size: 16px;
    background: #fff; color: var(--c); border-radius: 999px; padding: 6px 14px;
  }
  .card .new-badge { background: #fff; color: #ff3d6e; }
  .room-nav .door { background: #fffaf0; }
  .ptag { position: absolute; top: 26px; right: 22px; font-size: 12px; background: rgba(255,255,255,.25); border-radius: 999px; padding: 2px 10px; }
</style>
</head>
<body class="room room-playground">

<header class="room-top">
  <a class="back-link" href="index.html">← 학교 지도로</a>
  <div class="nameplate"><span class="np-floor">운동장</span><span class="np-name">놀이터<small>PLAYGROUND</small></span></div>
</header>

<section class="hero" aria-hidden="true">
  <svg viewBox="0 0 1080 340" preserveAspectRatio="xMidYMax slice">
    <g class="cloud"><ellipse cx="0" cy="60" rx="60" ry="20" fill="#fff"/><circle cx="-16" cy="50" r="24" fill="#fff"/><circle cx="18" cy="46" r="20" fill="#fff"/></g>
    <g class="cloud" style="animation-delay:-30s;animation-duration:80s"><ellipse cx="0" cy="110" rx="70" ry="18" fill="#fff" opacity=".85"/><circle cx="10" cy="98" r="24" fill="#fff" opacity=".85"/></g>
    <circle cx="980" cy="70" r="38" fill="#ffd34d"/>
    <!-- 미끄럼틀 -->
    <rect x="70" y="200" width="8" height="140" fill="#3f7fd8"/><rect x="120" y="200" width="8" height="140" fill="#3f7fd8"/>
    <path d="M60 202 L99 160 L138 202Z" fill="#ff7a59"/><rect x="62" y="198" width="74" height="10" rx="4" fill="#ffc93c"/>
    <path d="M130 204 C190 210 200 320 270 340 L292 340 C215 318 205 194 136 192Z" fill="#ff5d73"/>
    <!-- 그네 -->
    <g stroke="#7a4fd0" stroke-width="9" stroke-linecap="round" fill="none"><path d="M840 340 L860 150 L880 340M960 340 L980 150 L1000 340"/></g>
    <rect x="852" y="144" width="136" height="12" rx="6" fill="#9b6cf0"/>
    <g class="swing"><path d="M888 150 V280 M912 150 V280" stroke="#555" stroke-width="2.5"/><rect x="882" y="278" width="36" height="8" rx="3" fill="#ffc93c"/></g>
  </svg>
  <div class="sign"><h1>🛝 놀이 퀴즈</h1><p>쉬는 시간처럼 가볍게, 3분이면 끝!</p></div>
</section>

<main>
  <p class="intro">오늘은 어떤 놀이기구를 탈까요? 놀이 <span data-count>0</span>개가 기다리고 있어요</p>
  <div id="programs" class="programs"></div>
</main>

<nav class="room-nav" id="roomNav" aria-label="다른 장소"></nav>
<footer class="site-foot">
  <p class="foot-copy">© 2026 3분 놀이터. 콘텐츠는 재미로 즐겨주세요.</p>
  <p class="foot-links">
    <a class="site-link" href="privacy.html">개인정보처리방침</a>
    <span class="foot-sep" aria-hidden="true">|</span>
    <span>문의: <a href="mailto:dasihaza@gmail.com">dasihaza@gmail.com</a></span>
  </p>
</footer>

<script src="assets/rooms.js"></script>
<script>
  const COLORS = ['#ff7a59', '#3f9fe0', '#2fb877', '#9b6cf0', '#f2a31b', '#e8668f'];
  mountPrograms('playground', (p, i) => `
    <a class="card prog-link" href="${p.href}" data-title="${esc(p.title)}" style="--c:${COLORS[i % COLORS.length]}">
      <span class="bolt b1"></span><span class="bolt b2"></span><span class="bolt b3"></span><span class="bolt b4"></span>
      <span class="card-emoji">${p.emoji}</span>
      <h3>${esc(p.title)}${p.isNew ? '<span class="new-badge">NEW</span>' : ''}</h3>
      <p>${esc(p.desc)}</p>
      ${p.tag ? `<span class="ptag">${esc(p.tag)}</span>` : ''}
      <span class="card-cta">놀러 가기 ▶</span>
    </a>`);
  mountRoomNav('playground');
</script>
</body>
</html>
