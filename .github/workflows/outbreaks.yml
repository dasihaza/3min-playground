name: 감염병 정보 갱신

on:
  schedule:
    - cron: '0 21 * * *'      # 매일 한국시각 오전 6시
  workflow_dispatch:           # 버튼으로 직접 실행도 가능

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 질병관리청 자료 받아오기
        env:
          KDCA_SERVICE_KEY: ${{ secrets.KDCA_SERVICE_KEY }}
          KDCA_API_URL: ${{ secrets.KDCA_API_URL }}
        run: node scripts/fetch-outbreaks.mjs

      - name: 바뀐 내용 저장
        run: |
          git config user.name  "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add assets/outbreaks.json
          if git diff --staged --quiet; then
            echo "바뀐 내용이 없습니다."
          else
            git commit -m "감염병 정보 갱신 $(date -u -d '+9 hours' +%Y-%m-%d)"
            git push
          fi
