<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3분 놀이터 — 쉬는 시간, 3분이면 충분해요</title>
<meta name="description" content="성향 테스트, 밸런스 게임, 웹게임, 교실에서 바로 쓰는 디지털 교구까지. 3분이면 끝나는 재미있는 콘텐츠가 매일 올라오는 놀이터.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="assets/school-day.jpg">
<link rel="stylesheet" href="assets/common.css">
<style>
  :root { --bg1: #fff1f6; --bg2: #e9f6ff; --ink: #3a3046; }
  body.home {
    color: var(--ink);
    background:
      radial-gradient(circle at 12% 8%, rgba(255,182,206,.45), transparent 32%),
      radial-gradient(circle at 88% 12%, rgba(173,216,255,.55), transparent 35%),
      linear-gradient(180deg, var(--bg1), var(--bg2));
    min-height: 100vh;
    transition: background .8s;
  }
  body.home.night {
    --ink: #f3eeff;
    background:
      radial-gradient(circle at 12% 8%, rgba(160,110,220,.35), transparent 35%),
      radial-gradient(circle at 88% 12%, rgba(90,120,230,.35), transparent 35%),
      linear-gradient(180deg, #1c1640, #2a2160);
  }

  /* ---------- 상단 바 ---------- */
  .topbar { max-width: 1400px; margin: 0 auto; padding: 16px 20px 12px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .logo { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; font-family: 'Jua', sans-serif; font-size: 30px; color: var(--ink); }
  .logo-badge {
    width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; color: #fff; font-size: 26px;
    background: linear-gradient(135deg, #ff8fb1, #ff6f91); box-shadow: 0 4px 0 #e0517a, 0 8px 16px rgba(255,111,145,.35);
    transform: rotate(-8deg); animation: wiggle 3.2s ease-in-out infinite;
  }
  @keyframes wiggle { 0%, 80%, 100% { transform: rotate(-8deg); } 85% { transform: rotate(6deg) scale(1.08); } 90% { transform: rotate(-12deg); } 95% { transform: rotate(4deg); } }
  .logo small { font-family: 'Gowun Dodum', sans-serif; font-size: 13px; opacity: .7; margin-left: 4px; }
  .tagline { margin: 0; flex: 1; min-width: 240px; font-size: 15px; opacity: .8; }
  .night-btn {
    font-family: 'Jua', sans-serif; font-size: 16px; cursor: pointer; border: 0; border-radius: 999px; padding: 10px 18px 10px 14px;
    background: #fff; color: #5a4a8a; box-shadow: 0 4px 0 #d9d0f0, 0 10px 18px rgba(90,74,138,.15);
    display: inline-flex; align-items: center; gap: 6px; transition: transform .15s;
  }
  .night-btn:hover { transform: translateY(-2px); }
  .night-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #d9d0f0; }
  body.night .night-btn { background: #ffe9a6; color: #4a3a10; box-shadow: 0 4px 0 #c9a94e, 0 10px 18px rgba(255,220,120,.25); }

  /* ---------- 장면 ---------- */
  .scene-scroll { max-width: 1400px; margin: 0 auto; padding: 0 14px 6px; overflow-x: auto; scrollbar-width: thin; }
  .scene-frame {
    min-width: 860px; padding: 10px; border-radius: 34px;
    background: linear-gradient(135deg, #ffd6e5, #fff4c9 40%, #d5f0ff);
    box-shadow: 0 22px 50px rgba(120,80,140,.22);
  }
  body.night .scene-frame { background: linear-gradient(135deg, #6b4fb8, #3b3a8f 50%, #2e5aa6); box-shadow: 0 22px 50px rgba(0,0,0,.45); }
  .scene {
    position: relative; aspect-ratio: 1344 / 752; border-radius: 26px; overflow: hidden;
    container-type: inline-size; isolation: isolate; background: #cfe9ff;
  }
  .scene img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; user-select: none; -webkit-user-drag: none; }
  .bg-night { opacity: 0; transition: opacity 1s ease; }
  body.night .bg-night { opacity: 1; }
  .scene .fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  /* 시계 (실제 시각) */
  .clock-face { fill: #fdf6e6; transition: fill 1s; }
  body.night .clock-face { fill: #fdeccf; }

  /* 꽃잎 */
  .petals { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 3; }
  .petal {
    position: absolute; top: -4%; width: 1.1cqw; height: .8cqw; border-radius: 150% 0 150% 0;
    background: linear-gradient(135deg, #ffd3e2, #ff9fc0); opacity: .9;
    animation: fall linear infinite, spinP ease-in-out infinite alternate;
  }
  @keyframes fall { to { transform: translate(var(--dx, 8cqw), 62cqw) rotate(540deg); } }
  @keyframes spinP { from { filter: brightness(1); } to { filter: brightness(1.12); } }

  /* 밤: 반딧불, 별 */
  .firefly { opacity: 0; transition: opacity 1s; }
  body.night .firefly { opacity: 1; }
  .firefly circle { animation: flyabout 7s ease-in-out infinite alternate, blink 2.2s ease-in-out infinite; transform-box: fill-box; }
  @keyframes flyabout { 0% { transform: translate(0, 0); } 33% { transform: translate(18px, -14px); } 66% { transform: translate(-12px, -26px); } 100% { transform: translate(10px, 8px); } }
  @keyframes blink { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
  .twinkle path { animation: tw 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes tw { 0%, 100% { transform: scale(.4) rotate(0); opacity: .3; } 50% { transform: scale(1) rotate(45deg); opacity: 1; } }
  .plane { animation: plane 26s ease-in-out infinite; }
  @keyframes plane { 0%, 60% { transform: translate(-80px, 330px) rotate(-6deg); opacity: 0; } 61% { opacity: 1; } 100% { transform: translate(1440px, 60px) rotate(-14deg); opacity: 1; } }
  body.night .plane { display: none; }

  /* 안내 새 말풍선 */
  .guide {
    position: absolute; left: 75.6%; top: 14.5%; z-index: 6; pointer-events: none;
    font-family: 'Jua', sans-serif; font-size: 1.3cqw; line-height: 1.3; color: #4a3a5a;
    background: #fff; border-radius: 1.4cqw; padding: .7cqw 1.1cqw; max-width: 19cqw;
    box-shadow: 0 .5cqw 1.2cqw rgba(90,60,120,.22); border: .2cqw solid #ffd0e0;
    animation: floaty 3s ease-in-out infinite;
  }
  .guide::before { content: ''; position: absolute; left: -1cqw; top: 1.2cqw; border: .6cqw solid transparent; border-right: 1cqw solid #fff; }
  .guide b { color: #ff6f91; font-weight: 400; }
  @keyframes floaty { 50% { transform: translateY(-.5cqw); } }
  .guide.pop { animation: pop .35s cubic-bezier(.3,1.6,.5,1), floaty 3s ease-in-out .35s infinite; }
  @keyframes pop { from { transform: scale(.7); } }

  /* ---------- 장소 핫스팟 ---------- */
  .spot {
    position: absolute; z-index: 4; cursor: pointer; outline: none;
    border-radius: 1.4cqw; transition: box-shadow .35s ease, background .35s;
  }
  .spot::before { /* 반짝이는 테두리 */
    content: ''; position: absolute; inset: -.35cqw; border-radius: 1.7cqw;
    border: .3cqw dashed rgba(255,255,255,0); transition: border-color .3s, transform .3s;
  }
  .spot.active {
    box-shadow: 0 0 0 200vmax rgba(40,20,70,.38), 0 0 2.4cqw 1cqw rgba(255,236,150,.85), inset 0 0 2cqw rgba(255,240,180,.7);
    background: radial-gradient(ellipse at center, rgba(255,250,210,.28), transparent 70%);
    z-index: 7;
  }
  .spot.active::before { border-color: #fff; animation: march 1s linear infinite; }
  @keyframes march { to { transform: rotate(0) scale(1.01); } }
  .spot:focus-visible::before { border-color: #ffb703; }

  /* 매달린 이름표 */
  .sign {
    position: absolute; left: 50%; bottom: calc(100% + .2cqw); transform-origin: 50% -2cqw;
    translate: -50% 0; white-space: nowrap; pointer-events: none;
    animation: swingSign 2.8s ease-in-out infinite alternate;
  }
  .spot[data-room="playground"] .sign { bottom: auto; top: -1.6cqw; }
  @keyframes swingSign { from { rotate: -3deg; } to { rotate: 3deg; } }
  .sign::before, .sign::after { /* 줄 */
    content: ''; position: absolute; top: -1.8cqw; width: .18cqw; height: 2cqw; background: rgba(90,70,60,.55);
  }
  .sign::before { left: 22%; } .sign::after { right: 22%; }
  .sign-body {
    display: inline-flex; align-items: center; gap: .5cqw;
    font-family: 'Jua', sans-serif; font-size: 1.45cqw; color: #fff;
    background: var(--accent); padding: .45cqw 1.1cqw .45cqw .45cqw; border-radius: 999px;
    border: .25cqw solid #fff;
    box-shadow: 0 .35cqw 0 color-mix(in srgb, var(--accent) 70%, #000), 0 .8cqw 1.4cqw rgba(60,30,80,.25);
    transition: transform .3s cubic-bezier(.3,1.7,.5,1);
  }
  .sign-emoji { width: 2.2cqw; height: 2.2cqw; border-radius: 50%; background: #fff; display: grid; place-items: center; font-size: 1.3cqw; }
  .sign-menu { font-size: 1.05cqw; opacity: .9; margin-left: .2cqw; }
  .spot.active .sign-body { transform: scale(1.18) translateY(-.4cqw); }
  .spot .hint { /* 눌러 보라는 반짝이 */
    position: absolute; right: -.6cqw; top: -.6cqw; font-size: 1.6cqw; pointer-events: none;
    animation: hint 1.8s ease-in-out infinite;
  }
  @keyframes hint { 0%, 100% { transform: scale(.7) rotate(0); opacity: .5; } 50% { transform: scale(1.1) rotate(20deg); opacity: 1; } }
  .spot.active .hint { display: none; }

  /* ---------- 엿보기 카드 ---------- */
  .peek {
    position: absolute; z-index: 20; width: 320px;
    background: #fffdf8; border-radius: 24px; padding: 12px 12px 14px;
    box-shadow: 0 18px 40px rgba(40,20,70,.35), 0 0 0 4px #fff, 0 0 0 8px var(--accent, #ff6f91);
    opacity: 0; transform: translateY(10px) scale(.92); pointer-events: none;
    transition: opacity .2s, transform .3s cubic-bezier(.3,1.5,.5,1);
  }
  .peek.show { opacity: 1; transform: none; pointer-events: auto; }
  .peek-view { /* 창문 너머로 엿보기 (그림 확대) */
    position: relative; border-radius: 16px; overflow: hidden; aspect-ratio: 2.7 / 1;
    background-repeat: no-repeat; border: 3px solid #fff; box-shadow: inset 0 0 0 2px rgba(0,0,0,.06);
    animation: zoomIn .6s ease-out both;
  }
  @keyframes zoomIn { from { filter: blur(3px) brightness(1.2); } }
  .peek-view::before, .peek-view::after { /* 커튼 */
    content: ''; position: absolute; top: 0; bottom: 0; width: 18%;
    background: repeating-linear-gradient(90deg, color-mix(in srgb, var(--accent) 85%, #fff) 0 6px, color-mix(in srgb, var(--accent) 65%, #fff) 6px 12px);
    animation: curtainL .7s cubic-bezier(.3,1.2,.4,1) both;
  }
  .peek-view::before { left: 0; border-radius: 0 0 60% 0; }
  .peek-view::after { right: 0; border-radius: 0 0 0 60%; animation-name: curtainR; }
  @keyframes curtainL { from { width: 52%; } }
  @keyframes curtainR { from { width: 52%; } }
  .peek-head { display: flex; align-items: center; gap: 10px; margin: 10px 4px 2px; }
  .peek-emoji { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; font-size: 24px; background: color-mix(in srgb, var(--accent) 18%, #fff); }
  .peek-name { font-family: 'Jua', sans-serif; font-size: 22px; display: block; line-height: 1.1; color: #3a3046; }
  .peek-menu { font-size: 13px; color: #8a8096; }
  .peek-count { margin-left: auto; font-family: 'Jua', sans-serif; font-size: 13px; color: #fff; background: var(--accent); border-radius: 999px; padding: 3px 10px; }
  .peek-list { list-style: none; margin: 8px 0 12px; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
  .peek-list li {
    display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: #4a4058;
    background: color-mix(in srgb, var(--accent) 12%, #fff); border: 1.5px solid color-mix(in srgb, var(--accent) 25%, #fff);
    border-radius: 999px; padding: 3px 10px; animation: chipIn .3s both;
  }
  .peek-list li.more { background: #fff; border-style: dashed; color: #8a8096; }
  @keyframes chipIn { from { opacity: 0; transform: translateY(4px) scale(.9); } }
  .peek-go {
    display: flex; justify-content: center; align-items: center; gap: 6px; text-decoration: none;
    font-family: 'Jua', sans-serif; font-size: 18px; color: #fff; border-radius: 16px; padding: 10px;
    background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 80%, #fff), var(--accent));
    box-shadow: 0 4px 0 color-mix(in srgb, var(--accent) 70%, #000);
  }
  .peek-go:active { transform: translateY(2px); box-shadow: 0 2px 0 color-mix(in srgb, var(--accent) 70%, #000); }

  .swipe-hint { display: none; text-align: center; font-size: 13px; opacity: .7; margin: 6px 0 0; }
  @media (max-width: 900px) { .swipe-hint { display: block; } }

  /* ---------- 장소 바로가기 ---------- */
  .quick { max-width: 1400px; margin: 30px auto 0; padding: 0 20px; }
  .quick h2 { font-size: 24px; margin: 0 0 14px; display: flex; align-items: center; gap: 8px; }
  .quick ul { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
  .quick a {
    display: block; text-decoration: none; height: 100%; background: #fff; border-radius: 22px; overflow: hidden;
    box-shadow: 0 5px 0 color-mix(in srgb, var(--accent) 35%, #fff), 0 12px 24px rgba(90,60,120,.12);
    transition: transform .2s cubic-bezier(.3,1.6,.5,1);
  }
  .quick a:hover { transform: translateY(-6px) rotate(-.6deg); }
  .q-thumb { aspect-ratio: 2.4 / 1; background-repeat: no-repeat; position: relative; }
  .q-thumb .q-emoji {
    position: absolute; left: 12px; bottom: -18px; width: 40px; height: 40px; border-radius: 14px; display: grid; place-items: center;
    font-size: 22px; background: #fff; box-shadow: 0 3px 8px rgba(0,0,0,.15);
  }
  .q-text { padding: 24px 16px 16px; color: #3a3046; }
  .q-text b { font-family: 'Jua', sans-serif; font-weight: 400; font-size: 19px; display: block; }
  .q-text b span { font-size: 14px; color: var(--accent); margin-left: 4px; }
  .q-text small { color: #8a8096; font-size: 13px; }
  .site-foot { margin-top: 34px; color: inherit; opacity: .7; }

  /* 관리자용 전구 : 모든 웹게임 순위 초기화 (평소엔 희미하게) */
  .bulb-wrap { text-align: center; padding: 0 0 34px; margin-top: -24px; }
  .bulb {
    background: none; border: none; cursor: pointer; padding: 6px; line-height: 0;
    color: #C9D3E3; opacity: .35; transition: all .2s;
  }
  .bulb:hover { color: #F0B429; opacity: 1; filter: drop-shadow(0 0 6px rgba(240,180,41,.6)); }
  .bulb.on { color: #F0B429; opacity: 1; filter: drop-shadow(0 0 10px rgba(240,180,41,.85)); }
</style>
</head>

<script>
(() => {
  const IMG_W = 1344, IMG_H = 752;
  /* 그림 속 장소 위치 (그림 픽셀 기준: x, y, 너비, 높이)
     그림을 바꾸면 이 숫자만 고치면 돼요. */
  const AREAS = {
    lab:        [78, 222, 307, 108],
    council:    [530, 222, 265, 108],
    meeting:    [530, 362, 265, 92],
    office:     [78, 484, 277, 94],
    playground: [835, 352, 505, 288]
  };
  const GUIDE_LINES = {
    playground: n => `놀이터엔 <b>게임·퀴즈 ${n}개</b>!<br>같이 놀자~ 🛝`,
    lab: n => `연구실엔 <b>수업 도구 ${n}개</b>가<br>보글보글 준비돼 있어 🧪`,
    office: n => `교무실엔 선생님을 위한<br><b>업무 꾸러미 ${n}개</b> 📂`,
    meeting: n => `회의실에서 <b>이야기</b>를<br>나눠 볼까? 💬`,
    council: n => `학생자치실에서<br><b>나를 알아보는 테스트 ${n}개</b> ✨`
  };
  const pct = (v, total) => (v / total * 100) + '%';
  const scene = document.getElementById('scene');
  const peek = document.getElementById('peek');
  const guide = document.getElementById('guide');
  const GUIDE_DEFAULT = guide.innerHTML;

  /* 현재(낮/밤) 그림 */
  const curImg = () => document.body.classList.contains('night') ? 'assets/school-night.jpg' : 'assets/school-day.jpg';

  /* 그림의 일부를 잘라 보여 주는 배경 스타일 */
  function cropStyle(el, [x, y, w, h], aspect, pad = 0.06) {
    // 장소 둘레를 조금 넓혀서, 원하는 비율(aspect)로 왜곡 없이 잘라요
    let cw = w * (1 + pad * 2), ch = h * (1 + pad * 2);
    if (cw / ch > aspect) ch = cw / aspect; else cw = ch * aspect;
    cw = Math.min(cw, IMG_W); ch = Math.min(ch, IMG_H);
    let cx = x + w / 2 - cw / 2, cy = y + h / 2 - ch / 2;
    cx = Math.max(0, Math.min(cx, IMG_W - cw)); cy = Math.max(0, Math.min(cy, IMG_H - ch));
    el.style.backgroundImage = `url(${curImg()})`;
    el.style.backgroundSize = `${IMG_W / cw * 100}% ${IMG_H / ch * 100}%`;
    el.style.backgroundPosition = `${cw < IMG_W ? cx / (IMG_W - cw) * 100 : 0}% ${ch < IMG_H ? cy / (IMG_H - ch) * 100 : 0}%`;
  }

  /* 핫스팟 + 이름표 */
  document.getElementById('spots').innerHTML = ROOM_ORDER.map(k => {
    const r = ROOMS[k], [x, y, w, h] = AREAS[k];
    return `<div class="spot" data-room="${k}" tabindex="0" role="link" aria-label="${r.name} — ${r.menu} (${r.programs.length}개)로 들어가기"
        style="--accent:${r.accent};left:${pct(x, IMG_W)};top:${pct(y, IMG_H)};width:${pct(w, IMG_W)};height:${pct(h, IMG_H)}">
        <span class="sign" style="animation-delay:-${(Math.random() * 2.8).toFixed(2)}s">
          <span class="sign-body"><span class="sign-emoji">${r.emoji}</span>${r.name}<span class="sign-menu">· ${r.menu}</span></span>
        </span>
        <span class="hint">✨</span>
      </div>`;
  }).join('');

  /* 꽃잎 */
  const petals = document.getElementById('petals');
  for (let i = 0; i < 22; i++) {
    const s = document.createElement('span');
    s.className = 'petal';
    s.style.left = (Math.random() * 100) + '%';
    s.style.setProperty('--dx', (Math.random() * 16 - 4) + 'cqw');
    const dur = 9 + Math.random() * 9;
    s.style.animationDuration = `${dur}s, ${1 + Math.random()}s`;
    s.style.animationDelay = `-${Math.random() * dur}s, 0s`;
    s.style.scale = (0.6 + Math.random() * 0.8).toFixed(2);
    petals.appendChild(s);
  }

  /* 반딧불 */
  let ff = '';
  for (let i = 0; i < 26; i++) {
    const x = 60 + Math.random() * 1240, y = 430 + Math.random() * 300;
    ff += `<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${(2 + Math.random() * 2.5).toFixed(1)}" fill="#fff59a"
      style="filter:drop-shadow(0 0 6px #ffe76a);animation-delay:-${(Math.random() * 7).toFixed(1)}s,-${(Math.random() * 2).toFixed(1)}s"/>`;
  }
  document.getElementById('fireflies').innerHTML = ff;

  /* 시계 */
  function tick() {
    const d = new Date(), s = d.getSeconds(), m = d.getMinutes() + s / 60, h = d.getHours() % 12 + m / 60;
    document.getElementById('hourHand').setAttribute('transform', `rotate(${h * 30} 458 177)`);
    document.getElementById('minHand').setAttribute('transform', `rotate(${m * 6} 458 177)`);
    document.getElementById('secHand').setAttribute('transform', `rotate(${s * 6} 458 177)`);
  }
  tick(); setInterval(tick, 1000);

  /* 낮 / 밤 */
  const btn = document.getElementById('nightBtn');
  function setNight(on) {
    document.body.classList.toggle('night', on);
    btn.textContent = on ? '☀️ 낮의 학교' : '🌙 밤의 학교';
    renderQuick();
    if (current) cropStyle(peek.querySelector('.peek-view'), AREAS[current.dataset.room], 2.7);
  }
  btn.addEventListener('click', () => setNight(!document.body.classList.contains('night')));

  /* ---------- 엿보기 ---------- */
  const canHover = matchMedia('(hover: hover)').matches;
  let current = null, hideT = null;

  function fillPeek(key) {
    const r = ROOMS[key];
    peek.style.setProperty('--accent', r.accent);
    const view = peek.querySelector('.peek-view');
    view.style.animation = 'none'; void view.offsetWidth; view.style.animation = '';
    cropStyle(view, AREAS[key], 2.7, 0.04);
    peek.querySelector('.peek-emoji').textContent = r.emoji;
    peek.querySelector('.peek-name').textContent = r.name;
    peek.querySelector('.peek-menu').textContent = `${r.floor} · ${r.menu}`;
    peek.querySelector('.peek-count').textContent = `${r.programs.length}개`;
    const max = 7, shown = r.programs.slice(0, max);
    peek.querySelector('.peek-list').innerHTML =
      shown.map((p, i) => `<li style="animation-delay:${i * 0.035}s">${p.emoji} ${esc(p.title)}</li>`).join('') +
      (r.programs.length > max ? `<li class="more">+${r.programs.length - max}개 더</li>` : '');
    const go = peek.querySelector('.peek-go');
    go.href = r.page;
    go.textContent = `${r.name}에 들어가기 →`;
    guide.innerHTML = GUIDE_LINES[key](r.programs.length);
    guide.classList.remove('pop'); void guide.offsetWidth; guide.classList.add('pop');
  }

  function placePeek(spot) {
    const sb = scene.getBoundingClientRect(), t = spot.getBoundingClientRect();
    const pw = peek.offsetWidth, ph = peek.offsetHeight, gap = 18;
    // 오른쪽 → 왼쪽 → 아래 → 위 순으로 자리 찾기
    let left = t.right - sb.left + gap, top = t.top - sb.top + t.height / 2 - ph / 2;
    if (left + pw > sb.width - 10) left = t.left - sb.left - pw - gap;
    if (left < 10) { left = t.left - sb.left + t.width / 2 - pw / 2; top = t.bottom - sb.top + gap; }
    left = Math.max(10, Math.min(left, sb.width - pw - 10));
    top = Math.max(10, Math.min(top, sb.height - ph - 10));
    peek.style.left = left + 'px';
    peek.style.top = top + 'px';
  }

  function open(spot) {
    clearTimeout(hideT);
    if (current === spot) return;
    if (current) current.classList.remove('active');
    current = spot;
    spot.classList.add('active');
    fillPeek(spot.dataset.room);
    placePeek(spot);
    peek.classList.add('show');
  }
  function close(now) {
    clearTimeout(hideT);
    const done = () => {
      if (current) current.classList.remove('active');
      current = null;
      peek.classList.remove('show');
      guide.innerHTML = GUIDE_DEFAULT;
    };
    now ? done() : (hideT = setTimeout(done, 240));
  }
  const enter = spot => { location.href = ROOMS[spot.dataset.room].page; };

  scene.querySelectorAll('.spot').forEach(spot => {
    spot.addEventListener('mouseenter', () => canHover && open(spot));
    spot.addEventListener('mouseleave', () => canHover && close());
    spot.addEventListener('focus', () => open(spot));
    spot.addEventListener('blur', () => close());
    spot.addEventListener('click', e => {
      if (!canHover && current !== spot) { e.preventDefault(); open(spot); return; } // 터치: 첫 탭은 엿보기
      enter(spot);
    });
    spot.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); enter(spot); }
      if (e.key === 'Escape') close(true);
    });
  });
  peek.addEventListener('mouseenter', () => clearTimeout(hideT));
  peek.addEventListener('mouseleave', () => close());
  document.addEventListener('click', e => {
    if (!canHover && current && !e.target.closest('.spot') && !e.target.closest('.peek')) close(true);
  });
  window.addEventListener('resize', () => current && placePeek(current));

  const sc = document.getElementById('sceneScroll');
  if (sc.scrollWidth > sc.clientWidth) sc.scrollLeft = (sc.scrollWidth - sc.clientWidth) * 0.15;

  /* 장소 바로가기 (그림에서 잘라 낸 썸네일) */
  function renderQuick() {
    const list = document.getElementById('quickList');
    list.innerHTML = ROOM_ORDER.map(k => {
      const r = ROOMS[k];
      return `<li><a href="${r.page}" style="--accent:${r.accent}">
        <div class="q-thumb" data-room="${k}"><span class="q-emoji">${r.emoji}</span></div>
        <div class="q-text"><b>${r.name}<span>${r.menu} · ${r.programs.length}개</span></b><small>${esc(r.desc)}</small></div></a></li>`;
    }).join('');
    list.querySelectorAll('.q-thumb').forEach(el => { cropStyle(el, AREAS[el.dataset.room], 2.4, 0.03); });
  }

  const hr = new Date().getHours();
  setNight(hr >= 19 || hr < 6);
})();
</script>
</body>
</html>
