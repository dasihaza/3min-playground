<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>세계 국기 짝 맞추기 | 3분 놀이터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#DFF3FF; --sky2:#C9E9FB;
    --ink:#3B4655; --ink-soft:#8494A6; --line:#DCE9F2;
    --pink:#FF90B3; --pink-d:#E06D91;
    --mint:#5FD0B0; --mint-d:#42AE90;
    --lemon:#FFD467; --grape:#A98BE0; --peach:#FFAC7D;
    --shadow:0 3px 0 rgba(59,70,85,.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 10% 6%, rgba(255,255,255,.9) 0 90px, transparent 91px),
      radial-gradient(circle at 90% 12%, rgba(255,255,255,.6) 0 70px, transparent 71px),
      linear-gradient(180deg,var(--sky),var(--sky2));
    background-attachment:fixed;
    color:var(--ink); font-family:'Noto Sans KR',sans-serif; min-height:100vh;
  }
  .topbar{max-width:1080px;margin:0 auto;padding:14px 18px 0;display:flex;align-items:center;justify-content:space-between;}
  .topbar a{text-decoration:none;color:var(--ink);}
  .topbar .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;}
  .topbar .back{font-size:12.5px;font-weight:700;color:var(--ink-soft);border:2px solid #fff;background:#fff;padding:6px 12px;border-radius:999px;box-shadow:var(--shadow);}
  .shell{max-width:1080px;margin:0 auto;padding:12px 18px 60px;}

  .hero{text-align:center;padding:8px 0 4px;}
  .hero h1{font-family:'Jua',sans-serif;font-size:clamp(24px,5vw,33px);margin:0 0 3px;color:#3C7FB1;}
  .hero p{font-family:'Gaegu',cursive;font-weight:700;font-size:17px;color:var(--ink-soft);margin:0;}

  /* 난이도 선택 버튼 */
  .diff-wrap { display:flex; justify-content:center; gap:8px; margin: 16px 0 6px; }
  .diff-btn {
    font-family:'Jua',sans-serif; font-size:14px; padding:7px 16px;
    border-radius:20px; border:2px solid var(--line); background:#fff; color:var(--ink-soft);
    cursor:pointer; transition:all .2s; box-shadow:0 3px 0 var(--line);
  }
  .diff-btn:hover { transform:translateY(1px); box-shadow:0 2px 0 var(--line); }
  .diff-btn.active {
    border-color:var(--sky2); background:#fff; color:#3C7FB1; 
    box-shadow:0 3px 0 var(--sky2);
  }

  /* 점수판 (맞춘 짝, 뒤집은 횟수, 걸린 시간 3개로 축소) */
  .board{
    display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin:10px 0 12px;
  }
  .stat{
    background:#fff;border-radius:14px;padding:9px 16px;box-shadow:var(--shadow);
    text-align:center;min-width:96px;
  }
  .stat b{display:block;font-family:'Jua',sans-serif;font-size:20px;line-height:1.2;}
  .stat span{font-size:11px;color:var(--ink-soft);}
  .stat.m b{color:var(--mint-d);} .stat.t b{color:var(--grape);} .stat.c b{color:var(--pink-d);}

  /* TOP3 랭킹 전광판 */
  .scoreboard {
    background: #1D2B36; border-radius: 14px; padding: 12px 18px;
    margin: 0 auto 16px; max-width: 330px; box-shadow: 0 4px 0 #111A22;
    color: #fff; text-align: left;
  }
  .sb-head { text-align: center; font-family: 'Jua', sans-serif; color: var(--lemon); font-size: 16px; margin-bottom: 8px; letter-spacing: 1px;}
  .sb-item { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; border-bottom: 1px dashed #3A4B5C; }
  .sb-item:last-child { border-bottom: none; }
  .sb-rank { width: 24px; font-size: 16px; text-align: center; }
  .sb-name { flex: 1; font-weight: 500; font-size: 14px; margin-left: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sb-score { font-family: monospace; font-size: 13.5px; color: #A9D1F4; text-align: right; }
  .sb-empty { text-align: center; color: #8494A6; font-size: 13px; padding: 8px 0; }

  .btn{
    font-family:'Jua',sans-serif;border:none;cursor:pointer;font-size:15px;
    padding:11px 20px;border-radius:13px;background:var(--pink);color:#fff;
    box-shadow:0 4px 0 var(--pink-d);transition:transform .1s;
  }
  .btn:hover{transform:translateY(1px);box-shadow:0 3px 0 var(--pink-d);}
  .btn:active{transform:translateY(4px);box-shadow:none;}
  .btn.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--line);}
  .btn.ghost:hover{box-shadow:0 3px 0 var(--line);}
  .btn.sm{font-size:13px;padding:9px 15px;border-radius:11px;}
  .tools{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:14px;}

  /* 카드판 */
  .grid{ font-size:0; text-align:center; }
  .card{
    display:inline-block; position:relative; cursor:pointer; vertical-align:top;
  }
  
  /* 난이도별 카드 크기 조절 */
  .grid[data-diff="8"] .card  { width:23.2%; margin:0.9%; }  /* 4칸씩 */
  .grid[data-diff="15"] .card { width:15.6%; margin:0.53%; } /* 6칸씩 */
  .grid[data-diff="25"] .card { width:9.2%;  margin:0.4%; }  /* 10칸씩 */

  .card::before{ content:""; display:block; padding-top:132%; }   /* 세로 비율 */
  .inner{ position:absolute; top:0; left:0; right:0; bottom:0; }

  .face{
    position:absolute; top:0; left:0; right:0; bottom:0; border-radius:12px;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .back{
    background:linear-gradient(145deg,#7FC4E8,#5AA8D6);
    box-shadow:0 3px 0 #3F8CBA, inset 0 0 0 3px rgba(255,255,255,.5);
    font-size:24px; font-size:clamp(18px,2.4vw,28px);
  }
  .front{
    background:#fff; flex-direction:column; padding:5px; display:none;
    box-shadow:0 3px 0 var(--line), inset 0 0 0 3px #fff;
  }
  
  /* 뒤집힌 상태 */
  .card.open .back, .card.done .back{ display:none; }
  .card.open .front, .card.done .front{ display:flex; animation:flipIn .3s ease; }
  @keyframes flipIn{ 0%{transform:scaleX(.15);} 60%{transform:scaleX(1.06);} 100%{transform:scaleX(1);} }

  /* 국기 영역 (위쪽 65%)과 이름 영역 (아래쪽 35%) 분리 */
  .front img{ 
    width:100%; flex:1; min-height:0; object-fit:contain; 
    border-radius:4px; background:#F4F8FB; margin-bottom:2px;
  }
  .front .nm{
    flex: 0 0 30%; display:flex; align-items:center; justify-content:center;
    font-family:'Jua',sans-serif; text-align:center; line-height:1.1; 
    color:var(--ink); word-break:keep-all;
  }

  /* 난이도별 폰트 크기 조정 */
  .grid[data-diff="8"] .front .nm { font-size: clamp(13px, 2.5vw, 17px); }
  .grid[data-diff="15"] .front .nm { font-size: clamp(11px, 1.8vw, 14px); }
  .grid[data-diff="25"] .front .nm { font-size: clamp(8px, 1.1vw, 12px); }

  .card.done{ cursor:default; }
  .card.done .front{ box-shadow:0 3px 0 var(--mint-d), inset 0 0 0 3px var(--mint); }
  .card.miss .front{ box-shadow:0 3px 0 #E08A8A, inset 0 0 0 3px #FFB3B3; }

  /* 완료 화면 */
  .done-box{
    background:#fff;border-radius:20px;padding:26px 22px;text-align:center;
    box-shadow:var(--shadow),0 12px 26px rgba(59,70,85,.14);margin-top:16px;
  }
  .done-box h2{font-family:'Jua',sans-serif;font-size:24px;margin:0 0 8px;color:var(--pink-d);}
  .done-box p{font-family:'Gaegu',cursive;font-weight:700;font-size:18px;color:var(--ink-soft);margin:0 0 16px;}
  .hidden{display:none !important;}
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:50;}

  .tip{
    background:rgba(255,255,255,.8);border:2px dashed var(--line);border-radius:14px;
    padding:11px 14px;font-size:12.5px;color:var(--ink-soft);line-height:1.8;
    text-align:center;margin-top:16px;word-break:keep-all;
  }

  /* 모바일 최적화 반응형 레이아웃 */
  @media (max-width:900px){ 
    .grid[data-diff="25"] .card { width:11.7%; margin:0.4%; } /* 어려움 8칸씩 */
  }
  @media (max-width:680px){ 
    .grid[data-diff="25"] .card { width:18.2%; margin:0.9%; } /* 어려움 5칸씩 */
    .grid[data-diff="15"] .card { width:18.2%; margin:0.9%; } /* 보통 5칸씩 */
    .grid[data-diff="25"] .front .nm { font-size: clamp(10px, 2.5vw, 13px); }
    .grid[data-diff="15"] .front .nm { font-size: clamp(11px, 2.8vw, 14px); }
  }
  @media (max-width:420px){ 
    .grid[data-diff="25"] .card { width:23.2%; margin:0.9%; } /* 어려움 4칸씩 */
    .grid[data-diff="15"] .card { width:23.2%; margin:0.9%; } /* 보통 4칸씩 */
    .grid[data-diff="25"] .front .nm { font-size: 11px; }
    .grid[data-diff="15"] .front .nm { font-size: 12px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <a class="brand" href="../index.html">
    <svg width="26" height="26" viewBox="0 0 34 34" fill="none">
      <circle cx="17" cy="18" r="14" fill="#fff" stroke="#3B4655" stroke-width="2"/>
      <path d="M17 9 L17 18 L23 21" stroke="#FF90B3" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="13" y="2" width="8" height="4" rx="1.5" fill="#3B4655"/>
    </svg>
    <span>3분 놀이터</span>
  </a>
  <a class="back" href="../index.html">← 다른 콘텐츠 보기</a>
</div>

<div class="shell">
  <div class="hero">
    <h1>🌍 세계 국기 짝 맞추기</h1>
    <p>같은 국기 두 장을 찾아보세요!</p>
  </div>

  <div class="diff-wrap">
    <button class="diff-btn" onclick="setDiff(8, this)">쉬움 (8쌍)</button>
    <button class="diff-btn active" onclick="setDiff(15, this)">보통 (15쌍)</button>
    <button class="diff-btn" onclick="setDiff(25, this)">어려움 (25쌍)</button>
  </div>

  <div class="board">
    <div class="stat m"><b id="s-match">0</b><span>맞춘 짝</span></div>
    <div class="stat c"><b id="s-try">0</b><span>뒤집은 횟수</span></div>
    <div class="stat t"><b id="s-time">00:00</b><span>걸린 시간</span></div>
  </div>

  <!-- 랭킹 전광판 -->
  <div class="scoreboard" id="scoreboard">
    <div class="sb-head">🏆 명예의 전당 (TOP 3)</div>
    <div id="sb-list">
      <!-- 자바스크립트로 랭킹이 표시됩니다 -->
    </div>
  </div>

  <div class="tools">
    <button class="btn" onclick="newGame()">🔄 새 게임</button>
    <button class="btn ghost sm" onclick="peek()">👀 잠깐 보기</button>
    <button class="btn ghost sm" onclick="toggleSound()" id="snd-btn">🔊 소리 켜짐</button>
  </div>

  <div class="grid" id="grid" data-diff="15"></div>

  <div class="done-box hidden" id="done-box">
    <h2 id="done-title">🎉 다 맞췄어요!</h2>
    <p id="done-msg"></p>
    <button class="btn" onclick="newGame()">한 번 더 하기</button>
  </div>

  <div class="tip">
    세계 100개국 중에서 난이도에 따라 국기가 무작위로 뽑혀요. 새 게임을 누를 때마다 나라가 바뀝니다.
  </div>
</div>

<canvas id="confetti"></canvas>

<script>
/* 보안용 특수문자 치환 함수 */
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

/* ===== 나라 100개 (국가코드 · 이름) ===== */
const COUNTRIES = [
 ["kr","대한민국"],["jp","일본"],["cn","중국"],["us","미국"],["gb","영국"],
 ["fr","프랑스"],["de","독일"],["it","이탈리아"],["es","스페인"],["pt","포르투갈"],
 ["ru","러시아"],["ca","캐나다"],["mx","멕시코"],["br","브라질"],["ar","아르헨티나"],
 ["cl","칠레"],["pe","페루"],["co","콜롬비아"],["au","호주"],["nz","뉴질랜드"],
 ["in","인도"],["id","인도네시아"],["th","태국"],["vn","베트남"],["ph","필리핀"],
 ["my","말레이시아"],["sg","싱가포르"],["mm","미얀마"],["kh","캄보디아"],["la","라오스"],
 ["np","네팔"],["pk","파키스탄"],["bd","방글라데시"],["lk","스리랑카"],["mn","몽골"],
 ["kz","카자흐스탄"],["uz","우즈베키스탄"],["tr","튀르키예"],["sa","사우디아라비아"],["ae","아랍에미리트"],
 ["qa","카타르"],["kw","쿠웨이트"],["il","이스라엘"],["ir","이란"],["iq","이라크"],
 ["eg","이집트"],["ma","모로코"],["dz","알제리"],["tn","튀니지"],["ly","리비아"],
 ["ng","나이지리아"],["gh","가나"],["ke","케냐"],["et","에티오피아"],["tz","탄자니아"],
 ["ug","우간다"],["za","남아프리카공화국"],["sn","세네갈"],["ci","코트디부아르"],["cm","카메룬"],
 ["nl","네덜란드"],["be","벨기에"],["ch","스위스"],["at","오스트리아"],["se","스웨덴"],
 ["no","노르웨이"],["dk","덴마크"],["fi","핀란드"],["is","아이슬란드"],["ie","아일랜드"],
 ["pl","폴란드"],["cz","체코"],["sk","슬로바키아"],["hu","헝가리"],["ro","루마니아"],
 ["bg","불가리아"],["gr","그리스"],["hr","크로아티아"],["rs","세르비아"],["si","슬로베니아"],
 ["ua","우크라이나"],["by","벨라루스"],["lt","리투아니아"],["lv","라트비아"],["ee","에스토니아"],
 ["mt","몰타"],["cy","키프로스"],["lu","룩셈부르크"],["mc","모나코"],["cu","쿠바"],
 ["jm","자메이카"],["do","도미니카공화국"],["cr","코스타리카"],["pa","파나마"],["gt","과테말라"],
 ["ec","에콰도르"],["uy","우루과이"],["py","파라과이"],["bo","볼리비아"],["ve","베네수엘라"]
];

let PAIRS = 15; /* 기본 난이도: 보통(15쌍) */

/* ===== 소리 ===== */
let audioCtx=null, soundOn=true;
function withAudio(fn){
  if(!soundOn) return;
  try{
    if(!audioCtx){ const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return; audioCtx=new AC(); }
    if(audioCtx.state==='running') fn(audioCtx);
    else audioCtx.resume().then(function(){ fn(audioCtx); }).catch(function(){});
  }catch(e){}
}
function tone(ctx,f,at,dur,vol,type){
  const o=ctx.createOscillator(), g=ctx.createGain();
  o.type=type||'sine'; o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,at);
  g.gain.exponentialRampToValueAtTime(vol,at+0.015);
  g.gain.exponentialRampToValueAtTime(0.0001,at+dur);
  o.connect(g); g.connect(ctx.destination); o.start(at); o.stop(at+dur+0.03);
}
function sFlip(){ withAudio(function(c){ tone(c,520,c.currentTime+0.01,0.09,0.13,'square'); }); }
function sMatch(){ withAudio(function(c){ const t=c.currentTime+0.02;
  tone(c,659.25,t,0.14,0.22,'triangle'); tone(c,987.77,t+0.11,0.3,0.22,'triangle'); }); }
function sMiss(){ withAudio(function(c){ const t=c.currentTime+0.02;
  tone(c,300,t,0.13,0.15,'sine'); tone(c,220,t+0.1,0.22,0.15,'sine'); }); }
function sWin(){ withAudio(function(c){ const t=c.currentTime+0.03;
  [523.25,659.25,783.99,1046.5].forEach(function(f,i){
    tone(c,f,t+i*0.13,i===3?0.6:0.18,i===3?0.3:0.24,'triangle'); }); }); }
function toggleSound(){
  soundOn=!soundOn;
  document.getElementById('snd-btn').textContent = soundOn ? '🔊 소리 켜짐' : '🔇 소리 꺼짐';
}

/* ===== 게임 ===== */
let deck=[], first=null, lock=false, matched=0, tries=0, startAt=0, timer=null, peeking=false;

function shuffle(a){
  a=a.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function fmt(sec){
  const m=Math.floor(sec/60), s=sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function tick(){
  const sec=Math.floor((Date.now()-startAt)/1000);
  document.getElementById('s-time').textContent=fmt(sec);
}

function setDiff(p, btn) {
  if (lock || peeking) return;
  PAIRS = p;
  document.querySelectorAll('.diff-btn').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  document.getElementById('grid').dataset.diff = p;
  newGame();
}

function newGame(){
  if(timer){ clearInterval(timer); timer=null; }
  first=null; lock=false; matched=0; tries=0; peeking=false;
  document.getElementById('s-match').textContent='0';
  document.getElementById('s-try').textContent='0';
  document.getElementById('s-time').textContent='00:00';
  document.getElementById('done-box').classList.add('hidden');
  showTop3();

  const picked = shuffle(COUNTRIES).slice(0, PAIRS);
  deck = shuffle(picked.concat(picked));

  const grid=document.getElementById('grid');
  grid.innerHTML='';
  deck.forEach(function(c,i){
    const el=document.createElement('div');
    el.className='card';
    el.dataset.code=c[0];
    el.dataset.idx=i;
    
    el.innerHTML =
      '<div class="inner">'
    +   '<div class="face back">🌍</div>'
    +   '<div class="face front">'
    +     '<img src="https://flagcdn.com/w160/'+c[0]+'.png" alt="'+c[1]+' 국기" '
    +          'onerror="this.onerror=null; this.src=\'https://cdn.jsdelivr.net/gh/lipis/flag-icons/flags/4x3/'+c[0]+'.svg\';">'
    +     '<div class="nm">'+c[1]+'</div>'
    +   '</div>'
    + '</div>';
    el.onclick=function(){ flip(el); };
    grid.appendChild(el);
  });

  startAt=Date.now();
  timer=setInterval(tick,500);
}

function flip(el){
  if(lock || peeking) return;
  if(el.classList.contains('done') || el.classList.contains('open')) return;

  el.classList.add('open');
  sFlip();

  if(!first){ first=el; return; }

  tries++;
  document.getElementById('s-try').textContent=tries;

  if(first.dataset.code === el.dataset.code){
    const a=first, b=el; first=null;
    setTimeout(function(){
      a.classList.add('done'); b.classList.add('done');
      a.classList.remove('open'); b.classList.remove('open');
      matched++;
      document.getElementById('s-match').textContent=matched;
      sMatch();
      if(matched===PAIRS) finish();
    }, 320);
  } else {
    lock=true;
    const a=first, b=el; first=null;
    a.classList.add('miss'); b.classList.add('miss');
    sMiss();
    setTimeout(function(){
      a.classList.remove('open','miss'); b.classList.remove('open','miss');
      lock=false;
    }, 850);
  }
}

function peek(){
  if(peeking || lock) return;
  peeking=true;
  const cards=Array.prototype.slice.call(document.querySelectorAll('.card:not(.done)'));
  cards.forEach(function(c){ c.classList.add('open'); });
  setTimeout(function(){
    cards.forEach(function(c){ if(!c.classList.contains('done')) c.classList.remove('open'); });
    peeking=false;
  }, 1500);
}

function finish(){
  if(timer){ clearInterval(timer); timer=null; }
  const sec=Math.floor((Date.now()-startAt)/1000);
  sWin(); popConfetti();

  let top3 = getTop3();
  let isNewRecord = false;
  
  /* TOP 3 기록 진입 조건 확인 (기록이 3개 미만이거나, 3등보다 시간이 짧거나, 시간이 같지만 횟수가 적은 경우) */
  if (top3.length < 3 || sec < top3[top3.length - 1].sec) {
      isNewRecord = true;
  } else if (sec === top3[top3.length - 1].sec && tries < top3[top3.length - 1].tries) {
      isNewRecord = true;
  }

  let msg = '뒤집은 횟수 '+tries+'번 · 걸린 시간 '+fmt(sec);

  if (isNewRecord) {
      msg += '<br>🏆 <b>명예의 전당 TOP 3 기록 달성!</b>';
      
      // 렌더링이 먼저 될 수 있도록 약간의 지연 후 prompt 띄움
      setTimeout(function() {
          let nick = prompt("🎉 축하합니다! 명예의 전당(TOP 3)에 올랐습니다!\n전광판에 등록할 닉네임을 입력해주세요 (최대 8글자):", "익명");
          if (nick === null || nick.trim() === '') nick = "익명";
          nick = nick.substring(0, 8); 

          top3.push({name: nick, sec: sec, tries: tries});
          
          // 시간 오름차순, 시간이 같으면 횟수 오름차순 정렬
          top3.sort(function(a, b){
              if(a.sec !== b.sec) return a.sec - b.sec;
              return a.tries - b.tries;
          });
          top3 = top3.slice(0, 3); // 3등까지만 유지
          setTop3(top3);
          showTop3();
      }, 100);
  }

  document.getElementById('done-msg').innerHTML=msg;
  document.getElementById('done-box').classList.remove('hidden');
  document.getElementById('done-box').scrollIntoView({behavior:'smooth',block:'center'});
}

/* 최고 기록 전광판 (난이도별 저장) */
function getTop3Key(){ return 'sambun-flag-memory-top3-' + PAIRS; }
function getTop3(){ 
    try { return JSON.parse(localStorage.getItem(getTop3Key()) || '[]'); } 
    catch(e) { return []; } 
}
function setTop3(arr){ 
    try { localStorage.setItem(getTop3Key(), JSON.stringify(arr)); } catch(e){} 
}
function showTop3(){
  const arr = getTop3();
  const sbList = document.getElementById('sb-list');
  
  if (arr.length === 0) {
      sbList.innerHTML = '<div class="sb-empty">아직 기록이 없어요. 첫 도전자가 되어보세요!</div>';
      return;
  }
  
  let html = '';
  const medals = ['🥇', '🥈', '🥉'];
  for(let i=0; i<3; i++) {
      if(arr[i]) {
          html += '<div class="sb-item">' +
                    '<div><span class="sb-rank">' + medals[i] + '</span> <span class="sb-name">' + esc(arr[i].name) + '</span></div>' +
                    '<span class="sb-score">' + fmt(arr[i].sec) + ' (' + arr[i].tries + '회)</span>' +
                  '</div>';
      }
  }
  sbList.innerHTML = html;
}

/* 색종이 */
const cv=document.getElementById('confetti'), cx=cv.getContext('2d');
let bits=[];
function sizeCv(){ cv.width=innerWidth; cv.height=innerHeight; }
sizeCv(); addEventListener('resize', sizeCv);
function popConfetti(){
  const cols=['#FF90B3','#FFD467','#5FD0B0','#A98BE0','#7FC4E8','#FFAC7D'];
  for(let i=0;i<90;i++) bits.push({
    x:innerWidth/2+(Math.random()-0.5)*260, y:innerHeight*0.3+(Math.random()-0.5)*60,
    vx:(Math.random()-0.5)*8, vy:Math.random()*-10-3, s:6+Math.random()*7,
    c:cols[Math.floor(Math.random()*cols.length)], rot:Math.random()*Math.PI,
    vr:(Math.random()-0.5)*0.3, life:100 });
  requestAnimationFrame(drawConfetti);
}
function drawConfetti(){
  cx.clearRect(0,0,cv.width,cv.height);
  bits=bits.filter(function(b){ return b.life>0; });
  bits.forEach(function(b){
    b.x+=b.vx; b.y+=b.vy; b.vy+=0.33; b.rot+=b.vr; b.life--;
    cx.save(); cx.translate(b.x,b.y); cx.rotate(b.rot);
    cx.fillStyle=b.c; cx.globalAlpha=Math.min(1,b.life/30);
    cx.fillRect(-b.s/2,-b.s/2,b.s,b.s*0.6); cx.restore();
  });
  if(bits.length) requestAnimationFrame(drawConfetti);
  else cx.clearRect(0,0,cv.width,cv.height);
}

document.addEventListener('pointerdown', function(){ withAudio(function(){}); }, {once:true});
document.getElementById('grid').dataset.diff = PAIRS;
newGame();
