<script>
/* ===== 단원 배정 (교과서 차시 비중에 맞춰 90일 분배) ===== */
const UNITS = [
  { n:1, name:"분수의 나눗셈", days:16 },
  { n:2, name:"소수의 나눗셈", days:16 },
  { n:3, name:"공간과 입체",   days:13 },
  { n:4, name:"비례식과 비례배분", days:16 },
  { n:5, name:"원의 넓이",     days:15 },
  { n:6, name:"원기둥, 원뿔, 구", days:14 }
];
const DAY_UNIT = [];
UNITS.forEach(u=>{ for(let i=0;i<u.days;i++) DAY_UNIT.push(u); });

/* ===== 날짜 고정 난수 ===== */
function rng(seed){
  let s = seed % 2147483647; if(s<=0) s += 2147483646;
  return ()=>{ s = (s*16807) % 2147483647; return (s-1)/2147483646; };
}
const ri = (r,a,b)=> a + Math.floor(r()*(b-a+1));
const gcd = (a,b)=> b ? gcd(b,a%b) : a;

/* ===== 표시 도우미 ===== */
function frac(n,d){ return '<span class="frac"><span class="n">'+n+'</span><span class="d">'+d+'</span></span>'; }
function mixed(w,n,d){ return w ? '<span class="mixed">'+w+frac(n,d)+'</span>' : frac(n,d); }
function fracStr(n,d){                       // 답: 기약분수 → 대분수
  const g = gcd(n,d); n/=g; d/=g;
  if(d===1) return ""+n;
  if(n>d){ const w=Math.floor(n/d); return w+"와 "+(n%d)+"/"+d; }
  return n+"/"+d;
}
function round2(x){ return Math.round(x*100)/100; }
function won(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

/* ===== 수학 문제 생성기 : 계산 8문제 + 문장제 2문제 ===== */
function pickN(r, arr, n){
  const pool = arr.slice(), out = [];
  for(let i=0;i<n && pool.length;i++) out.push(pool.splice(Math.floor(r()*pool.length),1)[0]);
  return out;
}

/* ---------- 3단원 : 공간과 입체 ---------- */
function makeGrid(r){
  const g=[[0,0,0],[0,0,0],[0,0,0]]; let tot=0;
  for(let i=0;i<3;i++) for(let j=0;j<3;j++){ const v=ri(r,0,3); g[i][j]=v; tot+=v; }
  if(tot<4){ g[1][1]=3; g[2][0]=2; tot=0; for(let i=0;i<3;i++) for(let j=0;j<3;j++) tot+=g[i][j]; }
  let rows='';
  for(let i=0;i<3;i++){ rows+='<tr>';
    for(let j=0;j<3;j++){ const v=g[i][j]; rows+='<td'+(v?'':' class="zero"')+'>'+(v||'0')+'</td>'; }
    rows+='</tr>'; }
  const html='<div class="grid-cap">↑ 뒤</div><table class="grid3">'+rows+'</table><div class="grid-cap">↓ 앞</div>';
  return {g, tot, html};
}

       return {q:''+h+'시간에 '+(h*s)+' km를 가는 자전거가 같은 빠르기로 '+(h*t)+'시간 동안 가는 거리는?', a:(h*t*s)+' km'}; },
  r=>{ const a=ri(r,1,6), b=ri(r,1,6), m=ri(r,5,20), T=(a+b)*m;
       return {q:'우유 '+T+' mL를 형과 동생이 '+a+' : '+b+' 으로 나누어 마셨습니다. 동생이 마신 양은?', a:(b*m)+' mL'}; }
];

/* ---------- 5단원 : 원의 넓이 ---------- */
const PI = 3.14;
const C5 = [
  r=>{ const rad=ri(r,2,20); return {q:'반지름 '+rad+' cm인 원의 <b>원주</b>', a:round2(2*PI*rad)+' cm'}; },
  r=>{ const d=ri(r,4,30);   return {q:'지름 '+d+' cm인 원의 <b>원주</b>', a:round2(PI*d)+' cm'}; },
  r=>{ const rad=ri(r,2,18); return {q:'반지름 '+rad+' cm인 원의 <b>넓이</b>', a:round2(PI*rad*rad)+' cm²'}; },
  r=>{ const rad=ri(r,2,12); return {q:'지름 '+(rad*2)+' cm인 원의 <b>넓이</b>', a:round2(PI*rad*rad)+' cm²'}; },
  r=>{ const rad=ri(r,3,15); return {q:'원주가 '+round2(2*PI*rad)+' cm인 원의 <b>지름</b>', a:(rad*2)+' cm'}; },
  r=>{ const rad=ri(r,3,15); return {q:'원주가 '+round2(2*PI*rad)+' cm인 원의 <b>반지름</b>', a:rad+' cm'}; },
  r=>{ const rad=ri(r,3,14); return {q:'반지름 '+rad+' cm인 <b>반원</b>의 넓이', a:round2(PI*rad*rad/2)+' cm²'}; },
  r=>{ const rad=ri(r,4,16); return {q:'반지름 '+rad+' cm인 원의 <b>4분의 1</b> 넓이', a:round2(PI*rad*rad/4)+' cm²'}; },
  r=>{ const rad=ri(r,3,12); return {q:'반지름 '+rad+' cm인 <b>반원</b>의 둘레 (곡선+지름)', a:round2(PI*rad+2*rad)+' cm'}; },
  r=>{ const R=ri(r,6,14), rr=ri(r,2,R-3);
       return {q:'반지름 '+R+' cm 원에서 반지름 '+rr+' cm 원을 뺀 <b>도넛 넓이</b>', a:round2(PI*(R*R-rr*rr))+' cm²'}; }
];
const W5 = [
  r=>{ const rad=ri(r,3,15), who=nm(r);
       return {q:who+'이(가) 반지름 '+rad+' cm인 원 모양 접시의 둘레에 띠를 두르려고 합니다. 띠는 몇 cm 필요한가요?',
               a:round2(2*PI*rad)+' cm'}; },
  r=>{ const rad=ri(r,4,12);
       return {q:'반지름이 '+rad+' m인 원 모양 꽃밭이 있습니다. 꽃밭의 넓이는 몇 m²인가요?', a:round2(PI*rad*rad)+' m²'}; },
  r=>{ const d=ri(r,4,20);
       return {q:'지름이 '+d+' cm인 피자를 반으로 잘랐습니다. 반쪽의 넓이는 몇 cm²인가요?', a:round2(PI*(d/2)*(d/2)/2)+' cm²'}; },
  r=>{ const rad=ri(r,3,10), n=ri(r,2,5);
       return {q:'반지름 '+rad+' cm인 원 모양 컵받침 '+n+'개의 넓이를 모두 합하면 몇 cm²인가요?', a:round2(PI*rad*rad*n)+' cm²'}; },
  r=>{ const rad=ri(r,5,15);
       return {q:'굴렁쇠의 반지름이 '+rad+' cm입니다. 한 바퀴 굴렀을 때 굴러간 거리는 몇 cm인가요?', a:round2(2*PI*rad)+' cm'}; },
  r=>{ const rad=ri(r,4,10), n=ri(r,2,6);
       return {q:'반지름 '+rad+' cm인 굴렁쇠가 '+n+'바퀴 굴렀습니다. 굴러간 거리는 몇 cm인가요?', a:round2(2*PI*rad*n)+' cm'}; },
  r=>{ const s=ri(r,6,20);
       return {q:'한 변이 '+s+' cm인 정사각형 안에 꼭 맞는 원의 넓이는 몇 cm²인가요?', a:round2(PI*(s/2)*(s/2))+' cm²'}; }
];

/* ---------- 6단원 : 원기둥, 원뿔, 구 ---------- */
const C6 = [
  r=>{ const rad=ri(r,2,12); return {q:'밑면 반지름 '+rad+' cm 원기둥의 <b>옆면 가로</b>', a:round2(2*PI*rad)+' cm'}; },
  r=>{ const rad=ri(r,2,10), h=ri(r,3,18); return {q:'밑면 반지름 '+rad+', 높이 '+h+' cm 원기둥의 <b>옆면 넓이</b>', a:round2(2*PI*rad*h)+' cm²'}; },
  r=>{ const rad=ri(r,2,12); return {q:'밑면 반지름 '+rad+' cm 원기둥의 <b>한 밑면의 넓이</b>', a:round2(PI*rad*rad)+' cm²'}; },
  r=>{ const rad=ri(r,2,9), h=ri(r,3,15);
       return {q:'밑면 반지름 '+rad+', 높이 '+h+' cm 원기둥의 <b>겉넓이</b>', a:round2(2*PI*rad*rad+2*PI*rad*h)+' cm²'}; },
  r=>{ const rad=ri(r,3,15); return {q:'반지름 '+rad+' cm 구를 반으로 자른 <b>단면의 넓이</b>', a:round2(PI*rad*rad)+' cm²'}; },
  r=>{ const rad=ri(r,3,15); return {q:'반지름 '+rad+' cm 구의 <b>가장 큰 단면의 둘레</b>', a:round2(2*PI*rad)+' cm'}; },
  r=>{ const rad=ri(r,2,10), h=ri(r,4,16);
       return {q:'밑면 반지름 '+rad+', 높이 '+h+' cm 원기둥의 <b>옆면 세로</b>', a:h+' cm'}; },
  r=>{ const pick=ri(r,0,2);
       const t=[['원기둥','밑면이 2개이고 서로 평행하며 합동인 원'],
                ['원뿔','밑면이 1개이고 뾰족한 꼭짓점이 있음'],
                ['구','어느 방향으로 잘라도 단면이 항상 원']][pick];
       return {q:'설명에 알맞은 입체도형 — “'+t[1]+'”', a:t[0]}; },
  r=>{ const pick=ri(r,0,2);
       const t=[['원기둥','2개'],['원뿔','1개'],['구','0개']][pick];
       return {q:pick===2?'<b>구</b>의 밑면은 몇 개인가요?':'<b>'+t[0]+'</b>의 밑면은 몇 개인가요?', a:t[1]}; },
  r=>{ const rad=ri(r,3,12); return {q:'지름 '+(rad*2)+' cm 구의 반지름', a:rad+' cm'}; }
];
const W6 = [
  r=>{ const rad=ri(r,3,10), h=ri(r,5,20);
       return {q:'밑면 반지름 '+rad+' cm, 높이 '+h+' cm인 원기둥 모양 통의 옆면에 종이를 한 바퀴 두르려고 합니다. 종이의 넓이는?',
               a:round2(2*PI*rad*h)+' cm²'}; },
  r=>{ const rad=ri(r,3,9), h=ri(r,6,20), who=nm(r);
       return {q:who+'이(가) 반지름 '+rad+' cm, 높이 '+h+' cm인 원기둥 통에 라벨을 붙이려 합니다. 라벨의 가로 길이는?',
               a:round2(2*PI*rad)+' cm'}; },
  r=>{ const rad=ri(r,4,12);
       return {q:'반지름 '+rad+' cm인 공을 정확히 반으로 잘랐을 때 나타나는 원의 넓이는?', a:round2(PI*rad*rad)+' cm²'}; },
  r=>{ const rad=ri(r,3,8), h=ri(r,5,15);
       return {q:'반지름 '+rad+' cm, 높이 '+h+' cm인 원기둥 모양 상자를 포장지로 완전히 감싸려면 몇 cm²가 필요한가요?',
               a:round2(2*PI*rad*rad+2*PI*rad*h)+' cm²'}; },
  r=>{ const rad=ri(r,3,10);
       return {q:'직사각형을 한 변을 축으로 돌려 원기둥을 만들었습니다. 밑면 반지름이 '+rad+' cm라면 밑면의 넓이는?',
               a:round2(PI*rad*rad)+' cm²'}; },
  r=>{ const rad=ri(r,4,12);
       return {q:'반원을 지름을 축으로 한 바퀴 돌리면 어떤 입체도형이 되나요? 그 도형의 반지름이 '+rad+' cm일 때 가장 큰 단면의 넓이는?',
               a:'구, '+round2(PI*rad*rad)+' cm²'}; }
];

/* ---------- 하루치 문제 만들기 ---------- */
function makeMath(unit, r){
  const CALC=[C1,C2,C3,C4,C5,C6][unit-1];
  const WORD=[W1,W2,W3,W4,W5,W6][unit-1];
  if(unit===3){
    const G = makeGrid(r);
    return { grid:G.html,
             calc: pickN(r,C3,8).map(f=>f(r,G)),
             word: pickN(r,W3,2).map(f=>f(r,G)) };
  }
  return { grid:null,
           calc: pickN(r,CALC,8).map(f=>f(r)),
           word: pickN(r,WORD,2).map(f=>f(r)) };
}

/* ===== 그리기 ===== */
let showAns=false;

function moveDay(d){
  const el=document.getElementById("day");
  el.value = Math.max(1, Math.min(90, (parseInt(el.value,10)||1)+d));
  render();
}
function todayDay(){
  // 2학기 시작을 8월 20일로 보고 그날부터 며칠째인지 (주말 제외 없이 단순 계산)
  const now=new Date(); const start=new Date(now.getFullYear(),7,20);
  let d=Math.floor((now-start)/86400000)+1;
  if(d<1||d>90) d=1;
  document.getElementById("day").value=d; render();
}
function toggleAnswer(){
  showAns=!showAns;
  document.getElementById("ans-btn").textContent = showAns ? "📝 활동지로 돌아가기" : "✅ 답지 보기";
  render();
}

function render(){
  let day = parseInt(document.getElementById("day").value,10) || 1;
  day = Math.max(1, Math.min(90, day));
  document.getElementById("day").value = day;

  const unit = DAY_UNIT[day-1];
  document.getElementById("unit-tag").textContent =
    "수학 " + unit.n + "단원 · " + unit.name;

  const r = rng(day*7919 + 13);
  const M = makeMath(unit.n, r);
  const h1 = HJ[((day-1)*2) % HJ.length];
  const h2 = HJ[((day-1)*2+1) % HJ.length];
  const my = MS[(day-1) % MS.length];
  const isReview = day > MS.length;

  let html = '';
  html += '<div class="sheet-head"><div>'
        + '<h1 class="sheet-title">🌅 아침을 여는 활동지</h1>'
        + '<div class="sheet-sub">6학년 2학기 · 제 '+day+' 일차'
        + (showAns ? ' <span style="color:var(--pink-d)">— 답지</span>' : '') + '</div></div>'
        + '<div class="namebox"><span>날짜 <b class="u-line"></b></span>'
        + '<span>이름 <b class="u-line"></b></span></div></div>';

  /* 수학 */
  html += '<div class="sec"><div class="sec-head"><span class="sec-ico m">🧮</span>'
        + '<h3>수학</h3><span class="tag">'+unit.n+'단원 · '+unit.name+'</span></div>';
  if(M.grid) html += '<div class="gridbox">'+M.grid+'</div>';
  html += '<table class="calc-grid">';
  for(var k=0;k<M.calc.length;k+=2){
    html += '<tr>';
    for(var j=k;j<k+2;j++){
      if(j<M.calc.length){
        var o=M.calc[j];
        html += '<td><div class="q"><div class="q-txt"><span class="q-num">'+(j+1)+'</span>'+o.q+'</div>'
              + (showAns ? '<div class="q-ans ans-shown">'+o.a+'</div>' : '<div class="q-ans"></div>')
              + '</div></td>';
      } else html += '<td></td>';
    }
    html += '</tr>';
  }
  html += '</table><div class="word-lbl">✏️ 문장을 읽고 풀어 보세요</div>';
  M.word.forEach(function(o,i){
    html += '<div class="q word"><div class="q-txt"><span class="q-num w">'+(9+i)+'</span>'+o.q+'</div>'
          + (showAns ? '<div class="q-ans ans-shown">답 : '+o.a+'</div>' : '<div class="q-ans"></div>')
          + '</div>';
  });
  html += '</div>';

  /* 한자 */
  html += '<div class="sec"><div class="sec-head"><span class="sec-ico h">✍️</span>'
        + '<h3>한자 쓰기</h3><span class="tag">오늘의 두 글자</span></div><div class="hanja-wrap">';
  [h1,h2].forEach(h=>{
    html += '<div class="hanja"><div class="hanja-top"><div class="hanja-big">'+h.c+'</div>'
          + '<div class="hanja-info"><b>'+h.h+' '+h.s+'</b><div>'+h.w+' ('+h.m+')</div></div></div>'
          + '<div class="trace"><span class="model">'+h.c+'</span>'
          + (showAns ? '<span class="model">'+h.c+'</span><span class="model">'+h.c+'</span><span class="model">'+h.c+'</span>'
                     : '<span></span><span></span><span></span>')
          + '</div></div>';
  });
  html += '</div></div>';

  /* 명심보감 */
  html += '<div class="sec"><div class="sec-head"><span class="sec-ico b">📜</span>'
        + '<h3>명심보감</h3><span class="tag">'+(isReview?'복습':'새 구절')+' · '+my.f+'</span></div>'
        + '<div class="myung"><div class="myung-k">'+my.k+'</div>'
        + '<div class="myung-r">'+my.r+'</div>'
        + (showAns
            ? '<div class="myung-t"><b>뜻</b> — '+my.t+'</div>'
            : '<div class="myung-t"><b>뜻</b> — '+my.t+'</div>')
        + '<div class="myung-f">출전 : 명심보감 '+my.f+'</div>'
        + '<div class="write-line"><div class="write-lbl">📖 소리 내어 읽고, 아래에 따라 써 보세요.</div>'
        + (showAns
            ? '<div style="border:none;height:auto;color:var(--pink-d);font-weight:700;">'+my.k+'</div>'
              +'<div style="border:none;height:auto;color:var(--pink-d);font-weight:700;">'+my.r+'</div>'
            : '<div></div><div></div>')
        + '</div></div></div>';

  html += '<div class="foot">오늘도 힘차게 시작해요! 💪  ('+day+' / 90 일차)</div>';
  document.getElementById("sheet").innerHTML = html;
}

document.getElementById("day").addEventListener("keydown", e=>{ if(e.key==="Enter") render(); });
render();
</script>
</body>
</html>
