<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>커리어 나침반</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #efe7d8;
    --paper-light: #faf6ec;
    --ink: #2b2a24;
    --ink-soft: #57544a;
    --rust: #7a3b2e;
    --pine: #35604f;
    --brass: #b08d3e;
    --line: rgba(43,42,36,0.18);
    --shadow: 0 10px 30px rgba(43,42,36,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 10% -10%, rgba(176,141,62,0.10), transparent 60%),
      radial-gradient(1000px 500px at 110% 10%, rgba(53,96,79,0.08), transparent 55%),
      var(--paper);
    background-attachment: fixed;
    color: var(--ink);
    font-family: 'Noto Sans KR', sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
  }
  .stage{
    width:100%;
    max-width:640px;
    position:relative;
  }
  .card{
    background: var(--paper-light);
    border: 1px solid var(--line);
    border-radius:4px;
    box-shadow: var(--shadow);
    padding:44px 40px;
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute; inset:8px;
    border:1px solid rgba(176,141,62,0.35);
    pointer-events:none;
  }
  .eyebrow{
    font-size:12px;
    letter-spacing:0.32em;
    color: var(--brass);
    font-weight:700;
    text-transform:uppercase;
  }
  h1{
    font-family:'Gowun Batang', serif;
    font-size:34px;
    line-height:1.35;
    margin:10px 0 14px;
    font-weight:700;
  }
  p.lead{
    color: var(--ink-soft);
    font-size:15.5px;
    line-height:1.75;
    margin:0 0 28px;
  }
  .btn{
    appearance:none;
    border:none;
    cursor:pointer;
    font-family:'Noto Sans KR', sans-serif;
    font-weight:700;
    font-size:15px;
    padding:14px 26px;
    border-radius:2px;
    background: var(--ink);
    color: var(--paper-light);
    letter-spacing:0.02em;
    transition: transform .15s ease, background .2s ease;
  }
  .btn:hover{ background: var(--rust); transform: translateY(-1px); }
  .btn:active{ transform: translateY(0); }
  .btn.ghost{
    background:transparent;
    color:var(--ink);
    border:1px solid var(--line);
  }
  .btn.ghost:hover{ background: rgba(43,42,36,0.06); color:var(--ink); }

  /* intro compass mark */
  .mark{
    width:78px; height:78px;
    margin:0 0 22px;
    position:relative;
  }
  .mark svg{ width:100%; height:100%; display:block; }

  /* progress trail */
  .trail{
    display:flex;
    gap:6px;
    margin-bottom:26px;
  }
  .trail .step{
    flex:1;
    height:4px;
    background: rgba(43,42,36,0.14);
    border-radius:2px;
    overflow:hidden;
  }
  .trail .step > i{
    display:block; height:100%; width:0%;
    background: var(--rust);
    transition: width .35s ease;
  }
  .trail .step.done > i{ width:100%; }
  .qmeta{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-bottom:6px;
  }
  .qmeta .num{
    font-family:'Gowun Batang', serif;
    color: var(--brass);
    font-size:14px; font-weight:700; letter-spacing:.1em;
  }
  .qmeta .stop{
    font-size:12px; color: var(--ink-soft); letter-spacing:.08em;
  }
  h2.q{
    font-family:'Gowun Batang', serif;
    font-size:23px;
    line-height:1.5;
    margin:6px 0 24px;
    font-weight:700;
  }
  .options{
    display:flex; flex-direction:column; gap:10px;
  }
  .opt{
    text-align:left;
    background: var(--paper);
    border:1px solid var(--line);
    border-radius:3px;
    padding:15px 18px;
    font-size:15px;
    line-height:1.5;
    cursor:pointer;
    display:flex; align-items:flex-start; gap:12px;
    transition: border-color .15s ease, background .15s ease, transform .1s ease;
  }
  .opt:hover{ border-color: var(--brass); background: #f4ecd9; }
  .opt:active{ transform: scale(0.995); }
  .opt .tag{
    flex:0 0 auto;
    width:22px; height:22px;
    border-radius:50%;
    border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:700; color: var(--ink-soft);
    font-family:'Gowun Batang', serif;
    margin-top:1px;
  }

  /* result */
  .result-header{ text-align:center; margin-bottom:6px; }
  .stamp-wrap{
    display:flex; justify-content:center; margin-bottom:8px;
  }
  .type-eyebrow{
    text-align:center;
    font-size:12px; letter-spacing:.28em; color:var(--brass); font-weight:700;
    text-transform:uppercase; margin-top:14px;
  }
  h1.type-name{
    text-align:center;
    margin:8px 0 6px;
  }
  p.type-blurb{
    text-align:center;
    max-width:460px;
    margin:0 auto 30px;
    color: var(--ink-soft);
    font-size:15px; line-height:1.75;
  }
  .compass-wrap{ display:flex; justify-content:center; margin-bottom:30px; }
  .jobs{
    display:flex; flex-direction:column; gap:10px; margin-bottom:8px;
  }
  .job{
    display:flex; align-items:center; gap:14px;
    background: var(--paper);
    border:1px solid var(--line);
    border-radius:3px;
    padding:14px 16px;
  }
  .job .num{
    font-family:'Gowun Batang', serif;
    font-weight:700; color: var(--rust); font-size:16px; width:22px; text-align:center;
  }
  .job .name{ font-weight:700; font-size:15px; }
  .job .desc{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
  .divider{
    border:none; border-top:1px dashed var(--line); margin:28px 0;
  }
  .secondary-note{
    font-size:13px; color:var(--ink-soft); text-align:center; margin-bottom:26px; line-height:1.7;
  }
  .actions{ display:flex; gap:10px; justify-content:center; margin-top:8px; }
  .footer-note{
    text-align:center; font-size:11.5px; color:var(--ink-soft); opacity:.75; margin-top:22px;
  }
  .hidden{ display:none !important; }

  @media (max-width:480px){
    .card{ padding:30px 22px; }
    h1{ font-size:27px; }
    h2.q{ font-size:19px; }
  }
</style>
</head>

    ]
  },
  {

    stop: "진로상담실",
    options: [
      { t:"A", label:"\"문제 풀이나 퍼즐에 몰입할 때요\"" },

      { t:"F", label:"계획표부터 짜서 알차게 하루를 보낸다" },

/* ---------------- State ---------------- */
let current = 0;
let scores = { A:0,B:0,C:0,D:0,E:0,F:0 };

/* ---------------- Screens ---------------- */
function show(id){
  ["screen-intro","screen-quiz","screen-result"].forEach(s=>{
    document.getElementById(s).classList.toggle("hidden", s!==id);
  });
}

function startQuiz(){
  current = 0;
  scores = { A:0,B:0,C:0,D:0,E:0,F:0 };
  buildTrail();
  show("screen-quiz");
  renderQuestion();
}

function buildTrail(){
  const trail = document.getElementById("trail");
  trail.innerHTML = "";
  QUESTIONS.forEach((_,i)=>{
    const step = document.createElement("div");
    step.className = "step";
    step.id = "step-"+i;
    step.innerHTML = "<i></i>";
    trail.appendChild(step);
  });
}

function updateTrail(){
  QUESTIONS.forEach((_,i)=>{
    document.getElementById("step-"+i).classList.toggle("done", i < current);
  });
}

function renderQuestion(){
  updateTrail();
  const q = QUESTIONS[current];
  document.getElementById("q-num").textContent = String(current+1).padStart(2,"0") + " / " + String(QUESTIONS.length).padStart(2,"0");
  document.getElementById("q-stop").textContent = q.stop;
  document.getElementById("q-text").textContent = q.text;

  const optWrap = document.getElementById("q-options");
  optWrap.innerHTML = "";
  const labels = ["A","B","C","D"];
  q.options.forEach((opt, idx)=>{
    const el = document.createElement("button");
    el.className = "opt";
    el.innerHTML = '<span class="tag">'+labels[idx]+'</span><span>'+opt.label+'</span>';
    el.onclick = ()=> selectOption(opt.t);
    optWrap.appendChild(el);
  });
}

function selectOption(type){
  scores[type] += 1;
  current += 1;
  if(current < QUESTIONS.length){
    renderQuestion();
  } else {
    renderResult();
  }
}

function restartQuiz(){
  startQuiz();
}

/* ---------------- Result ---------------- */
function renderResult(){
  const order = ["A","B","C","D","E","F"];
  let ranked = order.map(k=>({k, v:scores[k]})).sort((a,b)=> b.v - a.v);
  const top = ranked[0];
  const topType = TYPES[top.k];

  document.getElementById("type-name").textContent = topType.name;
  document.getElementById("type-name").style.color = topType.color;
  document.getElementById("type-blurb").textContent = topType.blurb;

  // stamp icon
  document.getElementById("result-icon").innerHTML =
    '<circle cx="36" cy="36" r="32" stroke="'+topType.color+'" stroke-width="2" fill="none"/>' +
    '<circle cx="36" cy="36" r="25" stroke="'+topType.color+'" stroke-width="1" stroke-dasharray="2 4" fill="none"/>' +
    '<text x="36" y="42" text-anchor="middle" font-family="Gowun Batang, serif" font-size="15" font-weight="700" fill="'+topType.color+'">'+topType.name.slice(0,2)+'</text>';

  // jobs
  const jobsWrap = document.getElementById("jobs");
  jobsWrap.innerHTML = "";
  topType.jobs.forEach((j, i)=>{
    const el = document.createElement("div");
    el.className = "job";
    el.innerHTML = '<span class="num">'+(i+1)+'</span><div><div class="name">'+j.name+'</div><div class="desc">'+j.desc+'</div></div>';
    jobsWrap.appendChild(el);
  });

  // secondary note if close second
  const second = ranked[1];
  const secBlock = document.getElementById("secondary-block");
  if(second.v >= top.v - 1 && second.v > 0){
    const secType = TYPES[second.k];
    secBlock.innerHTML = '<p class="secondary-note">'+topType.name+'의 기질에 <strong style="color:'+secType.color+'">'+secType.name+'</strong>의 색이 가깝게 섞여 있습니다. '+secType.jobs.map(j=>j.name).join(", ")+' 같은 방향도 함께 눈여겨볼 만합니다.</p>';
  } else {
    secBlock.innerHTML = "";
  }

  drawRadar(ranked);
  show("screen-result");
}

function drawRadar(ranked){
  const svg = document.getElementById("radar");
  const cx = 130, cy = 130, maxR = 92;
  const order = ["A","B","C","D","E","F"];
  const maxScore = Math.max(...order.map(k=>scores[k]), 1);

  function pt(i, r){
    const angle = (-90 + i*60) * Math.PI/180;
    return [cx + r*Math.cos(angle), cy + r*Math.sin(angle)];
  }

  let svgContent = "";

  // grid rings
  [0.25,0.5,0.75,1].forEach(f=>{
    let pts = order.map((_,i)=> pt(i, maxR*f).join(",")).join(" ");
    svgContent += '<polygon points="'+pts+'" fill="none" stroke="rgba(43,42,36,0.14)" stroke-width="1"/>';
  });

  // axis lines
  order.forEach((_,i)=>{
    const [x,y] = pt(i, maxR);
    svgContent += '<line x1="'+cx+'" y1="'+cy+'" x2="'+x+'" y2="'+y+'" stroke="rgba(43,42,36,0.14)" stroke-width="1"/>';
  });

  // score polygon
  let scorePts = order.map((k,i)=>{
    const r = maxR * (scores[k]/maxScore) * 0.92;
    return pt(i, Math.max(r,4)).join(",");
  }).join(" ");
  svgContent += '<polygon points="'+scorePts+'" fill="rgba(122,59,46,0.22)" stroke="#7a3b2e" stroke-width="2"/>';

  // dots + labels
  order.forEach((k,i)=>{
    const r = maxR * (scores[k]/maxScore) * 0.92;
    const [x,y] = pt(i, Math.max(r,4));
    svgContent += '<circle cx="'+x+'" cy="'+y+'" r="3.5" fill="#7a3b2e"/>';
    const [lx,ly] = pt(i, maxR + 20);
    svgContent += '<text x="'+lx+'" y="'+ly+'" text-anchor="middle" dominant-baseline="middle" font-family="Gowun Batang, serif" font-size="13" font-weight="700" fill="#2b2a24">'+TYPES[k].name+'</text>';
  });

  svg.innerHTML = svgContent;
}
</script>
