<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>최고의 남편 고르기 8선 | 3분 놀이터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css">
<script src="../assets/stats.js" defer></script>
<style>
  .vs-wrap{ display:flex; flex-direction:column; gap:12px; }
  .vs-option{
    background: var(--bg-soft); border:1.5px solid var(--line); border-radius:12px;
    padding:22px 20px; text-align:center; cursor:pointer;
    font-family:'Jua', sans-serif; font-size:18px; line-height:1.5;
    transition: all .15s ease;
  }
  .vs-option:hover{ border-color: var(--coral); background:#fff; transform: translateY(-2px); }
  .vs-divider{
    text-align:center; font-family:'Jua', sans-serif; color: var(--coral);
    font-size:13px; margin: -2px 0;
  }
  .q-num{ font-size:13px; font-weight:700; color: var(--ink-soft); letter-spacing:.06em; margin-bottom:8px; }
  .result-title{ font-family:'Jua', sans-serif; font-size:24px; text-align:center; margin: 6px 0 10px; }
  .result-blurb{ text-align:center; color: var(--ink-soft); font-size:14.5px; line-height:1.75; margin-bottom:22px; }
  .bar-row{ display:flex; align-items:center; gap:10px; margin-bottom:10px; font-size:13px; }
  .bar-track{ flex:1; height:10px; border-radius:6px; background: var(--bg-soft); overflow:hidden; }
  .bar-fill{ height:100%; background: var(--coral); }
  .actions{ display:flex; justify-content:center; gap:10px; margin-top:24px; flex-wrap:wrap; }
  .result-icon-wrap{ display:flex; justify-content:center; margin: 2px 0 14px; }
  .pros-cons{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin: 4px 0 20px; }
  .pc-col{ background:var(--bg-soft); border:1px solid var(--line); border-radius:10px; padding:14px 14px; }
  .pc-title{ font-family:'Jua',sans-serif; font-size:13.5px; margin-bottom:8px; }
  .pc-item{ font-size:12.5px; line-height:1.6; color:var(--ink-soft); margin-bottom:6px; padding-left:13px; position:relative; }
  .pc-item::before{ content:"·"; position:absolute; left:0; }
  @media (max-width:420px){ .pros-cons{ grid-template-columns:1fr; } }
  .hidden{ display:none !important; }
</style>
</head>
<body>

<div class="wrap">
  <header class="site-header">
    <a class="brand" href="../index.html">
      <svg class="brand-mark" viewBox="0 0 34 34" fill="none">
        <circle cx="17" cy="18" r="14" fill="#FAF7F0" stroke="#1D1B16" stroke-width="2"/>
        <path d="M17 9 L17 18 L23 21" stroke="#E8483C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="13" y="2" width="8" height="4" rx="1.5" fill="#1D1B16"/>
      </svg>
      <span class="brand-word">3분 놀이터</span>
    </a>
    <a class="back-link" href="../index.html">← 다른 콘텐츠 보기</a>
  </header>
</div>

<div class="content-shell">
  <div class="content-card">

    <!-- INTRO -->
    <div id="screen-intro">
      <span class="badge balance" style="margin-bottom:14px; display:inline-block;">밸런스게임</span>
      <h1 style="font-family:'Jua',sans-serif; font-size:26px; margin:0 0 12px;">최고의 남편 고르기 8선</h1>
      <p style="color:var(--ink-soft); font-size:14.5px; line-height:1.7; margin:0 0 22px;">
        능력과 다정함, 둘 다 갖춘 사람은 드물죠. 8가지 상황에서 당신이 더 끌리는 쪽을 골라보세요. 당신의 '신랑감 취향'을 알려드릴게요.
      </p>
      <button class="btn" onclick="startGame()">게임 시작</button>
    </div>

    <!-- QUIZ -->
    <div id="screen-game" class="hidden">
      <div class="progress-row" id="progress"></div>
      <div class="q-num" id="q-num"></div>
      <div class="vs-wrap">
        <div class="vs-option" id="opt-left" onclick="pick('left')"></div>
        <div class="vs-divider">VS</div>
        <div class="vs-option" id="opt-right" onclick="pick('right')"></div>
      </div>
    </div>

    <!-- RESULT -->
    <div id="screen-result" class="hidden">
      <div class="result-icon-wrap" id="result-icon"></div>
      <div class="result-title" id="result-title"></div>
      <div class="result-blurb" id="result-blurb"></div>

      <div class="pros-cons">
        <div class="pc-col">
          <div class="pc-title">👍 장점</div>
          <div id="pros-list"></div>
        </div>
        <div class="pc-col">
          <div class="pc-title">👎 단점</div>
          <div id="cons-list"></div>
        </div>
      </div>

      <div id="bars"></div>

      <hr style="border:none; border-top:1px dashed var(--line); margin:22px 0;">
      <div style="text-align:center; font-size:13px; font-weight:700; color:var(--ink-soft); margin-bottom:4px;">다른 사람들은 어떤 결과가 나왔을까요?</div>
      <div id="pie-note" style="text-align:center; font-size:11.5px; color:var(--ink-soft); margin-bottom:14px;">통계를 불러오는 중...</div>
      <div style="display:flex; justify-content:center; margin-bottom:10px;">
        <svg id="pie-chart" width="180" height="180" viewBox="0 0 180 180"></svg>
      </div>
      <div id="pie-legend" style="max-width:260px; margin:0 auto;"></div>

      <div class="actions">
        <button class="btn" onclick="shareResult()">결과 공유하기</button>
        <button class="btn ghost" onclick="restart()">다시 하기</button>
        <a class="btn" href="../index.html">다른 콘텐츠 보기</a>
      </div>
    </div>

  </div>

  <!-- 광고 슬롯 : 콘텐츠 하단 -->
  <div class="ad-slot" style="margin-top:26px;">
    <span class="ad-label">광고 영역 (콘텐츠 하단)</span>
  </div>
</div>

<footer class="site-footer wrap">
  <div>© 2026 3분 놀이터. 콘텐츠는 재미로 즐겨주세요.</div>
</footer>

<script>
function shareContent(title, text){
  const url = window.location.href;
  if(navigator.share){
    navigator.share({ title, text, url }).catch(()=>{});
  } else if(navigator.clipboard){
    navigator.clipboard.writeText(url).then(()=>{
      alert("링크가 복사됐어요! 친구에게 붙여넣어 공유해보세요 🙂");
    });
  }
}
function shareResult(){
  const title = document.getElementById("result-title").textContent;
  shareContent(
    "최고의 남편 고르기 8선 결과: " + title,
    "나는 '" + title + "'였어요! 너의 이상형은 어느 쪽이야? 👉"
  );
}

const ROUNDS = [
  { left:"돈 잘 버는 남편", right:"자상하게 챙겨주는 남편" },
  { left:"집안일 완벽한 남편", right:"말이 잘 통하는 남편" },
  { left:"매사에 계획적인 남편", right:"즉흥적이고 로맨틱한 남편" },
  { left:"무뚝뚝하지만 든든한 남편", right:"표현이 살가운 남편" },
  { left:"일에서 인정받는 남편", right:"가정에 시간 많이 쓰는 남편" },
  { left:"논리적으로 조언해주는 남편", right:"그냥 내 편 들어주는 남편" },
  { left:"재테크에 밝은 남편", right:"이벤트를 잘 챙기는 남편" },
  { left:"묵묵히 책임지는 남편", right:"매일 애정표현 하는 남편" }
];

let current = 0;
let leftCount = 0;

function show(id){
  ["screen-intro","screen-game","screen-result"].forEach(s=>{
    document.getElementById(s).classList.toggle("hidden", s!==id);
  });
}

function startGame(){
  current = 0; leftCount = 0;
  buildProgress();
  show("screen-game");
  renderRound();
}

function buildProgress(){
  const p = document.getElementById("progress");
  p.innerHTML = "";
  ROUNDS.forEach((_,i)=>{
    const seg = document.createElement("div");
    seg.className = "seg"; seg.id = "seg-"+i;
    seg.innerHTML = "<i></i>";
    p.appendChild(seg);
  });
}
function updateProgress(){
  ROUNDS.forEach((_,i)=>{
    document.getElementById("seg-"+i).classList.toggle("done", i < current);
  });
}

function renderRound(){
  updateProgress();
  const r = ROUNDS[current];
  document.getElementById("q-num").textContent = (current+1)+" / "+ROUNDS.length;
  document.getElementById("opt-left").textContent = r.left;
  document.getElementById("opt-right").textContent = r.right;
}

function pick(side){
  if(side==="left") leftCount++;
  current++;
  if(current < ROUNDS.length){
    renderRound();
  } else {
    renderResult();
  }
}

function typeIconSvg(kind, color){
  if(kind === "briefcase"){
    return '<svg width="72" height="72" viewBox="0 0 72 72" fill="none">' +
      '<rect x="12" y="26" width="48" height="34" rx="4" stroke="'+color+'" stroke-width="4"/>' +
      '<path d="M27 26 V18 a4 4 0 0 1 4 -4 h10 a4 4 0 0 1 4 4 v8" stroke="'+color+'" stroke-width="4"/>' +
      '<line x1="12" y1="40" x2="60" y2="40" stroke="'+color+'" stroke-width="4"/>' +
      '<rect x="31" y="36" width="10" height="8" rx="1.5" fill="'+color+'"/>' +
      '</svg>';
  }
  if(kind === "heart"){
    return '<svg width="72" height="72" viewBox="0 0 72 72" fill="none">' +
      '<path d="M36 58 C18 46 10 34 18 24 C24 16 34 18 36 26 C38 18 48 16 54 24 C62 34 54 46 36 58 Z" fill="'+color+'"/>' +
      '</svg>';
  }
  if(kind === "scale"){
    return '<svg width="72" height="72" viewBox="0 0 72 72" fill="none">' +
      '<line x1="36" y1="10" x2="36" y2="56" stroke="'+color+'" stroke-width="4"/>' +
      '<line x1="14" y1="20" x2="58" y2="20" stroke="'+color+'" stroke-width="4"/>' +
      '<path d="M14 20 L6 38 A10 10 0 0 0 22 38 Z" stroke="'+color+'" stroke-width="3.5" stroke-linejoin="round"/>' +
      '<path d="M58 20 L50 38 A10 10 0 0 0 66 38 Z" stroke="'+color+'" stroke-width="3.5" stroke-linejoin="round"/>' +
      '<line x1="24" y1="60" x2="48" y2="60" stroke="'+color+'" stroke-width="4" stroke-linecap="round"/>' +
      '<line x1="36" y1="56" x2="36" y2="60" stroke="'+color+'" stroke-width="4"/>' +
      '</svg>';
  }
  return "";
}

const RESULT_TYPES = {
  ability: {
    key:"ability", title:"능력자 신랑감파", color:"#E8483C", icon:"briefcase",
    blurb:"감성적인 표현보다는 든든하고 현실적인 능력을 더 중요하게 보는 편이에요. 흔들리지 않는 안정감을 최우선으로 생각하는 타입이죠. 화려한 이벤트보다 결과로 보여주는 믿음을 더 신뢰해요. 현실적인 문제 앞에서 흔들리지 않는 사람에게 끌려요. 그래서 연애보다 결혼을 염두에 둔 관계에서 특히 이런 기준이 뚜렷해져요.",
    pros:["현실적인 문제 앞에서 든든한 파트너를 고를 수 있어요","경제적 안정감을 중요하게 여기는 합리적인 기준이에요","위기 상황에서 흔들리지 않는 관계를 만들 수 있어요"],
    cons:["감정 표현이 부족해 서운함이 쌓일 수 있어요","관계의 낭만적인 면을 놓칠 수 있어요","능력만 보다가 소통의 중요성을 간과할 수 있어요"]
  },
  warm: {
    key:"warm", title:"다정한 신랑감파", color:"#F5A623", icon:"heart",
    blurb:"능력보다 마음을 표현하고 함께하는 시간을 더 중요하게 여기는 편이에요. 정서적으로 통하는 관계를 최우선으로 생각하는 타입이죠. 사소한 순간에도 다정한 말 한마디를 더 소중하게 여겨요. 함께 있을 때 편안하고 즐거운 게 무엇보다 중요해요. 그래서 표현이 서툰 상대보다는 마음을 잘 나누는 상대에게 더 끌려요.",
    pros:["정서적으로 안정적인 관계를 만들 수 있어요","소통이 잘 되는 편안한 관계를 유지해요","작은 순간에도 행복을 잘 느끼는 편이에요"],
    cons:["현실적인 문제 앞에서 우선순위가 흔들릴 수 있어요","표현에만 의존하다 실질적인 준비가 부족할 수 있어요","다정함을 당연하게 여기다 지칠 수 있어요"]
  },
  balanced: {
    key:"balanced", title:"밸런스 잡힌 신랑감파", color:"#1F6F63", icon:"scale",
    blurb:"능력과 다정함, 둘 다 놓치고 싶지 않은 균형파예요. 한쪽으로 치우치기보다 상황에 맞게 중요한 걸 판단하는 편이죠. 현실적인 문제도, 감정적인 교감도 놓치지 않으려 노력해요. 그래서 배우자를 고르는 기준이 꽤 현실적이라는 평가를 받아요. 다만 두 마리 토끼를 다 잡으려다 기준이 모호해질 때도 있어요.",
    pros:["현실과 감정, 둘 다 챙기는 균형 잡힌 시각이에요","다양한 상황에 유연하게 대처할 수 있어요","한쪽에 치우친 실망을 덜 겪는 편이에요"],
    cons:["완벽한 조합을 찾기가 현실적으로 어려울 수 있어요","기준이 너무 많아 결정이 늦어질 수 있어요","때로는 우유부단해 보일 수 있어요"]
  }
};

function renderResult(){
  const rightCount = ROUNDS.length - leftCount;
  const leftPct = Math.round((leftCount/ROUNDS.length)*100);
  const rightPct = 100 - leftPct;

  let myType;
  if(leftPct >= 70) myType = "ability";
  else if(rightPct >= 70) myType = "warm";
  else myType = "balanced";

  const t = RESULT_TYPES[myType];

  document.getElementById("result-icon").innerHTML = typeIconSvg(t.icon, t.color);
  document.getElementById("result-title").textContent = t.title;
  document.getElementById("result-title").style.color = t.color;
  document.getElementById("result-blurb").textContent = t.blurb;

  document.getElementById("pros-list").innerHTML = t.pros.map(p=> '<div class="pc-item">'+p+'</div>').join("");
  document.getElementById("cons-list").innerHTML = t.cons.map(c=> '<div class="pc-item">'+c+'</div>').join("");

  document.getElementById("bars").innerHTML =
    '<div class="bar-row"><span style="width:70px;">능력형</span><div class="bar-track"><div class="bar-fill" style="width:'+leftPct+'%;"></div></div><span>'+leftPct+'%</span></div>' +
    '<div class="bar-row"><span style="width:70px;">다정형</span><div class="bar-track"><div class="bar-fill" style="width:'+rightPct+'%; background:var(--marigold);"></div></div><span>'+rightPct+'%</span></div>';

  show("screen-result");

  if(typeof renderPlaygroundStats === "function"){
    renderPlaygroundStats({
      gameKey: "husband8",
      types: [
        { key:"ability",   label:"능력자 신랑감파",     color:"#E8483C" },
        { key:"warm",      label:"다정한 신랑감파",     color:"#F5A623" },
        { key:"balanced",  label:"밸런스 잡힌 신랑감파", color:"#1F6F63" }
      ],
      myType: myType
    });
  }
}

function restart(){ startGame(); }
</script>
</body>
</html>
