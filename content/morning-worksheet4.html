<script>
/* ===== 단원 배정 (교과서 차시 비중에 맞춰 90일 분배) ===== */
const UNITS = [
  { n:1, name:"분수의 덧셈과 뺄셈",  days:17 },
  { n:2, name:"삼각형",              days:14 },
  { n:3, name:"소수의 덧셈과 뺄셈",  days:17 },
  { n:4, name:"사각형",              days:15 },
  { n:5, name:"자료와 꺾은선그래프", days:14 },
  { n:6, name:"다각형",              days:13 }
];
const DAY_UNIT = [];
UNITS.forEach(u=>{ for(let i=0;i<u.days;i++) DAY_UNIT.push(u); });

/* ===== 날짜 고정 난수 ===== */
function rng(seed){
  let s = seed % 2147483647; if(s<=0) s += 2147483646;
  return ()=>{ s = (s*16807) % 2147483647; return (s-1)/2147483646; };
}
const ri = (r,a,b)=> a + Math.floor(r()*(b-a+1));
const gcd = (a,b)=> b ? gcd(b,a%b) : a;

/* ===== 표시 도우미 ===== */
function frac(n,d){ return '<span class="frac"><span class="n">'+n+'</span><span class="d">'+d+'</span></span>'; }
function mixed(w,n,d){ return w ? '<span class="mixed">'+w+frac(n,d)+'</span>' : frac(n,d); }
function fracStr(n,d){                       // 답: 기약분수 → 대분수
  const g = gcd(n,d); n/=g; d/=g;
  if(d===1) return ""+n;
  if(n>d){ const w=Math.floor(n/d); return w+"와 "+(n%d)+"/"+d; }
  return n+"/"+d;
}
function round2(x){ return Math.round(x*100)/100; }
function won(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

/* ===== 4학년 2학기 수학 문제 생성기 ===== */
function pickN(r, arr, n){
  const pool = arr.slice(), out = [];
  for(let i=0;i<n && pool.length;i++) out.push(pool.splice(Math.floor(r()*pool.length),1)[0]);
  return out;
}
const NAMES = ["민준","서연","도윤","지우","하준","수아","시우","하은","지호","예린","준우","다인","태현","서윤","건우","채원"];
const nm = r => NAMES[ri(r,0,NAMES.length-1)];

/* ---------- 1단원 : 분수의 덧셈과 뺄셈 (분모가 같은 분수) ---------- */
const C1 = [
  r=>{ const d=ri(r,4,12), a=ri(r,1,d-2), b=ri(r,1,d-1-a);
       return {q:frac(a,d)+' + '+frac(b,d), a:fracStr(a+b,d)}; },
  r=>{ const d=ri(r,4,10), a=ri(r,2,d-1), b=ri(r,2,d-1);

  (r,T)=>({q:'꺾은선그래프로 나타낼 때 <b>가로축</b>에 들어갈 것은?', a:'달(월)'}),
  (r,T)=>({q:'꺾은선그래프가 막대그래프보다 잘 나타내는 것은?', a:'변화하는 모습(변화의 정도)'})
];
const W5 = [
  (r,T)=>({q:''+T.title+' 자료입니다. 5월과 7월 중 어느 달이 더 많으며, 얼마나 더 많은가요?',
           a:(T.vals[2]>=T.vals[4]?'5월':'7월')+'이 '+Math.abs(T.vals[2]-T.vals[4])+' '+T.unit+' 더 많음'}),
  (r,T)=>({q:'위 자료를 꺾은선그래프로 그릴 때, 세로 눈금 한 칸을 1'+T.unit+'로 하면 가장 큰 값은 몇 칸 높이인가요?',
           a:Math.max.apply(null,T.vals)+' 칸'}),
  (r,T)=>{ const nx=T.vals[4]+ri(r,1,5);
           return {q:'8월에 '+nx+' '+T.unit+'가 되었다면, 7월보다 얼마나 늘었나요?', a:(nx-T.vals[4])+' '+T.unit}; },
  (r,T)=>({q:'다섯 달 중 값이 20 '+T.unit+' 이상인 달은 몇 번인가요?',
           a:T.vals.filter(function(v){return v>=20;}).length+' 번'}),
  (r,T)=>({q:'3월부터 7월까지 값이 가장 많이 늘어난 두 달 사이를 찾아 쓰세요.',
           a:(function(){let mi=1,mx=-1e9; for(let i=1;i<5;i++){const d=T.vals[i]-T.vals[i-1]; if(d>mx){mx=d;mi=i;}} return T.labels[mi-1]+' → '+T.labels[mi];})()}),
  (r,T)=>({q:'위 자료에서 3월과 7월의 값을 비교하면 전체적으로 늘었나요, 줄었나요?',
           a:T.vals[4]>T.vals[0]?'늘었다':(T.vals[4]<T.vals[0]?'줄었다':'같다')})
];

/* ---------- 6단원 : 다각형 ---------- */
const C6 = [
  r=>{ const n=ri(r,3,8);
       return {q:'변이 '+n+'개인 다각형의 이름', a:['','','','삼','사','오','육','칠','팔'][n]+'각형'}; },
  r=>{ const n=ri(r,4,8);
       return {q:''+['','','','삼','사','오','육','칠','팔'][n]+'각형의 <b>꼭짓점</b> 수', a:n+' 개'}; },
  r=>{ const n=ri(r,4,9);
       return {q:''+['','','','삼','사','오','육','칠','팔','구'][n]+'각형의 <b>대각선</b> 개수', a:(n*(n-3)/2)+' 개'}; },
  r=>{ const n=ri(r,3,8), s=ri(r,2,12);
       return {q:'한 변이 '+s+' cm인 정'+['','','','삼','사','오','육','칠','팔'][n]+'각형의 <b>둘레</b>', a:(n*s)+' cm'}; },
  r=>{ const n=ri(r,3,8);
       return {q:'정'+['','','','삼','사','오','육','칠','팔'][n]+'각형의 <b>한 각</b>의 크기',
               a:(Math.round((n-2)*180/n*10)/10)+'°'}; },
  r=>{ const n=ri(r,3,8);
       return {q:''+['','','','삼','사','오','육','칠','팔'][n]+'각형의 <b>모든 각의 합</b>', a:((n-2)*180)+'°'}; },
  r=>({q:'변의 길이가 모두 같고 각의 크기도 모두 같은 다각형', a:'정다각형'}),
  r=>{ const n=ri(r,3,8), L=ri(r,2,10)*n;
       return {q:'둘레가 '+L+' cm인 정'+['','','','삼','사','오','육','칠','팔'][n]+'각형의 <b>한 변</b>', a:(L/n)+' cm'}; },
  r=>({q:'대각선이 하나도 없는 다각형', a:'삼각형'}),
  r=>({q:'두 대각선의 길이가 같은 사각형 두 가지', a:'직사각형, 정사각형'}),
  r=>{ const n=ri(r,5,8);
       return {q:'정'+['','','','삼','사','오','육','칠','팔'][n]+'각형의 대각선은 모두 몇 개인가요?', a:(n*(n-3)/2)+' 개'}; }
];
const W6 = [
  r=>{ const n=ri(r,3,8), s=ri(r,3,12), who=nm(r);
       return {q:who+'이(가) 한 변이 '+s+' cm인 정'+['','','','삼','사','오','육','칠','팔'][n]+'각형 모양 종이의 테두리를 색연필로 그렸습니다. 몇 cm를 그렸나요?',
               a:(n*s)+' cm'}; },
  r=>{ const n=ri(r,4,8), L=ri(r,3,9)*n;
       return {q:'철사 '+L+' cm로 정'+['','','','삼','사','오','육','칠','팔'][n]+'각형을 만들었습니다. 한 변은 몇 cm인가요?',
               a:(L/n)+' cm'}; },
  r=>{ const n=ri(r,5,8);
       return {q:''+['','','','삼','사','오','육','칠','팔'][n]+'각형 모양 교실 바닥에 꼭짓점끼리 모두 이으면 대각선은 몇 개인가요?',
               a:(n*(n-3)/2)+' 개'}; },
  r=>{ const n=ri(r,5,8);
       return {q:'정'+['','','','삼','사','오','육','칠','팔'][n]+'각형 모양 타일의 한 각은 몇 도인가요?',
               a:(Math.round((n-2)*180/n*10)/10)+'°'}; },
  r=>{ const s=ri(r,3,10), n=ri(r,2,5);
       return {q:'한 변이 '+s+' cm인 정육각형 '+n+'개의 둘레를 모두 합하면 몇 cm인가요?', a:(6*s*n)+' cm'}; },
  r=>{ const n=ri(r,4,7);
       return {q:''+['','','','삼','사','오','육','칠'][n]+'각형의 모든 각의 크기의 합은 몇 도인가요?', a:((n-2)*180)+'°'}; }
];

/* ---------- 하루치 문제 ---------- */
function makeMath(unit, r){
  if(unit===5){
    const T = makeTable(r);
    return { grid:T.html,
             calc: pickN(r,C5,8).map(f=>f(r,T)),
             word: pickN(r,W5,2).map(f=>f(r,T)) };
  }
  const CALC=[C1,C2,C3,C4,C5,C6][unit-1];
  const WORD=[W1,W2,W3,W4,W5,W6][unit-1];
  return { grid:null,
           calc: pickN(r,CALC,8).map(f=>f(r)),
           word: pickN(r,WORD,2).map(f=>f(r)) };
}

/* ===== 그리기 ===== */
let showAns=false;

function moveDay(d){
  const el=document.getElementById("day");
  el.value = Math.max(1, Math.min(90, (parseInt(el.value,10)||1)+d));
  render();
}
function todayDay(){
  // 2학기 시작을 8월 20일로 보고 그날부터 며칠째인지 (주말 제외 없이 단순 계산)
  const now=new Date(); const start=new Date(now.getFullYear(),7,20);
  let d=Math.floor((now-start)/86400000)+1;
  if(d<1||d>90) d=1;
  document.getElementById("day").value=d; render();
}
function toggleAnswer(){
  showAns=!showAns;
  document.getElementById("ans-btn").textContent = showAns ? "📝 활동지로 돌아가기" : "✅ 답지 보기";
  render();
}

function render(){
  let day = parseInt(document.getElementById("day").value,10) || 1;
  day = Math.max(1, Math.min(90, day));
  document.getElementById("day").value = day;

  const unit = DAY_UNIT[day-1];
  document.getElementById("unit-tag").textContent =
    "수학 " + unit.n + "단원 · " + unit.name;

  const r = rng(day*7919 + 13);
  const M = makeMath(unit.n, r);
  const w1 = WD[((day-1)*3) % WD.length];
  const w2 = WD[((day-1)*3+1) % WD.length];
  const w3 = WD[((day-1)*3+2) % WD.length];
  const sd = SD[(day-1) % SD.length];

  let html = '';
  html += '<div class="sheet-head"><div>'
        + '<h1 class="sheet-title">🌅 아침을 여는 활동지</h1>'
        + '<div class="sheet-sub">4학년 2학기 · 제 '+day+' 일차'
        + (showAns ? ' <span style="color:var(--pink-d)">— 답지</span>' : '') + '</div></div>'
        + '<div class="namebox"><span>날짜 <b class="u-line"></b></span>'
        + '<span>이름 <b class="u-line"></b></span></div></div>';

  /* 수학 */
  html += '<div class="sec"><div class="sec-head"><span class="sec-ico m">🧮</span>'
        + '<h3>수학</h3><span class="tag">'+unit.n+'단원 · '+unit.name+'</span></div>';
  if(M.grid) html += '<div class="gridbox">'+M.grid+'</div>';
  html += '<table class="calc-grid">';
  for(var k=0;k<M.calc.length;k+=2){
    html += '<tr>';
    for(var j=k;j<k+2;j++){
      if(j<M.calc.length){
        var o=M.calc[j];
        html += '<td><div class="q"><div class="q-txt"><span class="q-num">'+(j+1)+'</span>'+o.q+'</div>'
              + (showAns ? '<div class="q-ans ans-shown">'+o.a+'</div>' : '<div class="q-ans"></div>')
              + '</div></td>';
      } else html += '<td></td>';
    }
    html += '</tr>';
  }
  html += '</table><div class="word-lbl">✏️ 문장을 읽고 풀어 보세요</div>';
  M.word.forEach(function(o,i){
    html += '<div class="q word"><div class="q-txt"><span class="q-num w">'+(9+i)+'</span>'+o.q+'</div>'
          + (showAns ? '<div class="q-ans ans-shown">답 : '+o.a+'</div>' : '<div class="q-ans"></div>')
          + '</div>';
  });
  html += '</div>';

  /* 한자 */
  html += '<div class="sec"><div class="sec-head"><span class="sec-ico h">🔤</span>'
        + '<h3>오늘의 영어 단어</h3><span class="tag">세 단어</span></div><div class="word-wrap">';
  [w1,w2,w3].forEach(function(o){
    html += '<div class="eword"><div class="ew-top"><b>'+o.w+'</b><span>'+o.k+'</span></div>'
          + '<div class="ew-line">'+(showAns ? '<span class="ew-fill">'+o.w+'</span>' : '')+'</div>'
          + '<div class="ew-line">'+(showAns ? '<span class="ew-fill">'+o.w+'</span>' : '')+'</div></div>';
  });
  html += '</div></div>';

  html += '<div class="sec"><div class="sec-head"><span class="sec-ico b">🗣️</span>'
        + '<h3>오늘의 속담</h3><span class="tag">따라 쓰고 뜻 새기기</span></div>'
        + '<div class="myung"><div class="sok-p">\u201C'+sd.p+'\u201D</div>'
        + '<div class="sok-m"><b>뜻</b> \u2014 '+sd.m+'</div>'
        + '<div class="write-line"><div class="write-lbl">\u270F\uFE0F 소리 내어 읽고 아래에 따라 써 보세요.</div>'
        + (showAns
            ? '<div style="border:none;height:auto;color:var(--pink-d);font-weight:700;">'+sd.p+'</div>'
            : '<div></div><div></div>')
        + '</div></div></div>';

  html += '<div class="foot">오늘도 힘차게 시작해요! 💪  ('+day+' / 90 일차)</div>';
  document.getElementById("sheet").innerHTML = html;
}

document.getElementById("day").addEventListener("keydown", e=>{ if(e.key==="Enter") render(); });
render();
</script>
