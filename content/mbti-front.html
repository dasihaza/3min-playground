<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MBTI 학교ver(앞) | 3분 놀이터</title>
<meta name="description" content="20가지 학교 상황으로 알아보는 나의 성격 앞 두 글자. 유니콘·사자·마법사·기사 중 나는 누구일까?">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFF7FB; --card:#FFFFFF; --ink:#4A4149; --ink-soft:#948C94; --line:#F3E6EE;
    --pink:#FF9DB6; --pink-d:#E97694; --purple:#C77DFF; --mint:#5FD0B0; --lemon:#FFD36E;
    --shadow:0 3px 0 rgba(74,65,73,.09);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 8% 4%, rgba(255,211,110,.26) 0 120px, transparent 121px),
      radial-gradient(circle at 92% 8%, rgba(199,125,255,.20) 0 100px, transparent 101px),
      radial-gradient(circle at 88% 90%, rgba(95,208,176,.18) 0 110px, transparent 111px),
      var(--bg);
    background-attachment:fixed;
    color:var(--ink); font-family:'Noto Sans KR',sans-serif; min-height:100vh;
  }
  .topbar{max-width:720px;margin:0 auto;padding:14px 18px 0;display:flex;align-items:center;justify-content:space-between;}
  .topbar a{text-decoration:none;color:var(--ink);}
  .topbar .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;}
  .topbar .back{font-size:12.5px;font-weight:700;color:var(--ink-soft);border:2px solid #fff;background:#fff;padding:6px 12px;border-radius:999px;box-shadow:var(--shadow);}
  .shell{max-width:720px;margin:0 auto;padding:14px 18px 56px;}
  .card{background:var(--card);border-radius:22px;padding:22px;box-shadow:var(--shadow),0 8px 22px rgba(74,65,73,.07);margin-bottom:14px;}

  .hero{text-align:center;margin-bottom:14px;}
  .hero h1{font-family:'Jua',sans-serif;font-size:clamp(25px,5.4vw,33px);margin:0 0 5px;color:var(--pink-d);}
  .hero p{font-family:'Gaegu',cursive;font-weight:700;font-size:17px;color:var(--ink-soft);margin:0;}

  .btn{font-family:'Jua',sans-serif;border:none;cursor:pointer;font-size:17px;padding:15px 30px;
    border-radius:17px;background:var(--pink);color:#fff;box-shadow:0 5px 0 var(--pink-d);}
  .btn:active{transform:translateY(5px);box-shadow:none;}
  .btn.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--line);}
  .btn.mint{background:var(--mint);box-shadow:0 5px 0 #43AE90;}
  .btn.sm{font-size:14px;padding:11px 18px;border-radius:13px;box-shadow:0 4px 0 var(--line);}

  .faces{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:16px 0 6px;}
  .face{flex:1 1 130px;max-width:150px;background:#fff;border:3px solid var(--line);border-radius:18px;padding:14px 8px;text-align:center;}
  .face .e{font-size:34px;display:block;}
  .face .n{font-family:'Jua',sans-serif;font-size:13.5px;margin-top:5px;color:var(--ink);}

  /* 진행 막대 */
  .prog{display:flex;gap:4px;margin-bottom:14px;}
  .prog i{flex:1;height:7px;border-radius:999px;background:var(--line);}
  .prog i.on{background:var(--pink);}
  .qnum{font-family:'Jua',sans-serif;font-size:13px;color:var(--pink-d);letter-spacing:.06em;}
  .qtext{font-family:'Jua',sans-serif;font-size:20px;line-height:1.55;margin:6px 0 18px;word-break:keep-all;}
  .opt{display:block;width:100%;text-align:left;background:#FFFBFD;border:3px solid var(--line);
    border-radius:16px;padding:16px 18px;margin-bottom:11px;font-size:15.5px;cursor:pointer;
    font-family:'Noto Sans KR',sans-serif;line-height:1.6;word-break:keep-all;color:var(--ink);}
  .opt:hover{border-color:var(--pink);background:#fff;}

  /* 결과 */
  .res-top{text-align:center;}
  .res-sym{font-size:72px;line-height:1;}
  .res-tag{font-family:'Gaegu',cursive;font-weight:700;font-size:16px;color:var(--ink-soft);margin-top:6px;}
  .res-name{font-family:'Jua',sans-serif;font-size:27px;margin:4px 0 2px;}
  .res-code{display:inline-block;font-family:'Jua',sans-serif;font-size:15px;padding:6px 16px;border-radius:999px;color:#fff;}
  .charts{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:20px 0 6px;}
  .chart{text-align:center;}
  .chart .lab{font-family:'Jua',sans-serif;font-size:13.5px;color:var(--ink-soft);margin-top:6px;}
  .res-text{font-size:15px;line-height:2.05;color:var(--ink);word-break:keep-all;margin-top:18px;white-space:pre-line;}
  .box{border-radius:16px;padding:15px 17px;margin-top:12px;}
  .box h3{font-family:'Jua',sans-serif;font-size:15.5px;margin:0 0 8px;}
  .box ul{margin:0;padding-left:19px;font-size:14.5px;line-height:1.95;}
  .b-good{background:#EFFBF6;border:2px solid #C7EEE1;} .b-good h3{color:#2E9B7A;}
  .b-care{background:#FFF3F6;border:2px solid #FBD8E2;} .b-care h3{color:#D9607F;}
  .b-tip{background:#F6F1FF;border:2px solid #E0D2FA;} .b-tip h3{color:#8A5BD1;}
  .acts{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:20px;}
  .others{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:16px;}
  .oth{background:#fff;border:2px solid var(--line);border-radius:14px;padding:9px 13px;font-size:12.5px;color:var(--ink-soft);}
  .hidden{display:none !important;}
  .foot{text-align:center;font-size:12px;color:var(--ink-soft);margin-top:18px;line-height:1.8;}
</style>
</head>

<div class="topbar">
  <a class="brand" href="../index.html">

</div>

<div class="shell">

  <div id="v-intro">
    <div class="hero">
      <h1>✨ 나의 성격 앞글자 찾기</h1>
      <p>스무 고개를 넘으면 내 상징이 나타나요!</p>
    </div>
    <div class="card" style="text-align:center;">
      <p style="font-size:14.5px;line-height:1.95;color:var(--ink-soft);word-break:keep-all;margin:0 0 4px;">
        학교에서 흔히 겪는 스무 가지 상황을 보고 마음이 더 끌리는 쪽을 고르면 돼요.<br>
        정답은 없어요. 지금 내 모습 그대로 골라 보세요!
      </p>
      <div class="faces">
        <div class="face"><span class="e">🦄</span><span class="n">반짝이는<br>유니콘</span></div>
        <div class="face"><span class="e">🦁</span><span class="n">용감한<br>사자</span></div>
        <div class="face"><span class="e">🔮</span><span class="n">별을 읽는<br>마법사</span></div>
        <div class="face"><span class="e">🛡️</span><span class="n">든든한<br>기사</span></div>
      </div>
      <button class="btn" style="margin-top:16px;" onclick="startTest()">시작하기</button>
    </div>
  </div>

  <div id="v-quiz" class="hidden">
    <div class="card">
      <div class="prog" id="prog"></div>
      <div class="qnum" id="q-num"></div>
      <div class="qtext" id="q-text"></div>
      <div id="q-opts"></div>
      <div style="text-align:center;margin-top:6px;">
        <button class="btn sm ghost" onclick="prevQ()" id="back-btn">← 이전 문제</button>
      </div>
    </div>
  </div>

  <div id="v-result" class="hidden">
    <div class="card">
      <div class="res-top">
        <div class="res-sym" id="r-sym"></div>
        <div class="res-name" id="r-name"></div>
        <div class="res-tag" id="r-tag"></div>
        <div style="margin-top:8px;"><span class="res-code" id="r-code"></span></div>
      </div>
      <div class="charts" id="r-charts"></div>
      <div class="res-text" id="r-text"></div>
      <div class="box b-good"><h3>🌟 이런 점이 멋져요</h3><ul id="r-good"></ul></div>
      <div class="box b-care"><h3>🌱 이런 점은 조금만</h3><ul id="r-care"></ul></div>
      <div class="box b-tip"><h3>💌 오늘의 한 걸음</h3><div id="r-tip" style="font-size:14.5px;line-height:1.9;"></div></div>
      <div class="acts">
        <button class="btn mint" onclick="shareResult()">📤 결과 공유하기</button>
        <button class="btn ghost" onclick="restart()">🔄 다시 하기</button>
        <a class="btn ghost" href="../index.html" style="text-decoration:none;display:inline-block;">다른 콘텐츠</a>
      </div>
      <div class="others" id="r-others"></div>
    </div>
  </div>

  <div class="foot">
    재미로 보는 테스트예요. 사람의 성격은 네 가지로 나뉘지 않는답니다 🙂
  </div>
</div>

/* ===== 상태 ===== */
let idx = 0;
const picks = [];          /* 각 문항에서 고른 글자 */

const $ = id => document.getElementById(id);
function show(v){
  ["v-intro","v-quiz","v-result"].forEach(x => $(x).classList.toggle("hidden", x !== v));
  window.scrollTo({top:0, behavior:"smooth"});
}

function startTest(){
  idx = 0; picks.length = 0;
  buildProg();
  show("v-quiz");
  renderQ();
}

function buildProg(){
  $("prog").innerHTML = QUESTIONS.map(function(_,i){ return '<i id="p-'+i+'"></i>'; }).join("");
}
function paintProg(){
  QUESTIONS.forEach(function(_,i){
    const el = $("p-"+i); if(el) el.classList.toggle("on", i < idx);
  });
}

function renderQ(){
  paintProg();
  const q = QUESTIONS[idx];
  $("q-num").textContent = (idx+1) + " / " + QUESTIONS.length;
  $("q-text").textContent = q.q;
  $("back-btn").style.visibility = idx === 0 ? "hidden" : "visible";
  $("q-opts").innerHTML = q.a.map(function(o,i){
    return '<button class="opt" onclick="choose(' + i + ')">' + o.t + '</button>';
  }).join("");
}

function choose(i){
  picks[idx] = QUESTIONS[idx].a[i].v;
  idx++;
  if(idx < QUESTIONS.length) renderQ();
  else showResult();
}
function prevQ(){
  if(idx > 0){ idx--; renderQ(); }
}

/* ===== 결과 ===== */
function tally(){
  const c = { E:0, I:0, N:0, S:0 };
  picks.forEach(function(v){ if(c[v] !== undefined) c[v]++; });
  return c;
}

function donut(pct, color, big, small){
  /* 원그래프 — 고른 쪽이 몇 퍼센트인지 보여줘요 */
  const R = 42, C = 2 * Math.PI * R;
  const on = C * pct / 100;
  return '<svg width="118" height="118" viewBox="0 0 118 118">'
    + '<circle cx="59" cy="59" r="'+R+'" fill="none" stroke="#F0E8EE" stroke-width="15"/>'
    + '<circle cx="59" cy="59" r="'+R+'" fill="none" stroke="'+color+'" stroke-width="15"'
    + ' stroke-linecap="round" stroke-dasharray="'+on.toFixed(1)+' '+(C-on).toFixed(1)+'"'
    + ' transform="rotate(-90 59 59)"/>'
    + '<text x="59" y="54" text-anchor="middle" font-family="Jua, sans-serif" font-size="26" fill="'+color+'">'+big+'</text>'
    + '<text x="59" y="76" text-anchor="middle" font-family="Jua, sans-serif" font-size="16" fill="#948C94">'+small+'</text>'
    + '</svg>';
}

let myCode = "EN";
function showResult(){
  const c = tally();
  const eiTot = c.E + c.I, nsTot = c.N + c.S;
  const e = eiTot ? Math.round(c.E / eiTot * 100) : 50;
  const n = nsTot ? Math.round(c.N / nsTot * 100) : 50;

  const first  = e >= 50 ? "E" : "I";
  const second = n >= 50 ? "N" : "S";
  myCode = first + second;
  const t = TYPES[myCode];

  $("r-sym").textContent = t.sym;
  $("r-name").textContent = t.name;
  $("r-tag").textContent = t.tag;
  const code = $("r-code");
  code.textContent = myCode + " 유형";
  code.style.background = t.color;

  const eiPct = first === "E" ? e : 100 - e;
  const nsPct = second === "N" ? n : 100 - n;
  $("r-charts").innerHTML =
      '<div class="chart">' + donut(eiPct, t.color, first, eiPct + "%")
    + '<div class="lab">' + (first === "E" ? "밖으로 뻗는 힘" : "안으로 모으는 힘") + '</div></div>'
    + '<div class="chart">' + donut(nsPct, t.color, second, nsPct + "%")
    + '<div class="lab">' + (second === "N" ? "상상하는 눈" : "사실을 보는 눈") + '</div></div>';

  $("r-text").textContent = t.text;
  $("r-good").innerHTML = t.good.map(function(x){ return "<li>" + x + "</li>"; }).join("");
  $("r-care").innerHTML = t.care.map(function(x){ return "<li>" + x + "</li>"; }).join("");
  $("r-tip").textContent = t.tip;

  $("r-others").innerHTML = Object.keys(TYPES).filter(function(k){ return k !== myCode; })
    .map(function(k){ return '<span class="oth">' + TYPES[k].sym + " " + TYPES[k].name + '</span>'; }).join("");

  document.body.style.background =
    "radial-gradient(circle at 10% 6%, " + t.bg + " 0 240px, transparent 241px), var(--bg)";

  show("v-result");
}

function restart(){
  document.body.style.background = "";
  startTest();
}

/* ===== 공유 ===== */
function shareResult(){
  const t = TYPES[myCode];
  const text = "나는 " + t.sym + " " + t.name + "(" + myCode + ")! 너는 어떤 상징일까?";
  const url = window.location.href;
  if(navigator.share){
    navigator.share({ title: "나의 성격 앞글자 찾기", text: text, url: url }).catch(function(){});
  } else if(navigator.clipboard){
    navigator.clipboard.writeText(text + "\n" + url).then(function(){
      alert("결과가 복사됐어요! 친구에게 붙여넣어 보세요 🙂");
    }).catch(function(){ prompt("아래 내용을 복사해 주세요", text + "\n" + url); });
  } else {
    prompt("아래 내용을 복사해 주세요", text + "\n" + url);
  }
}
