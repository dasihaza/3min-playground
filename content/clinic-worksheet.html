<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>꼬마 의사 수첩 학습지 · 감염병 10가지 | 3분 놀이터</title>
<meta name="description" content="3학년 2학기 과학 '감염병과 건강한 생활' 학습지. 튼튼 소아과 병원놀이 게임과 함께 감염병 10가지의 증상, 호흡기 감염병, 감염병의 위험성과 예방을 공부하는 귀여운 A4 인쇄용 학습지예요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--ink:#4a3b5c;--pink:#ff8fb1;--pink2:#ff6f9f;--mint:#3cc79c;--sky:#4fb4f0;--yellow:#ffd34d;--purple:#9b7ae8;--line:#f3d4e0}
*{box-sizing:border-box}
html,body{margin:0;background:#fdeef4;color:var(--ink);font-family:'Gowun Dodum',sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.jua{font-family:'Jua',sans-serif}
/* 도구 막대 */
.bar{position:sticky;top:0;z-index:10;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;padding:10px 12px;background:#fffffff0;box-shadow:0 3px 12px rgba(200,120,150,.18)}
.bar h1{font-family:'Jua';font-size:20px;margin:0 8px 0 0;color:var(--pink2)}
.bar button,.bar a{font-family:'Jua';font-size:16px;border:none;border-radius:999px;padding:9px 16px;cursor:pointer;text-decoration:none;color:#fff;background:linear-gradient(180deg,#ff9ec0,#ff6f9f);box-shadow:0 4px 0 #d14f7d}
.bar .b2{background:linear-gradient(180deg,#9be5c0,#3cc79c);box-shadow:0 4px 0 #22936f}
.bar .b3{background:linear-gradient(180deg,#8fd8ff,#4fb4f0);box-shadow:0 4px 0 #2f86c0}
.bar .b4{background:#fff;color:var(--ink);box-shadow:0 4px 0 #f0c6d6;border:2px solid #ffd5e3}
.bar button:active,.bar a:active{transform:translateY(3px);box-shadow:none}
.bar .hint{font-size:13px;color:#9a8aa8;width:100%;text-align:center}

/* A4 종이 */
.page{width:210mm;min-height:297mm;margin:18px auto;background:#fffdf8;border-radius:6px;box-shadow:0 8px 24px rgba(180,100,140,.18);padding:11mm 11mm 9mm;position:relative;overflow:hidden}
.page:before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 12px 12px,#ffe3ec 2.2px,transparent 2.8px) 0 0/22px 22px;opacity:.55;pointer-events:none}
.page>*{position:relative}
.head{display:flex;align-items:center;gap:10px;margin-bottom:5mm}
.badge{font-family:'Jua';background:var(--pink2);color:#fff;border-radius:12px;padding:4px 10px;font-size:12.5px;white-space:nowrap;text-align:center;line-height:1.25}
.title{font-family:'Jua';font-size:23px;line-height:1.15;flex:1}
.title small{display:block;font-family:'Gaegu';font-weight:700;font-size:16px;color:#9a6f8a}
.who{display:flex;gap:6px;font-family:'Jua';font-size:14px;flex:none}
.who span{border-bottom:2px dashed #e6b9c9;padding:0 2px 2px;min-width:52px}
.who span.nm{min-width:80px}
.sec{font-family:'Jua';font-size:18px;margin:4mm 0 2.5mm;display:flex;align-items:center;gap:6px}
.sec i{font-style:normal;display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--yellow);color:#7a4b00;font-size:15px}
.sec em{font-style:normal;font-family:'Gaegu';font-weight:700;font-size:15px;color:#9a6f8a;margin-left:4px}
.tipbox{font-family:'Gaegu';font-weight:700;font-size:15.5px;background:#fff4c9;border-radius:14px;padding:6px 12px;margin:0 0 3mm;line-height:1.35}
.foot{position:absolute;left:11mm;right:11mm;bottom:5mm;display:flex;justify-content:space-between;font-family:'Jua';font-size:11.5px;color:#c79ab0}

/* 1쪽: 감염병 카드 */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:3mm}
.card{display:flex;gap:3mm;align-items:center;background:#fff;border:2.5px solid var(--c);border-radius:16px;padding:1.5mm 3mm 1.5mm 2mm;min-height:40mm;box-shadow:0 3px 0 var(--c2)}
.card img{width:27mm;height:36mm;object-fit:contain;flex:none}
.card .nm{font-family:'Jua';font-size:18.5px;line-height:1.15;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.card .no{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--c);color:#fff;font-size:13px}
.resp{font-family:'Jua';font-size:11px;background:#d8efff;color:#2f86c0;border-radius:999px;padding:2px 7px}
.sym{margin:1.5mm 0 0;padding:0;list-style:none;font-size:14px;line-height:1.42;font-weight:bold}
.sym li:before{content:'✔ ';color:var(--c)}
.pv{margin-top:1.5mm;font-family:'Gaegu';font-weight:700;font-size:14px;color:#8a7a99;line-height:1.25}

/* 2쪽: 빈칸 */
.bank{display:flex;flex-wrap:wrap;gap:2mm;justify-content:center;background:#fff;border:2.5px dashed #ffc2d6;border-radius:16px;padding:3mm;margin-bottom:3mm}
.bank span{font-family:'Jua';font-size:15px;background:#fff0f6;border-radius:999px;padding:3px 11px}
.fill{display:grid;grid-template-columns:1fr 1fr;gap:2.6mm}
.frow{display:flex;gap:2.5mm;align-items:center;background:#fff;border:2px solid var(--c);border-radius:14px;padding:1.5mm 3mm 1.5mm 1.5mm;min-height:31mm}
.frow img{width:21mm;height:28mm;object-fit:contain;flex:none}
.frow .nm{font-family:'Jua';font-size:16.5px}
.frow p{margin:1mm 0 0;font-size:14.5px;line-height:1.75;font-weight:bold}
.blank{display:inline-block;min-width:17mm;border-bottom:2px solid #d9b3c4;text-align:center;font-family:'Gaegu';font-weight:700;font-size:17px;color:#ff4f8a;line-height:1.1;padding:0 2px}
.blank .a{visibility:hidden}
body.show .blank .a{visibility:visible}

/* 3쪽: 그림 보고 이름 쓰기, 호흡기 */
.pics{display:grid;grid-template-columns:repeat(5,1fr);gap:2.5mm}
.pic{background:#fff;border:2.5px solid #ffd5e3;border-radius:14px;padding:1.5mm;text-align:center}
.pic img{width:100%;height:25mm;object-fit:contain}
.pic .q{font-family:'Jua';font-size:12px;color:#ff6f9f}
.pic .ln{border-bottom:2px solid #d9b3c4;min-height:7mm;margin:1mm 1mm 0;font-family:'Gaegu';font-weight:700;font-size:15px;color:#ff4f8a;display:flex;align-items:flex-end;justify-content:center;line-height:1.05}
.pic .ln span{visibility:hidden}
body.show .pic .ln span{visibility:visible}
.match{display:grid;grid-template-columns:1fr 26mm 1fr;align-items:center;row-gap:2mm;background:#fff;border-radius:16px;padding:3mm 4mm;border:2.5px solid #cfeaff}
.match .l,.match .r{font-weight:bold;font-size:14px;background:#f4fbff;border-radius:12px;padding:1.6mm 3mm;display:flex;align-items:center;gap:2mm}
.match .r{font-family:'Jua';font-size:16px;background:#fff6fa}
.dot{width:10px;height:10px;border-radius:50%;background:#4fb4f0;flex:none}
.match .l .dot{margin-left:auto}
.match .r .dot{background:#ff8fb1}
.mline{grid-column:2;height:100%;position:relative}
.ans-only{display:none}
body.show .ans-only{display:inline}
.circ{display:flex;flex-wrap:wrap;gap:2.5mm;justify-content:center;background:#fff;border-radius:16px;padding:3mm;border:2.5px solid #cfeaff}
.circ span{font-family:'Jua';font-size:15.5px;padding:5px 12px;border-radius:999px;background:#f4fbff;border:2px solid #dbeefc}
body.show .circ span.on{border:3px solid #ff4f8a;background:#fff0f6}
.why{background:#fff;border-radius:14px;padding:2mm 4mm;margin-top:2.5mm;font-size:14px;font-weight:bold;line-height:2}
.wline{display:inline-block;border-bottom:2px solid #d9b3c4;min-width:120mm;font-family:'Gaegu';color:#ff4f8a;font-size:16px}
.wline span{visibility:hidden}
body.show .wline span{visibility:visible}

/* 4쪽: 진료 기록지 + 위험성 + 다짐 */
.rec{width:100%;border-collapse:separate;border-spacing:0;font-size:14px;background:#fff;border-radius:14px;overflow:hidden;border:2.5px solid #ffd5e3}
.rec th{font-family:'Jua';font-weight:normal;background:#ffe3ec;padding:2mm;font-size:14.5px}
.rec td{border-top:1.5px dashed #f3d4e0;padding:1.6mm;height:8.5mm;text-align:center}
.rec td:first-child{font-family:'Jua';background:#fff8fb}
.rec2 td{height:11mm}
.risk{display:grid;grid-template-columns:repeat(5,1fr);gap:2.5mm}
.rk{background:#fff;border:2.5px solid #e6dcff;border-radius:14px;overflow:hidden;text-align:center}
.rk img{width:100%;height:21mm;object-fit:cover;display:block}
.rk p{margin:1.5mm 1.5mm 2mm;font-size:13px;font-weight:bold;line-height:1.55}
.rk .blank{min-width:14mm;font-size:15px}
.prom{background:#fff;border:2.5px solid #c8f0de;border-radius:16px;padding:3mm 4mm;position:relative}
.prom .wl,.prom .end{margin-right:34mm}
.prom .tips{display:flex;flex-wrap:wrap;gap:2mm;margin-bottom:2mm}
.prom .tips span{font-size:13px;font-weight:bold;background:#eafff5;border-radius:999px;padding:3px 9px}
.wl{border-bottom:2px dashed #b9e5d2;height:9.5mm}
.stamp{position:absolute;right:3mm;bottom:3mm;width:29mm;height:29mm;border:3px dashed #ffb3cb;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:'Jua';font-size:12px;color:#e08aa8;transform:rotate(-8deg);background:#fffdf8}

/* 정답지 */
.ansgrid{display:grid;grid-template-columns:1fr 1fr;gap:3mm;font-size:14px;line-height:1.6}
.ansgrid .box{background:#fff;border-radius:14px;padding:3mm 4mm;border:2px solid #ffd5e3}
.ansgrid h4{font-family:'Jua';margin:0 0 1.5mm;font-size:16px;color:#ff6f9f}
.ansgrid b{color:#ff4f8a}
.teacher{display:none}
body.show .teacher{display:block}

@media screen and (max-width:820px){
  .page{width:auto;min-height:0;margin:12px 8px;padding:14px 12px 30px}
  .cards,.fill,.ansgrid{grid-template-columns:1fr}
  .pics{grid-template-columns:repeat(3,1fr)}
  .risk{grid-template-columns:repeat(2,1fr)}
  .head{flex-wrap:wrap}
  .wline{min-width:60vw}
  .match{grid-template-columns:1fr 12mm 1fr}
  .stamp{position:static;margin:10px auto 0}
}
@media print{
  html,body{background:#fff}
  .bar{display:none}
  .page{margin:0;box-shadow:none;border-radius:0;width:210mm;height:297mm;min-height:0;page-break-after:always;break-after:page}
  .page:last-child{page-break-after:auto;break-after:auto}
  @page{size:A4;margin:0}
}
</style>
</head>
<body>
<div class="bar">
  <h1>🩺 꼬마 의사 수첩</h1>
  <button onclick="window.print()">🖨️ 인쇄하기</button>
  <button class="b2" id="ansBtn">👀 정답 보이기</button>
  <a class="b3" href="clinic.html">🎮 게임하러 가기</a>
  <a class="b4" href="../index.html">🏠 3분 놀이터</a>
  <div class="hint">A4 4쪽 학습지 + 정답지 1쪽 · 학생용은 정답을 숨긴 채로, 선생님용은 '정답 보이기'를 누른 뒤 인쇄하세요.</div>
</div>
<main id="pages"></main>

<script>
const IMG='../assets/clinic/img/';
// 감염병 10가지 (게임과 같은 증상)
const D=[
 {k:'flu',  n:'독감',               ic:'🤒',resp:1,c:'#ff8fb1',c2:'#ffd5e3',s:['높은 열','몸살','기침'],              f:'높은 [열], [몸살], 기침',             pv:'예방 접종, 손 씻기'},
 {k:'tb',   n:'결핵',               ic:'😷',resp:1,c:'#b99cff',c2:'#e6dcff',s:['2주 이상 기침','열','가래'],          f:'[2주] 이상 기침, 열, [가래]',         pv:'기침 예절, 오래 기침하면 병원 가기'},
 {k:'pox',  n:'수두',               ic:'🔴',resp:0,c:'#ff7b7b',c2:'#ffd2d2',s:['열','가려움','붉은 물집'],            f:'열, 가려움, 붉은 [물집]',             pv:'예방 접종, 물집 긁지 않기'},
 {k:'food', n:'식중독',             ic:'🤢',resp:0,c:'#7fd36b',c2:'#d7f3cf',s:['배아픔','구토','설사'],               f:'[배아픔], 구토, [설사]',              pv:'음식 익혀 먹기, 손 씻기'},
 {k:'eye',  n:'유행성 각결막염',    ic:'👁️',resp:0,c:'#ffb347',c2:'#ffe5c2',s:['눈곱','눈이 빨개짐','가려움'],        f:'[눈곱], 눈이 빨개짐, 가려움',         pv:'손으로 눈 비비지 않기, 수건 따로 쓰기'},
 {k:'tet',  n:'파상풍',             ic:'🦵',resp:0,c:'#c9a27a',c2:'#efdfcf',s:['흙이나 못에 상처가 오염','근육이 굳어짐'], f:'[흙]이나 [못]에 상처가 오염, 근육이 [굳어짐]', pv:'상처 씻고 소독하기, 예방 접종'},
 {k:'hfmd', n:'수족구병',           ic:'✋',resp:0,c:'#ff9ec0',c2:'#ffdbe8',s:['입안과 손발에 물집'],                 f:'[입안]과 [손발]에 물집',              pv:'손 자주 씻기, 장난감 닦기'},
 {k:'foot', n:'무좀',               ic:'🦶',resp:0,c:'#e0b43a',c2:'#f7e9bd',s:['피부가 허옇게 됨','갈라짐','간지러움'], f:'피부가 [허옇게] 됨, 갈라짐, 간지러움',   pv:'발 씻고 잘 말리기'},
 {k:'pneu', n:'폐렴',               ic:'🫁',resp:1,c:'#4fb4f0',c2:'#cfeaff',s:['숨이 참','호흡이 빨라짐','고열','흉통'], f:'[숨]이 참, 호흡이 빨라짐, 고열, [흉통]', pv:'손 씻기, 예방 접종'},
 {k:'adeno',n:'아데노바이러스 감염증',ic:'🦠',resp:1,c:'#3cc79c',c2:'#c8f0de',s:['인후통','기침','콧물','눈곱','충혈'],  f:'[인후통], 기침, 콧물, 눈곱, [충혈]',   pv:'손 씻기, 기침 예절'}
];
const blankify=t=>t.replace(/\[([^\]]+)\]/g,(m,a)=>`<span class="blank"><span class="a">${a}</span></span>`);
const bankWords=[...new Set(D.flatMap(d=>[...d.f.matchAll(/\[([^\]]+)\]/g)].map(m=>m[1])))];
const shuffleFixed=(a,seed=7)=>{a=a.slice();let s=seed;for(let i=a.length-1;i>0;i--){s=(s*9301+49297)%233280;const j=Math.floor(s/233280*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const head=(no,title,sub,noWho)=>`<div class="head"><span class="badge">🩺 꼬마 의사 수첩<br>${no}</span><div class="title">${title}<small>${sub}</small></div>${noWho?'':'<div class="who"><span>3학년</span><span>반</span><span>번</span><span class="nm">이름</span></div>'}</div>`;
const foot=n=>`<div class="foot"><span>3학년 2학기 과학 · 4. 감염병과 건강한 생활</span><span>🩺 튼튼 소아과 병원놀이 · 3분 놀이터 · ${n}</span></div>`;

// 그림 보고 이름 쓰기에 쓸 순서(1쪽과 다른 아이)
const picOrder=shuffleFixed(D.map((d,i)=>i),11);
// 증상 ↔ 감염병 잇기
const MATCH_L=[['배가 아프고 토하고 설사해요','식중독'],['손바닥, 발바닥, 입안에 물집이 생겼어요','수족구병'],['발가락 사이가 허옇게 되고 갈라져요','무좀'],['녹슨 못에 찔린 뒤 근육이 굳어요','파상풍'],['눈곱이 끼고 눈이 빨갛고 가려워요','유행성 각결막염']];
const MATCH_R=shuffleFixed(MATCH_L.map(x=>x[1]),5);

const pages=[];
// ---------- 1쪽 ----------
pages.push(`<section class="page">${head('1쪽','① 감염병 10가지 알아보기','소아과 의사가 꼭 알아야 할 감염병과 증상을 읽어 봐요!')}
 <div class="tipbox">💡 <b>감염병</b>은 세균이나 바이러스 같은 병원체가 몸에 들어와 생기는 병으로, 다른 사람에게 옮을 수 있어요. 파란 <span class="resp">호흡기</span> 표시는 기침·숨쉬기와 관련된 감염병이에요.</div>
 <div class="cards">${D.map((d,i)=>`<div class="card" style="--c:${d.c};--c2:${d.c2}"><img src="${IMG}p_${d.k}_${i%2?'b':'g'}.webp" alt="${d.n}에 걸린 어린이 그림">
   <div><div class="nm"><span class="no">${i+1}</span>${d.ic} ${d.n}${d.resp?'<span class="resp">호흡기</span>':''}</div>
   <ul class="sym">${d.s.map(x=>`<li>${x}</li>`).join('')}</ul><div class="pv">🛡️ ${d.pv}</div></div></div>`).join('')}</div>
 ${foot('1')}</section>`);
// ---------- 2쪽 ----------
pages.push(`<section class="page">${head('2쪽','② 증상 빈칸 채우기 📝','1쪽을 떠올리며 빈칸에 알맞은 증상을 써 봐요!')}
 <div class="sec"><i>1</i>낱말 주머니에서 골라 빈칸을 채워요 <em>(한 번씩만 써요)</em></div>
 <div class="bank">${shuffleFixed(bankWords,3).map(w=>`<span>${w}</span>`).join('')}</div>
 <div class="fill">${D.map((d,i)=>`<div class="frow" style="--c:${d.c}"><img src="${IMG}p_${d.k}_${i%2?'g':'b'}.webp" alt=""><div><div class="nm">${d.ic} ${d.n}</div><p>${blankify(d.f)}</p></div></div>`).join('')}</div>
 ${foot('2')}</section>`);
// ---------- 3쪽 ----------
pages.push(`<section class="page">${head('3쪽','③ 어떤 감염병일까? 🔍','그림과 증상을 보고 진단해 봐요!')}
 <div class="sec"><i>1</i>그림 속 친구는 어떤 감염병일까요? 이름을 써요 <em>(그림 힌트를 잘 봐요)</em></div>
 <div class="pics">${picOrder.map((di,j)=>{const d=D[di];return `<div class="pic"><div class="q">환자 ${String.fromCharCode(9312+j)}</div><img src="${IMG}p_${d.k}_${j%2?'g':'b'}.webp" alt=""><div class="ln"><span>${d.n}</span></div></div>`;}).join('')}</div>
 <div class="sec"><i>2</i>증상과 감염병을 선으로 이어요</div>
 <div class="match">${MATCH_L.map((m,i)=>`<div class="l">${m[0]}<span class="dot"></span></div><div class="mline"></div><div class="r"><span class="dot"></span>${MATCH_R[i]}</div>`).join('')}</div>
