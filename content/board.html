<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>코딩 교육 게시판 | 3분 놀이터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css">
<style>
  .notice{
    background: rgba(59,110,168,0.10); border:1px solid rgba(59,110,168,0.3);
    border-radius:8px; padding:12px 16px; font-size:12.5px; color: var(--ink-soft);
    line-height:1.7; margin: 18px 0 6px;
  }
  .board-shell{ max-width: 640px; margin: 0 auto; padding: 6px 20px 60px; }
  .board-top{ display:flex; align-items:center; justify-content:space-between; margin: 18px 0 10px; flex-wrap:wrap; gap:10px; }
  .board-top h1{ font-family:'Jua',sans-serif; font-size:24px; margin:0; }
  .new-post-menu{ position:relative; }
  .new-post-dropdown{
    display:none; position:absolute; right:0; top:calc(100% + 6px);
    background:var(--card-bg); border:1px solid var(--line); border-radius:10px;
    box-shadow:var(--shadow); min-width:200px; overflow:hidden; z-index:10;
  }
  .new-post-dropdown.open{ display:block; }
  .new-post-dropdown a{
    display:flex; align-items:center; gap:8px; padding:11px 14px; font-size:13px;
    color:var(--ink); border-bottom:1px solid var(--line);
  }
  .new-post-dropdown a:last-child{ border-bottom:none; }
  .new-post-dropdown a:hover{ background:var(--bg-soft); }

  .post-list{ display:flex; flex-direction:column; margin-top:8px; }
  .post-row{
    display:flex; align-items:center; gap:10px;
    padding:14px 4px; border-bottom:1px solid var(--line); cursor:pointer;
  }
  .post-row:hover .post-title{ text-decoration:underline; }
  .post-icon{ font-size:17px; flex:0 0 auto; width:22px; text-align:center; }
  .post-main{ flex:1; min-width:0; }
  .post-title{
    font-size:14.5px; font-weight:500; color:var(--ink);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .post-title.owner{ color:#3B6EA8; font-weight:700; }
  .owner-tag{
    font-size:10.5px; font-weight:700; color:#3B6EA8; border:1px solid #3B6EA8;
    border-radius:999px; padding:1px 7px; margin-left:6px; vertical-align:middle;
  }
  .post-meta{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
  .post-comments{ font-size:11.5px; color:var(--ink-soft); flex:0 0 auto; }
  .empty-state, .loading-state, .error-state{ text-align:center; color:var(--ink-soft); font-size:13.5px; padding:40px 10px; line-height:1.7; }
  .error-state a{ text-decoration:underline; }

  .detail-body{ font-size:14.5px; line-height:1.8; white-space:pre-wrap; margin: 18px 0 24px; word-break:break-word; }
  .detail-title{ font-family:'Jua',sans-serif; font-size:20px; margin:6px 0 8px; }
  .comment-item{ border-top:1px solid var(--line); padding:12px 0; }
  .comment-meta{ font-size:12px; color: var(--ink-soft); margin-bottom:4px; }
  .comment-text{ font-size:13.5px; line-height:1.6; white-space:pre-wrap; }
  .gh-link-btn{
    display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:700;
    border:1px solid var(--line); border-radius:999px; padding:9px 16px; margin-top:14px;
  }
  .hidden{ display:none !important; }
</style>
</head>
<body>

<div class="wrap">
  <header class="site-header">
    <a class="brand" href="../index.html">
      <svg class="brand-mark" viewBox="0 0 34 34" fill="none">
        <circle cx="17" cy="18" r="14" fill="#FAF7F0" stroke="#1D1B16" stroke-width="2"/>
        <path d="M17 9 L17 18 L23 21" stroke="#E8483C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="13" y="2" width="8" height="4" rx="1.5" fill="#1D1B16"/>
      </svg>
      <span class="brand-word">3분 놀이터</span>
    </a>
    <a class="back-link" href="../index.html">← 다른 콘텐츠 보기</a>
  </header>

  <div class="notice" id="notice-banner">
    💬 이 게시판은 GitHub 저장소의 <strong>Issues</strong>를 목록으로 보여줘요. 글 작성·댓글 달기는 GitHub 로그인이 필요해요. 방문자가 많을 땐 GitHub의 무료 API 한도 때문에 목록이 잠시 안 불러와질 수 있어요.
  </div>
</div>

<div class="board-shell">

  <!-- LIST VIEW -->
  <div id="view-list">
    <div class="board-top">
      <h1>코딩 교육 게시판</h1>
      <div class="new-post-menu">
        <button class="btn" onclick="toggleNewPostMenu()">글쓰기</button>
        <div class="new-post-dropdown" id="new-post-dropdown">
          <a href="#" data-label="입문" target="_blank" rel="noopener">🐣 입문/시작 시기</a>
          <a href="#" data-label="제작후기" target="_blank" rel="noopener">🛠️ 코딩 프로그램 제작 후기</a>
          <a href="#" data-label="코딩테스트" target="_blank" rel="noopener">🧩 코딩테스트 준비</a>
          <a href="#" data-label="자녀교육" target="_blank" rel="noopener">👶 자녀 코딩 교육</a>
        </div>
      </div>
    </div>
    <div class="post-list" id="post-list">
      <div class="loading-state">글 목록을 불러오는 중...</div>
    </div>
  </div>

  <!-- DETAIL VIEW -->
  <div id="view-detail" class="hidden">
    <button class="back-link" style="display:inline-block; margin:16px 0;" onclick="showList()">← 목록으로</button>
    <div class="detail-title" id="detail-title"></div>
    <div class="post-meta" id="detail-meta"></div>
    <div class="detail-body" id="detail-body"></div>
    <a class="gh-link-btn" id="detail-gh-link" href="#" target="_blank" rel="noopener">GitHub에서 댓글 달기 →</a>

    <h3 style="font-size:14px; margin-top:26px;">댓글 <span id="comment-count"></span></h3>
    <div id="comment-list"></div>
  </div>

  <!-- 광고 슬롯 -->
  <div class="ad-slot" style="margin-top:26px;">
    <span class="ad-label">광고 영역 (게시판 하단)</span>
  </div>
</div>

<footer class="site-footer wrap">
  <div>© 2026 3분 놀이터. 콘텐츠는 재미로 즐겨주세요.</div>
</footer>

<script>
function shareContent(title, text){
  const url = window.location.href;
  if(navigator.share){
    navigator.share({ title, text, url }).catch(()=>{});
  } else if(navigator.clipboard){
    navigator.clipboard.writeText(url).then(()=>{
      alert("링크가 복사됐어요! 친구에게 붙여넣어 공유해보세요 🙂");
    });
  }
}

// ▼ 본인 저장소 값으로 이미 채워져 있어요 ▼
const REPO_OWNER = "dasihaza";
const REPO_NAME = "3min-playground";
// ▲ 여기까지 ▲

const API_BASE = "https://api.github.com/repos/" + REPO_OWNER + "/" + REPO_NAME;

const CATEGORY_MAP = [
  { keywords:["입문","시작"], icon:"🐣" },
  { keywords:["제작","후기"], icon:"🛠️" },
  { keywords:["테스트"],      icon:"🧩" },
  { keywords:["자녀"],        icon:"👶" }
];

function iconForLabels(labels){
  for(const l of labels){
    const name = l.name || "";
    for(const cat of CATEGORY_MAP){
      if(cat.keywords.some(k => name.includes(k))) return cat.icon;
    }
  }
  return "💬";
}

function escapeHtml(str){
  const div = document.createElement("div");
  div.textContent = str || "";
  return div.innerHTML;
}

function timeAgo(dateStr){
  const diffMs = Date.now() - new Date(dateStr).getTime();
  const mins = Math.floor(diffMs/60000);
  if(mins < 60) return mins+"분 전";
  const hrs = Math.floor(mins/60);
  if(hrs < 24) return hrs+"시간 전";
  const days = Math.floor(hrs/24);
  if(days < 30) return days+"일 전";
  const d = new Date(dateStr);
  return d.getFullYear()+"."+String(d.getMonth()+1).padStart(2,"0")+"."+String(d.getDate()).padStart(2,"0");
}

// 새 글쓰기 드롭다운
function toggleNewPostMenu(){
  document.getElementById("new-post-dropdown").classList.toggle("open");
}
document.addEventListener("click", (e)=>{
  const menu = document.querySelector(".new-post-menu");
  if(menu && !menu.contains(e.target)){
    document.getElementById("new-post-dropdown").classList.remove("open");
  }
});
document.querySelectorAll(".new-post-dropdown a").forEach(a=>{
  a.href = "https://github.com/" + REPO_OWNER + "/" + REPO_NAME + "/issues/new?labels=" + encodeURIComponent(a.dataset.label);
});

function showView(id){
  ["view-list","view-detail"].forEach(v=>{
    document.getElementById(v).classList.toggle("hidden", v!==id);
  });
}

function showList(){
  showView("view-list");
}

let cachedIssues = null;

async function loadPosts(){
  const listEl = document.getElementById("post-list");
  try{
    const res = await fetch(API_BASE + "/issues?state=all&sort=created&direction=desc&per_page=30");
    if(!res.ok){
      if(res.status === 403){
        listEl.innerHTML = '<div class="error-state">지금 방문자가 많아 목록을 잠시 못 불러와요.<br>잠깐 후 새로고침해보세요.</div>';
      } else {
        listEl.innerHTML = '<div class="error-state">글 목록을 불러오지 못했어요.<br><a href="https://github.com/'+REPO_OWNER+'/'+REPO_NAME+'/issues" target="_blank" rel="noopener">GitHub에서 직접 보기 →</a></div>';
      }
      return;
    }
    const data = await res.json();
    const issues = data.filter(item => !item.pull_request);
    cachedIssues = issues;

    if(issues.length === 0){
      listEl.innerHTML = '<div class="empty-state">아직 글이 없어요. 첫 글을 남겨보세요!</div>';
      return;
    }

    issues.sort((a,b)=> new Date(b.created_at) - new Date(a.created_at));

    listEl.innerHTML = "";
    issues.forEach(issue=>{
      const isOwner = issue.user && issue.user.login === REPO_OWNER;
      const row = document.createElement("div");
      row.className = "post-row";
      row.onclick = ()=> openDetail(issue.number);
      row.innerHTML =
        '<span class="post-icon">'+iconForLabels(issue.labels||[])+'</span>' +
        '<div class="post-main">' +
          '<span class="post-title'+(isOwner?' owner':'')+'">'+escapeHtml(issue.title)+'</span>' +
          (isOwner ? '<span class="owner-tag">운영자</span>' : '') +
          '<div class="post-meta">'+escapeHtml(issue.user ? issue.user.login : "익명")+' · '+timeAgo(issue.created_at)+'</div>' +
        '</div>' +
        '<span class="post-comments">💬 '+issue.comments+'</span>';
      listEl.appendChild(row);
    });
  }catch(e){
    listEl.innerHTML = '<div class="error-state">글 목록을 불러오지 못했어요.<br><a href="https://github.com/'+REPO_OWNER+'/'+REPO_NAME+'/issues" target="_blank" rel="noopener">GitHub에서 직접 보기 →</a></div>';
  }
}

async function openDetail(number){
  const issue = cachedIssues.find(i => i.number === number);
  if(!issue) return;

  const isOwner = issue.user && issue.user.login === REPO_OWNER;
  document.getElementById("detail-title").textContent = issue.title;
  document.getElementById("detail-title").style.color = isOwner ? "#3B6EA8" : "var(--ink)";
  document.getElementById("detail-meta").textContent =
    (issue.user ? issue.user.login : "익명") + (isOwner ? " · 운영자" : "") + " · " + timeAgo(issue.created_at);
  document.getElementById("detail-body").textContent = issue.body || "(내용 없음)";
  document.getElementById("detail-gh-link").href = issue.html_url;
  document.getElementById("comment-count").textContent = "("+issue.comments+")";
  document.getElementById("comment-list").innerHTML = '<div class="loading-state">댓글을 불러오는 중...</div>';

  showView("view-detail");

  try{
    const res = await fetch(API_BASE + "/issues/" + number + "/comments");
    const comments = res.ok ? await res.json() : [];
    const commentWrap = document.getElementById("comment-list");
    if(comments.length === 0){
      commentWrap.innerHTML = '<div class="empty-state" style="padding:16px 0;">아직 댓글이 없어요.</div>';
      return;
    }
    commentWrap.innerHTML = "";
    comments.forEach(c=>{
      const isCOwner = c.user && c.user.login === REPO_OWNER;
      const el = document.createElement("div");
      el.className = "comment-item";
      el.innerHTML =
        '<div class="comment-meta">'+escapeHtml(c.user ? c.user.login : "익명")+(isCOwner?' <span class="owner-tag">운영자</span>':'')+' · '+timeAgo(c.created_at)+'</div>' +
        '<div class="comment-text">'+escapeHtml(c.body)+'</div>';
      commentWrap.appendChild(el);
    });
  }catch(e){
    document.getElementById("comment-list").innerHTML = '<div class="empty-state">댓글을 불러오지 못했어요.</div>';
  }
}

loadPosts();
</script>
</body>
</html>
