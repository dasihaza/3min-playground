<script>
/* ===== 단원 배정 (교과서 차시 비중에 맞춰 90일 분배) ===== */
const UNITS = [
  { n:1, name:"수의 범위와 어림하기", days:15 },
  { n:2, name:"분수의 곱셈",        days:16 },
  { n:3, name:"합동과 대칭",        days:15 },
  { n:4, name:"소수의 곱셈",        days:16 },
  { n:5, name:"직육면체",           days:15 },
  { n:6, name:"평균과 가능성",      days:13 }
];
const DAY_UNIT = [];
UNITS.forEach(u=>{ for(let i=0;i<u.days;i++) DAY_UNIT.push(u); });

/* ===== 날짜 고정 난수 ===== */
function rng(seed){
  let s = seed % 2147483647; if(s<=0) s += 2147483646;
  return ()=>{ s = (s*16807) % 2147483647; return (s-1)/2147483646; };
}
const ri = (r,a,b)=> a + Math.floor(r()*(b-a+1));
const gcd = (a,b)=> b ? gcd(b,a%b) : a;

/* ===== 표시 도우미 ===== */
function frac(n,d){ return '<span class="frac"><span class="n">'+n+'</span><span class="d">'+d+'</span></span>'; }
function mixed(w,n,d){ return w ? '<span class="mixed">'+w+frac(n,d)+'</span>' : frac(n,d); }
function fracStr(n,d){                       // 답: 기약분수 → 대분수
  const g = gcd(n,d); n/=g; d/=g;
  if(d===1) return ""+n;
  if(n>d){ const w=Math.floor(n/d); return w+"와 "+(n%d)+"/"+d; }
  return n+"/"+d;
}
function round2(x){ return Math.round(x*100)/100; }
function won(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

/* ===== 5학년 2학기 수학 문제 생성기 ===== */
function pickN(r, arr, n){
  const pool = arr.slice(), out = [];
  for(let i=0;i<n && pool.length;i++) out.push(pool.splice(Math.floor(r()*pool.length),1)[0]);

  r=>({q:'직육면체에서 한 면과 <b>평행한</b> 면은 몇 개인가요?', a:'1 개'}),
  r=>({q:'직육면체에서 한 면과 <b>수직인</b> 면은 몇 개인가요?', a:'4 개'}),
  r=>({q:'직육면체에서 서로 <b>평행한 모서리</b>는 한 모서리마다 몇 개인가요?', a:'3 개'}),
  r=>{ const s=ri(r,2,10);
       return {q:'한 모서리가 '+s+' cm인 정육면체의 <b>부피</b>', a:(s*s*s)+' cm³'}; }
];
const W5 = [
  r=>{ const a=ri(r,3,10), b=ri(r,3,10), c=ri(r,3,10), who=nm(r);
       return {q:who+'이(가) 가로 '+a+', 세로 '+b+', 높이 '+c+' cm인 상자의 모든 모서리에 테이프를 붙였습니다. 테이프는 몇 cm 필요한가요?',
               a:(4*(a+b+c))+' cm'}; },
  r=>{ const s=ri(r,3,12);
       return {q:'한 모서리가 '+s+' cm인 주사위 모양 상자를 포장지로 겉면 전체를 감싸려면 몇 cm²가 필요한가요?',
               a:(6*s*s)+' cm²'}; },
  r=>{ const a=ri(r,2,8), b=ri(r,2,8), c=ri(r,2,8);
       return {q:'가로 '+a+', 세로 '+b+', 높이 '+c+' cm인 직육면체 상자에 한 모서리 1 cm 쌓기나무를 가득 채우면 몇 개가 들어가나요?',
               a:(a*b*c)+' 개'}; },
  r=>{ const s=ri(r,4,12);
       return {q:'한 모서리가 '+s+' cm인 정육면체 모양 상자의 전개도를 그렸습니다. 전개도 전체의 넓이는 몇 cm²인가요?',
               a:(6*s*s)+' cm²'}; },
  r=>{ const a=ri(r,3,9), b=ri(r,3,9);
       return {q:'직육면체 상자의 밑면이 가로 '+a+' cm, 세로 '+b+' cm입니다. 밑면과 평행한 면의 넓이는 몇 cm²인가요?',
               a:(a*b)+' cm²'}; },
  r=>{ const L=ri(r,60,180);
       return {q:'철사 '+L+' cm로 정육면체 모양 틀을 만들려고 합니다. 한 모서리는 몇 cm로 해야 하나요? (남는 철사 없이)',
               a:(Math.round(L/12*100)/100)+' cm'}; }
];

/* ---------- 6단원 : 평균과 가능성 ---------- */
const C6 = [
  r=>{ const a=[ri(r,5,20),ri(r,5,20),ri(r,5,20)], s=a[0]+a[1]+a[2];
       return {q:'['+a.join(', ')+'] 의 <b>평균</b>', a:(Math.round(s/3*100)/100)+''}; },
  r=>{ const a=[ri(r,10,30),ri(r,10,30),ri(r,10,30),ri(r,10,30)], s=a.reduce((x,y)=>x+y,0);
       return {q:'['+a.join(', ')+'] 의 <b>평균</b>', a:(Math.round(s/4*100)/100)+''}; },
  r=>{ const m=ri(r,10,30), n=ri(r,3,8);
       return {q:'평균이 '+m+'이고 자료가 '+n+'개일 때 <b>자료의 합</b>', a:''+(m*n)}; },
  r=>{ const m=ri(r,10,25), n=ri(r,4,6), known=[]; let s=0;
       for(let i=0;i<n-1;i++){ const v=ri(r,5,35); known.push(v); s+=v; }
       return {q:'['+known.join(', ')+', ☐] 의 평균이 '+m+'일 때 ☐의 값', a:''+(m*n-s)}; },
  r=>{ const a=[ri(r,60,100),ri(r,60,100),ri(r,60,100),ri(r,60,100),ri(r,60,100)];
       const s=a.reduce((x,y)=>x+y,0);
       return {q:'시험 점수 ['+a.join(', ')+'] 의 <b>평균</b>', a:(Math.round(s/5*100)/100)+'점'}; },
  r=>({q:'주사위를 굴릴 때 <b>7</b>의 눈이 나올 가능성을 말로', a:'불가능하다'}),
  r=>({q:'동전을 던질 때 <b>그림 면</b>이 나올 가능성을 수로', a:frac(1,2)+' (0.5)'}),
  r=>({q:'해가 <b>동쪽</b>에서 뜰 가능성을 수로', a:'1'}),
  r=>{ const n=ri(r,2,6);
       return {q:'1부터 '+(n*2)+'까지 수 카드 중 <b>짝수</b>를 뽑을 가능성을 수로', a:frac(1,2)+' (0.5)'}; },
  r=>{ const n=ri(r,3,6);
       return {q:'주사위를 굴릴 때 '+n+' 이하의 눈이 나올 가능성을 수로', a:fracStr(n,6)}; },
  r=>({q:'가능성을 나타내는 말을 작은 것부터 — 반반이다, 확실하다, 불가능하다', a:'불가능하다 → 반반이다 → 확실하다'})
];
const W6 = [
  r=>{ const n=ri(r,4,6), a=[]; let s=0;
       for(let i=0;i<n;i++){ const v=ri(r,120,180); a.push(v); s+=v; }
       return {q:'학생 '+n+'명의 키가 ['+a.join(', ')+'] cm입니다. 키의 평균은 몇 cm인가요?',
               a:(Math.round(s/n*100)/100)+' cm'}; },
  r=>{ const m=ri(r,80,95), n=ri(r,4,5), known=[]; let s=0;
       for(let i=0;i<n-1;i++){ const v=ri(r,70,100); known.push(v); s+=v; }
       const who=nm(r);
       return {q:who+'의 시험 점수가 ['+known.join(', ')+'] 점입니다. 평균 '+m+'점이 되려면 마지막 시험에서 몇 점을 받아야 하나요?',
               a:(m*n-s)+' 점'}; },
  r=>{ const d=ri(r,4,7), t=ri(r,20,60);
       return {q:''+d+'일 동안 책을 모두 '+(d*t)+'쪽 읽었습니다. 하루 평균 몇 쪽을 읽은 셈인가요?', a:t+' 쪽'}; },
  r=>{ const n=ri(r,3,6), m=ri(r,8,20);
       return {q:'모둠 '+n+'개가 각각 평균 '+m+'개의 구슬을 모았습니다. 구슬은 모두 몇 개인가요?', a:(n*m)+' 개'}; },
  r=>{ const who=nm(r);
       return {q:who+'이(가) 흰 공 3개와 검은 공 3개가 든 주머니에서 공 하나를 꺼냅니다. 흰 공이 나올 가능성을 수로 나타내세요.',
               a:frac(1,2)+' (0.5)'}; },
  r=>{ const w=ri(r,1,5), b=ri(r,1,5);
       return {q:'빨간 구슬 '+w+'개와 파란 구슬 '+b+'개가 든 주머니에서 하나를 꺼낼 때 빨간 구슬이 나올 가능성을 분수로 나타내세요.',
               a:fracStr(w,w+b)}; },
  r=>{ const n=ri(r,5,9), a=[]; let s=0;
       for(let i=0;i<n;i++){ const v=ri(r,3,15); a.push(v); s+=v; }
       return {q:''+n+'일 동안 운동한 시간이 ['+a.join(', ')+'] 분입니다. 하루 평균 운동 시간은 몇 분인가요?',
               a:(Math.round(s/n*100)/100)+' 분'}; }
];

/* ---------- 하루치 문제 ---------- */
function makeMath(unit, r){
  const CALC=[C1,C2,C3,C4,C5,C6][unit-1];
  const WORD=[W1,W2,W3,W4,W5,W6][unit-1];
  return { grid:null,
           calc: pickN(r,CALC,8).map(f=>f(r)),
           word: pickN(r,WORD,2).map(f=>f(r)) };
}

/* ===== 그리기 ===== */
let showAns=false;

function moveDay(d){
  const el=document.getElementById("day");
  el.value = Math.max(1, Math.min(90, (parseInt(el.value,10)||1)+d));
  render();
}
function todayDay(){
  // 2학기 시작을 8월 20일로 보고 그날부터 며칠째인지 (주말 제외 없이 단순 계산)
  const now=new Date(); const start=new Date(now.getFullYear(),7,20);
  let d=Math.floor((now-start)/86400000)+1;
  if(d<1||d>90) d=1;
  document.getElementById("day").value=d; render();
}
function toggleAnswer(){
  showAns=!showAns;
  document.getElementById("ans-btn").textContent = showAns ? "📝 활동지로 돌아가기" : "✅ 답지 보기";
  render();
}

function render(){
  let day = parseInt(document.getElementById("day").value,10) || 1;
  day = Math.max(1, Math.min(90, day));
  document.getElementById("day").value = day;

  const unit = DAY_UNIT[day-1];
  document.getElementById("unit-tag").textContent =
    "수학 " + unit.n + "단원 · " + unit.name;

  const r = rng(day*7919 + 13);
  const M = makeMath(unit.n, r);
  const h1 = HJ[((day-1)*2) % HJ.length];
  const h2 = HJ[((day-1)*2+1) % HJ.length];
  const my = MS[(day-1) % MS.length];
  const isReview = day > MS.length;

  let html = '';
  html += '<div class="sheet-head"><div>'
        + '<h1 class="sheet-title">🌅 아침을 여는 활동지</h1>'
        + '<div class="sheet-sub">5학년 2학기 · 제 '+day+' 일차'
        + (showAns ? ' <span style="color:var(--pink-d)">— 답지</span>' : '') + '</div></div>'
        + '<div class="namebox"><span>날짜 <b class="u-line"></b></span>'
        + '<span>이름 <b class="u-line"></b></span></div></div>';

  /* 수학 */
  html += '<div class="sec"><div class="sec-head"><span class="sec-ico m">🧮</span>'
        + '<h3>수학</h3><span class="tag">'+unit.n+'단원 · '+unit.name+'</span></div>';
  if(M.grid) html += '<div class="gridbox">'+M.grid+'</div>';
  html += '<table class="calc-grid">';
  for(var k=0;k<M.calc.length;k+=2){
    html += '<tr>';
    for(var j=k;j<k+2;j++){
      if(j<M.calc.length){
        var o=M.calc[j];
        html += '<td><div class="q"><div class="q-txt"><span class="q-num">'+(j+1)+'</span>'+o.q+'</div>'
              + (showAns ? '<div class="q-ans ans-shown">'+o.a+'</div>' : '<div class="q-ans"></div>')
              + '</div></td>';
      } else html += '<td></td>';
    }
    html += '</tr>';
  }
  html += '</table><div class="word-lbl">✏️ 문장을 읽고 풀어 보세요</div>';
  M.word.forEach(function(o,i){
    html += '<div class="q word"><div class="q-txt"><span class="q-num w">'+(9+i)+'</span>'+o.q+'</div>'
          + (showAns ? '<div class="q-ans ans-shown">답 : '+o.a+'</div>' : '<div class="q-ans"></div>')
          + '</div>';
  });
  html += '</div>';

  /* 한자 */
  html += '<div class="sec"><div class="sec-head"><span class="sec-ico h">✍️</span>'
        + '<h3>한자 쓰기</h3><span class="tag">오늘의 두 글자</span></div><div class="hanja-wrap">';
  [h1,h2].forEach(h=>{
    html += '<div class="hanja"><div class="hanja-top"><div class="hanja-big">'+h.c+'</div>'
          + '<div class="hanja-info"><b>'+h.h+' '+h.s+'</b><div>'+h.w+' ('+h.m+')</div></div></div>'
          + '<div class="trace"><span class="model">'+h.c+'</span>'
          + (showAns ? '<span class="model">'+h.c+'</span><span class="model">'+h.c+'</span><span class="model">'+h.c+'</span>'
                     : '<span></span><span></span><span></span>')
          + '</div></div>';
  });
  html += '</div></div>';

  /* 명심보감 */
  html += '<div class="sec"><div class="sec-head"><span class="sec-ico b">📜</span>'
        + '<h3>명심보감</h3><span class="tag">'+(isReview?'복습':'새 구절')+' · '+my.f+'</span></div>'
        + '<div class="myung"><div class="myung-k">'+my.k+'</div>'
        + '<div class="myung-r">'+my.r+'</div>'
        + (showAns
            ? '<div class="myung-t"><b>뜻</b> — '+my.t+'</div>'
            : '<div class="myung-t"><b>뜻</b> — '+my.t+'</div>')
        + '<div class="myung-f">출전 : 명심보감 '+my.f+'</div>'
        + '<div class="write-line"><div class="write-lbl">📖 소리 내어 읽고, 아래에 따라 써 보세요.</div>'
        + (showAns
            ? '<div style="border:none;height:auto;color:var(--pink-d);font-weight:700;">'+my.k+'</div>'
              +'<div style="border:none;height:auto;color:var(--pink-d);font-weight:700;">'+my.r+'</div>'
            : '<div></div><div></div>')
        + '</div></div></div>';

  html += '<div class="foot">오늘도 힘차게 시작해요! 💪  ('+day+' / 90 일차)</div>';
  document.getElementById("sheet").innerHTML = html;
}

document.getElementById("day").addEventListener("keydown", e=>{ if(e.key==="Enter") render(); });
render();
</script>
</body>
</html>
