<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>똑딱똑딱 교실 타이머 | 3분 놀이터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --wood-1:#C89A64;
    --wood-2:#B98A54;
    --wood-dark:#8A6236;
    --ink:#33403C;
    --ink-soft:#7B8A84;
    --line:#DCE7E1;
    --mint:#6BC5A0;
    --butter:#FFC94A;
    --coral:#EE6C5A;
    --lcd-bg:#B9C9A8;
    --lcd-ink:#26331F;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    color:var(--ink);
    font-family:'Noto Sans KR',sans-serif;
    min-height:100vh;
    /* 나무 책상 결 */
    background:
      repeating-linear-gradient(91deg,
        rgba(0,0,0,.05) 0px, rgba(0,0,0,0) 3px, rgba(255,255,255,.05) 7px, rgba(0,0,0,0) 13px),
      repeating-linear-gradient(89deg,
        rgba(0,0,0,.06) 0px, rgba(0,0,0,0) 40px, rgba(0,0,0,.04) 90px, rgba(0,0,0,0) 150px),
      linear-gradient(160deg, var(--wood-1), var(--wood-2) 55%, var(--wood-dark));
    background-attachment:fixed;
  }

  .topbar{max-width:640px;margin:0 auto;padding:14px 18px 0;display:flex;align-items:center;justify-content:space-between;}
  .topbar a{text-decoration:none;color:#fff;}
  .topbar .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;text-shadow:0 1px 2px rgba(0,0,0,.3);}
  .topbar .back{font-size:12.5px;font-weight:700;color:#fff;border:2px solid rgba(255,255,255,.45);padding:6px 12px;border-radius:999px;background:rgba(0,0,0,.13);}

  .shell{max-width:640px;margin:0 auto;padding:20px 18px 60px;}

  /* ===== 디지털 시계 본체 ===== */
  .clock{
    background:linear-gradient(175deg,#F7F4EE,#E2DDD3);
    border-radius:22px;
    padding:20px 20px 22px;
    box-shadow:
      0 3px 0 #C9C2B6,
      0 16px 26px rgba(0,0,0,.30),
      inset 0 2px 0 #fff;
    position:relative;
  }
  .clock::before{  /* 받침 그림자 */
    content:"";position:absolute;left:8%;right:8%;bottom:-16px;height:18px;
    background:rgba(0,0,0,.20);filter:blur(9px);border-radius:50%;z-index:-1;
  }
  .clock-brand{
    text-align:center;font-family:'Gaegu',cursive;font-weight:700;
    font-size:14px;color:#A79E8F;letter-spacing:.22em;margin-bottom:10px;
  }

  /* LCD 화면 */
  .lcd{
    background:var(--lcd-bg);
    border:5px solid #6E6355;
    border-radius:12px;
    padding:18px 14px 14px;
    text-align:center;
    box-shadow:inset 0 3px 12px rgba(0,0,0,.28);
    position:relative;
    overflow:hidden;
  }
  .lcd::after{ /* 유리 반사 */
    content:"";position:absolute;top:0;left:-30%;width:60%;height:100%;
    background:linear-gradient(105deg,rgba(255,255,255,.28),rgba(255,255,255,0));
    transform:skewX(-16deg);pointer-events:none;
  }
  .time{
    font-family:'Jua',sans-serif;
    font-size:clamp(52px,15vw,84px);
    line-height:1;color:var(--lcd-ink);
    letter-spacing:.04em;
    font-variant-numeric:tabular-nums;
    text-shadow:0 2px 0 rgba(255,255,255,.35);
  }
  .lcd-label{
    font-family:'Gaegu',cursive;font-weight:700;font-size:16px;
    color:#4C5C42;margin-top:4px;min-height:22px;
  }
  .lcd.warn{ background:#E9CE9A; }
  .lcd.danger{ background:#EBA48F; }
  .lcd.done{ background:#E9938A; }
  .lcd.danger .time, .lcd.done .time{ color:#5B2018; }
  .blink{ animation:blink .55s steps(2,start) infinite; }
  @keyframes blink{ 50%{opacity:.25;} }

  /* 진행 막대 */
  .bar{height:9px;background:#8E9C81;border-radius:6px;margin-top:12px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.25);}
  .bar > i{display:block;height:100%;width:100%;background:#4C5C42;transition:width .3s linear;}
  .lcd.warn .bar > i{background:#8A6320;}
  .lcd.danger .bar > i, .lcd.done .bar > i{background:#9E3524;}

  /* 조작 버튼 */
  .controls{display:flex;gap:9px;margin-top:16px;}
  .btn{
    font-family:'Jua',sans-serif;border:none;cursor:pointer;font-size:16px;
    padding:14px 10px;border-radius:13px;flex:1;
    background:var(--mint);color:#fff;box-shadow:0 4px 0 #4FA382;
    transition:transform .1s ease;
  }
  .btn:hover{transform:translateY(1px);box-shadow:0 3px 0 #4FA382;}
  .btn:active{transform:translateY(4px);box-shadow:none;}
  .btn.pause{background:var(--butter);color:#6B4E12;box-shadow:0 4px 0 #E0A81F;}
  .btn.pause:hover{box-shadow:0 3px 0 #E0A81F;}
  .btn.reset{background:#fff;color:var(--ink);box-shadow:0 4px 0 #C9C2B6;}
  .btn.reset:hover{box-shadow:0 3px 0 #C9C2B6;}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none;}
  .btn.alarm{background:var(--coral);color:#fff;box-shadow:0 4px 0 #C4503F;animation:alarmPulse .8s ease-in-out infinite;}
  .btn.alarm:hover{box-shadow:0 3px 0 #C4503F;}
  @keyframes alarmPulse{50%{filter:brightness(1.18);}}

  /* ===== 설정 카드 ===== */
  .panel{
    background:#fff;border-radius:18px;padding:18px 18px 20px;margin-top:22px;
    box-shadow:0 3px 0 rgba(0,0,0,.10), 0 10px 20px rgba(0,0,0,.16);
  }
  .panel h2{font-family:'Jua',sans-serif;font-size:17px;margin:0 0 4px;}
  .panel p.desc{font-size:12.5px;color:var(--ink-soft);margin:0 0 14px;line-height:1.6;}

  .presets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .preset{
    border:2.5px solid var(--line);background:#fff;border-radius:12px;
    padding:12px 4px;cursor:pointer;text-align:center;font-family:'Jua',sans-serif;
    font-size:15px;transition:all .12s ease;
  }
  .preset:hover{border-color:var(--mint);}
  .preset.sel{border-color:var(--mint);background:#F0FAF5;box-shadow:0 3px 0 var(--mint);}

  .custom{display:flex;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap;}
  .custom label{font-size:13px;color:var(--ink-soft);}
  .custom input{
    width:74px;border:2.5px solid var(--line);border-radius:10px;padding:9px 10px;
    font-family:'Jua',sans-serif;font-size:16px;text-align:center;
  }
  .custom input:focus{outline:none;border-color:var(--mint);}

  hr.sep{border:none;border-top:2px dashed var(--line);margin:18px 0 14px;}

  .opt-row{
    display:flex;align-items:flex-start;gap:10px;padding:11px 0;cursor:pointer;
  }
  .opt-row input[type=checkbox]{
    width:24px;height:24px;flex:0 0 auto;margin:0;cursor:pointer;
    accent-color:var(--mint);
  }
  .opt-txt{font-size:13.5px;line-height:1.5;}
  .opt-txt b{font-weight:700;}
  .opt-txt span{display:block;font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .next-alert{
    margin-top:10px;padding:10px 12px;border-radius:10px;background:#F3F8F5;
    font-family:'Gaegu',cursive;font-weight:700;font-size:14px;color:var(--ink-soft);
    text-align:center;min-height:20px;
  }
  .next-alert.fired{background:#FFF3D0;color:#8A6320;}

  .test-link{
    background:none;border:none;color:var(--mint);font-size:12px;font-weight:700;
    cursor:pointer;text-decoration:underline;padding:0;margin-left:auto;flex:0 0 auto;
  }
  .hidden{display:none !important;}

  /* ===== 최대화 (칠판용 큰 화면) ===== */
  .max-btn{
    position:absolute;top:14px;right:14px;z-index:5;
    border:2px solid #D8D2C6;background:#fff;border-radius:10px;
    width:34px;height:34px;cursor:pointer;padding:0;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 0 #C9C2B6;color:#8A8275;
  }
  .max-btn:hover{color:var(--ink);border-color:#B8B1A3;}
  .max-btn svg{width:17px;height:17px;}

  body.maxed{overflow:hidden;}
  body.maxed .topbar,
  body.maxed .panel{display:none;}
  body.maxed .shell{
    max-width:none;padding:0;
    height:100vh;display:flex;align-items:center;justify-content:center;
  }
  body.maxed .clock{
    width:min(92vw, 1100px);
    padding:clamp(20px,3vh,44px) clamp(20px,4vw,52px) clamp(24px,3.5vh,50px);
    border-radius:clamp(22px,3vw,34px);
  }
  body.maxed .clock-brand{font-size:clamp(14px,1.6vw,22px);margin-bottom:clamp(10px,1.6vh,20px);}
  body.maxed .lcd{padding:clamp(20px,3.5vh,44px) clamp(16px,3vw,34px) clamp(16px,2.5vh,32px);border-width:7px;}
  body.maxed .time{font-size:clamp(90px,20vw,260px);}
  body.maxed .lcd-label{font-size:clamp(20px,2.6vw,38px);margin-top:clamp(4px,1vh,14px);min-height:auto;}
  body.maxed .bar{height:clamp(12px,1.6vh,22px);margin-top:clamp(14px,2vh,26px);}
  body.maxed .controls{margin-top:clamp(14px,2.2vh,28px);gap:clamp(9px,1.4vw,16px);}
  body.maxed .btn{font-size:clamp(16px,1.9vw,26px);padding:clamp(14px,2.2vh,24px) 10px;border-radius:15px;}
  body.maxed .max-btn{width:44px;height:44px;top:18px;right:18px;}
  body.maxed .max-btn svg{width:21px;height:21px;}
  .max-hint{
    display:none;position:fixed;bottom:16px;left:0;right:0;text-align:center;
    font-family:'Gaegu',cursive;font-weight:700;font-size:14px;
    color:rgba(255,255,255,.85);text-shadow:0 1px 3px rgba(0,0,0,.4);pointer-events:none;
  }
  body.maxed .max-hint{display:block;}

  @media (max-width:420px){
    .presets{grid-template-columns:repeat(2,1fr);}
  }
</style>
</head>
<body>

<div class="topbar">
  <a class="brand" href="../index.html">
    <svg width="26" height="26" viewBox="0 0 34 34" fill="none">
      <circle cx="17" cy="18" r="14" fill="#fff" stroke="#33403C" stroke-width="2"/>
      <path d="M17 9 L17 18 L23 21" stroke="#EE6C5A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="13" y="2" width="8" height="4" rx="1.5" fill="#33403C"/>
    </svg>
    <span>3분 놀이터</span>
  </a>
  <a class="back" href="../index.html">← 다른 콘텐츠 보기</a>
</div>

<div class="shell">

  <!-- 디지털 시계 -->
  <div class="clock">
    <button class="max-btn" id="max-btn" onclick="toggleMax()" title="크게 보기" aria-label="크게 보기">
      <svg id="max-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>
      </svg>
    </button>
    <div class="clock-brand">CLASSROOM TIMER <span style="opacity:.6;font-size:11px;">v6</span></div>
    <div class="lcd" id="lcd">
      <div class="time" id="time">03:00</div>
      <div class="lcd-label" id="lcd-label">준비됐어요</div>
      <div class="bar"><i id="bar-fill"></i></div>
    </div>
    <div class="controls">
      <button class="btn" id="start-btn" onclick="startTimer()">시작</button>
      <button class="btn pause" id="pause-btn" onclick="pauseTimer()" disabled>일시정지</button>
      <button class="btn reset" onclick="resetTimer()">되돌리기</button>
    </div>
  </div>

  <!-- 시간 설정 -->
  <div class="panel">
    <h2>시간 정하기</h2>
    <p class="desc">자주 쓰는 시간을 고르거나, 아래에서 직접 분과 초를 넣어주세요.</p>

    <div class="presets" id="presets">
      <div class="preset" data-sec="60">1분</div>
      <div class="preset sel" data-sec="180">3분</div>
      <div class="preset" data-sec="300">5분</div>
      <div class="preset" data-sec="600">10분</div>
    </div>

    <div class="custom">
      <label>직접 넣기</label>
      <input type="number" id="in-min" min="0" max="99" value="3" aria-label="분">
      <label>분</label>
      <input type="number" id="in-sec" min="0" max="59" value="0" aria-label="초">
      <label>초</label>
      <button class="btn" style="flex:0 0 auto;font-size:14px;padding:10px 18px;" onclick="applyCustom()">맞추기</button>
    </div>
  </div>

  <!-- 소리 설정 -->
  <div class="panel">
    <h2>알림 소리</h2>
    <p class="desc">체크한 것만 소리가 나요. 수업 전에 '들어보기'로 볼륨을 맞춰보세요.</p>

    <label class="opt-row" for="cb-minute">
      <input type="checkbox" id="cb-minute" checked onchange="onOptChange()">
      <span class="opt-txt">
        <b>1분마다 알림</b>
        <span>1분이 지날 때마다 '띵동' 소리가 나요 (2분 이상일 때만)</span>
      </span>
      <button type="button" class="test-link" onclick="playMinuteBeep()">들어보기</button>
    </label>

    <label class="opt-row" for="cb-ten">
      <input type="checkbox" id="cb-ten" checked onchange="onOptChange()">
      <span class="opt-txt">
        <b>끝나기 10초 전 알림</b>
        <span>마지막 10초 동안 매초 '똑' 소리로 세어줘요</span>
      </span>
      <button type="button" class="test-link" onclick="playTick()">들어보기</button>
    </label>

    <label class="opt-row" for="cb-end">
      <input type="checkbox" id="cb-end" checked onchange="onOptChange()">
      <span class="opt-txt">
        <b>종료음</b>
        <span>시간이 다 되면 '따라라란' 하고 알려줘요</span>
      </span>
      <button type="button" class="test-link" onclick="playEndChime()">들어보기</button>
    </label>

    <div id="next-alert" class="next-alert"></div>
  </div>

</div>

<div class="max-hint">ESC를 누르면 원래대로 돌아와요</div>

<script>
/* ================= 소리 ================= */
let audioCtx = null;

function unlockAudio(){
  try{
    if(!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      audioCtx = new AC();
    }
    if(audioCtx.state !== "running") audioCtx.resume();
    const b = audioCtx.createBuffer(1,1,audioCtx.sampleRate);
    const s = audioCtx.createBufferSource();
    s.buffer = b; s.connect(audioCtx.destination); s.start(0);
  }catch(e){}
}
document.addEventListener("pointerdown", unlockAudio, { once:true });
document.addEventListener("keydown", unlockAudio, { once:true });

function withAudio(fn){
  try{
    if(!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      audioCtx = new AC();
    }
    if(audioCtx.state === "running") fn(audioCtx);
    else audioCtx.resume().then(()=> fn(audioCtx)).catch(()=>{});
  }catch(e){}
}

function beep(freq, dur, vol, type, delay){
  withAudio(ctx=>{
    const t = ctx.currentTime + (delay||0) + 0.02;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type || "sine";
    osc.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(t); osc.stop(t + dur + 0.03);
  });
}

/* 특정 시각에 울리도록 예약하는 기본 소리 */
function tone(ctx, dest, freq, at, dur, vol, type){
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = type || "sine";
  osc.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, at);
  g.gain.exponentialRampToValueAtTime(vol, at + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  osc.connect(g); g.connect(dest);
  osc.start(at); osc.stop(at + dur + 0.03);
}

/* 세 가지 알림음의 악보 */
function scoreDingDong(ctx, dest, at){      // 띵동
  tone(ctx, dest, 659.25, at,        0.42, 0.42, "sine");
  tone(ctx, dest, 1318.5, at,        0.35, 0.16, "sine");
  tone(ctx, dest, 523.25, at + 0.26, 0.62, 0.42, "sine");
  tone(ctx, dest, 1046.5, at + 0.26, 0.52, 0.16, "sine");
}
function scoreTick(ctx, dest, at){          // 똑
  tone(ctx, dest, 660, at, 0.10, 0.22, "square");
}
function scoreEnd(ctx, dest, at){           // 따라라란
  [523.25, 659.25, 783.99, 1046.50].forEach((f, i)=>{
    const t = at + i * 0.17;
    tone(ctx, dest, f,   t, i === 3 ? 0.75 : 0.20, i === 3 ? 0.32 : 0.26, "triangle");
    tone(ctx, dest, f*2, t, i === 3 ? 0.70 : 0.18, 0.08, "square");
  });
}

/* '들어보기' 버튼용 — 지금 바로 울리기 */
function playMinuteBeep(){ withAudio(ctx=> scoreDingDong(ctx, ctx.destination, ctx.currentTime + 0.03)); }
function playTick(){       withAudio(ctx=> scoreTick(ctx, ctx.destination, ctx.currentTime + 0.03)); }
function playEndChime(){   withAudio(ctx=> scoreEnd(ctx, ctx.destination, ctx.currentTime + 0.03)); }

/* ================= 최대화 (칠판용) ================= */
const ICON_MAX  = '<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>';
const ICON_MIN  = '<path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/>';
let maxed = false;

function toggleMax(){
  maxed = !maxed;
  document.body.classList.toggle("maxed", maxed);
  document.getElementById("max-icon").innerHTML = maxed ? ICON_MIN : ICON_MAX;
  const btn = document.getElementById("max-btn");
  btn.title = maxed ? "원래대로" : "크게 보기";
  btn.setAttribute("aria-label", btn.title);

  // 브라우저 주소창까지 숨겨서 화면을 꽉 채워요 (막혀 있어도 큰 화면은 그대로 작동)
  try{
    if(maxed){
      if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
    } else if(document.fullscreenElement && document.exitFullscreen){
      document.exitFullscreen();
    }
  }catch(e){}
}

/* 브라우저 전체화면을 F11 등으로 빠져나갔을 때 상태 맞추기 */
document.addEventListener("fullscreenchange", ()=>{
  if(!document.fullscreenElement && maxed){
    maxed = false;
    document.body.classList.remove("maxed");
    document.getElementById("max-icon").innerHTML = ICON_MAX;
    document.getElementById("max-btn").title = "크게 보기";
  }
});

/* ================= 타이머 ================= */
let totalSec = 180;
let remainSec = 180;
let running = false;
let endAt = 0;          // 종료 예정 시각(ms) — 화면이 멈춰도 시간이 정확하게
let loopId = null;
let lastTickSec = null;     // 마지막으로 '똑' 소리를 낸 초
let lastMinuteMark = 0;     // 마지막으로 알린 '몇 분 경과'

const opts = { minute:true, ten:true, end:true };

function onOptChange(){
  opts.minute = document.getElementById("cb-minute").checked;
  opts.ten    = document.getElementById("cb-ten").checked;
  opts.end    = document.getElementById("cb-end").checked;
  unlockAudio();
  updateNextAlert();
}

/* 다음 알림이 언제인지 보여줘요 (제대로 켜졌는지 눈으로 확인하는 용도) */
function updateNextAlert(){
  const el = document.getElementById("next-alert");
  if(!el) return;
  if(el.classList.contains("fired")) return;   // 알림 표시 중엔 건드리지 않음

  if(!opts.minute){ el.textContent = "1분마다 알림이 꺼져 있어요"; return; }
  if(totalSec < 120){
    el.textContent = "⚠️ 지금은 " + fmt(totalSec) + " — 1분 타이머는 띵동이 종료음과 겹쳐서 생략돼요";
    return;
  }

  const elapsed = totalSec - remainSec;
  const nextMark = Math.floor(elapsed / 60) + 1;
  if(nextMark * 60 >= totalSec){ el.textContent = "이제 종료음만 남았어요"; return; }
  const after = Math.ceil(nextMark * 60 - elapsed);
  el.textContent = running
    ? "다음 띵동까지 " + fmt(after)
    : "시작하면 " + fmt(60) + " 뒤에 첫 띵동이 울려요";
}

/* 알림이 울렸다는 걸 눈으로도 보여줘요 */
function flashAlert(text){
  const el = document.getElementById("next-alert");
  if(!el) return;
  el.classList.add("fired");
  el.textContent = text;
  setTimeout(()=>{ el.classList.remove("fired"); updateNextAlert(); }, 2200);
}

function fmt(sec){
  sec = Math.max(0, sec);
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0");
}

function render(){
  const timeEl = document.getElementById("time");
  const lcd = document.getElementById("lcd");
  const label = document.getElementById("lcd-label");
  const fill = document.getElementById("bar-fill");

  timeEl.textContent = fmt(remainSec);
  const ratio = totalSec > 0 ? Math.max(0, remainSec / totalSec) : 0;
  fill.style.width = (ratio * 100) + "%";

  lcd.classList.remove("warn","danger","done");
  timeEl.classList.remove("blink");

  if(remainSec <= 0){
    lcd.classList.add("done");
    timeEl.classList.add("blink");
    label.textContent = "시간 끝!";
  } else if(remainSec <= 10){
    lcd.classList.add("danger");
    label.textContent = "곧 끝나요!";
  } else if(remainSec <= 30){
    lcd.classList.add("warn");
    label.textContent = "조금 남았어요";
  } else {
    label.textContent = running ? "열심히 하는 중" : "준비됐어요";
  }
}

function tickLoop(){
  if(!running) return;

  // 브라우저가 소리를 잠재웠으면 다시 깨워요
  if(audioCtx && audioCtx.state !== "running"){ try{ audioCtx.resume(); }catch(e){} }

  remainSec = Math.max(0, (endAt - Date.now()) / 1000);

  // 마지막 10초 — 초가 바뀔 때마다 '똑'
  const whole = Math.ceil(remainSec);
  if(opts.ten && whole <= 10 && whole > 0 && whole !== lastTickSec){
    lastTickSec = whole;
    playTick();
  }

  // 1분마다 — '몇 분이 지났는지'로 판단해 절대 놓치지 않아요
  const mark = Math.floor((totalSec - remainSec) / 60);
  if(mark > lastMinuteMark){
    lastMinuteMark = mark;
    if(opts.minute && remainSec > 10.5){
      playMinuteBeep();
      flashAlert("🔔 " + mark + "분 지났어요!");
    }
  }

  render();
  updateNextAlert();
  if(remainSec <= 0) finish();
}

/* ===== 종료 알람 (멈출 때까지 반복) ===== */
let alarmLoopId = null;

function startAlarm(){
  stopAlarm();
  playEndChime();
  alarmLoopId = setInterval(()=>{
    if(audioCtx && audioCtx.state !== "running"){ try{ audioCtx.resume(); }catch(e){} }
    playEndChime();
  }, 1600);

  const stopBtn = document.getElementById("pause-btn");
  stopBtn.textContent = "알림 끄기";
  stopBtn.disabled = false;
  stopBtn.classList.add("alarm");
  document.getElementById("lcd-label").textContent = "시간 끝! (알림 끄기를 눌러주세요)";
}

function stopAlarm(){
  if(alarmLoopId){ clearInterval(alarmLoopId); alarmLoopId = null; }
  const stopBtn = document.getElementById("pause-btn");
  stopBtn.textContent = "일시정지";
  stopBtn.classList.remove("alarm");
  stopBtn.disabled = !running;
  if(!running && remainSec <= 0) document.getElementById("lcd-label").textContent = "시간 끝!";
}

function finish(){
  running = false;
  remainSec = 0;
  if(loopId) clearInterval(loopId);
  loopId = null;
  document.getElementById("start-btn").textContent = "시작";
  document.getElementById("start-btn").disabled = false;
  document.getElementById("pause-btn").disabled = true;
  render();
  if(opts.end) startAlarm();      // 멈출 때까지 계속 울려요
}

function startTimer(){
  unlockAudio();
  stopAlarm();
  if(remainSec <= 0) remainSec = totalSec;
  if(remainSec <= 0){ alert("시간을 먼저 정해주세요."); return; }
  running = true;
  endAt = Date.now() + remainSec * 1000;
  lastTickSec = null;
  lastMinuteMark = Math.floor((totalSec - remainSec) / 60);   // 이어하기에서도 정확하게
  document.getElementById("start-btn").textContent = "진행 중";
  document.getElementById("start-btn").disabled = true;
  document.getElementById("pause-btn").disabled = false;
  render();
  if(loopId) clearInterval(loopId);
  loopId = setInterval(tickLoop, 100);
}

function pauseTimer(){
  if(alarmLoopId){ stopAlarm(); return; }   // 울리는 중이면 알람만 끔
  if(!running) return;
  running = false;
  if(loopId) clearInterval(loopId);
  loopId = null;
  document.getElementById("start-btn").textContent = "이어하기";
  document.getElementById("start-btn").disabled = false;
  document.getElementById("pause-btn").disabled = true;
  render();
}

function resetTimer(){
  stopAlarm();
  running = false;
  if(loopId) clearInterval(loopId);
  loopId = null;
  remainSec = totalSec;
  lastTickSec = null;
  lastMinuteMark = 0;
  document.getElementById("start-btn").textContent = "시작";
  document.getElementById("start-btn").disabled = false;
  document.getElementById("pause-btn").disabled = true;
  render();
}

function setTotal(sec){
  stopAlarm();
  totalSec = sec;
  remainSec = sec;
  running = false;
  if(loopId) clearInterval(loopId);
  loopId = null;
  lastTickSec = null;
  lastMinuteMark = 0;
  document.getElementById("start-btn").textContent = "시작";
  document.getElementById("start-btn").disabled = false;
  document.getElementById("pause-btn").disabled = true;
  render();
}

/* 미리 정해둔 시간 */
document.querySelectorAll(".preset").forEach(p=>{
  p.addEventListener("click", ()=>{
    document.querySelectorAll(".preset").forEach(x=>x.classList.remove("sel"));
    p.classList.add("sel");
    const sec = parseInt(p.dataset.sec, 10);
    document.getElementById("in-min").value = Math.floor(sec/60);
    document.getElementById("in-sec").value = sec % 60;
    setTotal(sec);
  });
});

/* 직접 넣기 */
function applyCustom(){
  const m = parseInt(document.getElementById("in-min").value, 10) || 0;
  const s = parseInt(document.getElementById("in-sec").value, 10) || 0;
  const sec = m*60 + s;
  if(sec <= 0){ alert("1초 이상으로 정해주세요."); return; }
  if(sec > 99*60+59){ alert("최대 99분 59초까지 가능해요."); return; }
  document.querySelectorAll(".preset").forEach(x=>x.classList.remove("sel"));
  document.querySelectorAll(".preset").forEach(x=>{
    if(parseInt(x.dataset.sec,10) === sec) x.classList.add("sel");
  });
  setTotal(sec);
}
document.getElementById("in-min").addEventListener("keydown", e=>{ if(e.key==="Enter") applyCustom(); });
document.getElementById("in-sec").addEventListener("keydown", e=>{ if(e.key==="Enter") applyCustom(); });

/* 스페이스바로 시작/멈춤, Esc로 최대화 해제 */
document.addEventListener("keydown", e=>{
  if(e.code === "Space" && e.target.tagName !== "INPUT"){
    e.preventDefault();
    if(alarmLoopId) stopAlarm();
    else if(running) pauseTimer();
    else startTimer();
  }
  if(e.key === "Escape" && maxed && !document.fullscreenElement){
    toggleMax();
  }
});

render();
updateNextAlert();
</script>
