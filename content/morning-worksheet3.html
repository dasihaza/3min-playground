];
const DAY_UNIT = [];
UNITS.forEach(u=>{ for(let i=0;i<u.days;i++) DAY_UNIT.push(u); });

/* ===== 날짜 고정 난수 ===== */
function rng(seed){
  let s = seed % 2147483647; if(s<=0) s += 2147483646;
  return ()=>{ s = (s*16807) % 2147483647; return (s-1)/2147483646; };

function frac(n,d){ return '<span class="frac"><span class="n">'+n+'</span><span class="d">'+d+'</span></span>'; }
function mixed(w,n,d){ return w ? '<span class="mixed">'+w+frac(n,d)+'</span>' : frac(n,d); }
function fracStr(n,d){                       // 답: 기약분수 → 대분수
  const g = gcd(n,d); n/=g; d/=g;
  if(d===1) return ""+n;
  if(n>d){ const w=Math.floor(n/d); return w+"와 "+(n%d)+"/"+d; }

}

       return {q:'가방의 무게가 '+g1+' g, 책의 무게가 '+g2+' g입니다. 합하면 몇 g인가요? (1000 g이 넘으면 kg으로도 쓰세요)',
               a:(g1+g2)+' g = '+Math.floor((g1+g2)/1000)+' kg '+((g1+g2)%1000)+' g'}; },
  r=>{ const b=ri(r,2,6), q=ri(r,100,400);
       return {q:'물 '+(b*q)+' mL를 컵 '+b+'개에 똑같이 나누어 담으면 한 컵에 몇 mL인가요?', a:q+' mL'}; }
];

/* ---------- 6단원 : 자료와 그림그래프 ---------- */
function makeTable(r){
  const labels=["1반","2반","3반","4반"];
  const vals=[]; for(let i=0;i<4;i++) vals.push(ri(r,1,5)*10 + ri(r,0,9));
  const unit=["명","권","개","그루"][ri(r,0,3)];
  const title=["반별 학생 수","읽은 책 수","모은 붙임딱지 수","심은 나무 수"][ri(r,0,3)];
  let head='', row='';
  for(let i=0;i<4;i++){ head+='<th>'+labels[i]+'</th>'; row+='<td>'+vals[i]+'</td>'; }
  const html='<div class="tbl-cap">'+title+' (단위: '+unit+')</div>'
           + '<table class="dtable"><tr>'+head+'</tr><tr>'+row+'</tr></table>';
  return {labels, vals, unit, title, html};
}
const C6 = [
  (r,T)=>({q:'가장 <b>많은</b> 반은 어디인가요?', a:T.labels[T.vals.indexOf(Math.max.apply(null,T.vals))]}),
  (r,T)=>({q:'가장 <b>적은</b> 반은 어디인가요?', a:T.labels[T.vals.indexOf(Math.min.apply(null,T.vals))]}),
  (r,T)=>({q:'가장 많은 반과 가장 적은 반의 <b>차</b>', a:(Math.max.apply(null,T.vals)-Math.min.apply(null,T.vals))+' '+T.unit}),
  (r,T)=>({q:'네 반을 모두 <b>더하면</b>?', a:T.vals.reduce(function(a,b){return a+b;},0)+' '+T.unit}),
  (r,T)=>({q:''+T.labels[0]+'과 '+T.labels[1]+'의 <b>합</b>', a:(T.vals[0]+T.vals[1])+' '+T.unit}),
  (r,T)=>({q:'그림그래프에서 큰 그림(◎)이 10'+T.unit+'일 때, '+T.labels[0]+'의 큰 그림은 몇 개인가요?',
           a:Math.floor(T.vals[0]/10)+' 개'}),
  (r,T)=>({q:'그림그래프에서 작은 그림(○)이 1'+T.unit+'일 때, '+T.labels[0]+'의 작은 그림은 몇 개인가요?',
           a:(T.vals[0]%10)+' 개'}),
  (r,T)=>({q:''+T.labels[2]+'는 얼마인가요?', a:T.vals[2]+' '+T.unit}),
  (r,T)=>{ const avg=Math.max.apply(null,T.vals);
           return {q:''+avg+' '+T.unit+'보다 적은 반은 몇 반인가요?',
                   a:T.vals.filter(function(v){return v<avg;}).length+' 반'}; },
  (r,T)=>({q:'표를 그림그래프로 나타낼 때 좋은 점은?', a:'많고 적음을 한눈에 알 수 있다'}),
  (r,T)=>({q:''+T.labels[3]+'와(과) '+T.labels[0]+' 중 어느 쪽이 얼마나 더 많은가요?',
           a:(T.vals[3]>T.vals[0]?T.labels[3]:(T.vals[3]<T.vals[0]?T.labels[0]:'두 반이 같음'))
             + (T.vals[3]===T.vals[0]?'':'이(가) '+Math.abs(T.vals[3]-T.vals[0])+' '+T.unit+' 더 많음')})
];
const W6 = [
  (r,T)=>({q:''+T.title+' 자료입니다. 1반과 3반 중 어느 반이 더 많고, 얼마나 더 많은가요?',
           a:(T.vals[0]>=T.vals[2]?'1반':'3반')+'이 '+Math.abs(T.vals[0]-T.vals[2])+' '+T.unit+' 더 많음'}),
  (r,T)=>({q:'네 반을 모두 합하면 몇 '+T.unit+'인가요?', a:T.vals.reduce(function(a,b){return a+b;},0)+' '+T.unit}),
  (r,T)=>{ const add=ri(r,3,12);
           return {q:'2반에 '+add+' '+T.unit+'가 더 늘었다면 2반은 모두 몇 '+T.unit+'가 되나요?',
                   a:(T.vals[1]+add)+' '+T.unit}; },
  (r,T)=>({q:'큰 그림 ◎을 10'+T.unit+', 작은 그림 ○을 1'+T.unit+'로 할 때 4반은 ◎과 ○을 각각 몇 개씩 그리나요?',
           a:'◎ '+Math.floor(T.vals[3]/10)+'개, ○ '+(T.vals[3]%10)+'개'}),
  (r,T)=>({q:'30 '+T.unit+' 이상인 반은 모두 몇 반인가요?',
           a:T.vals.filter(function(v){return v>=30;}).length+' 반'}),
  (r,T)=>({q:'가장 많은 반의 수에서 가장 적은 반의 수를 빼면 얼마인가요?',
           a:(Math.max.apply(null,T.vals)-Math.min.apply(null,T.vals))+' '+T.unit})
];

/* ---------- 하루치 문제 ---------- */
function makeMath(unit, r){
  if(unit===6){
    const T = makeTable(r);
    return { grid:T.html,
             calc: pickN(r,C6,8).map(f=>f(r,T)),
             word: pickN(r,W6,2).map(f=>f(r,T)) };
  }
  const CALC=[C1,C2,C3,C4,C5,C6][unit-1];
  const WORD=[W1,W2,W3,W4,W5,W6][unit-1];
  return { grid:null,
           calc: pickN(r,CALC,8).map(f=>f(r)),
           word: pickN(r,WORD,2).map(f=>f(r)) };
}

/* ===== 그리기 ===== */
let showAns=false;

function moveDay(d){
  const el=document.getElementById("day");
  el.value = Math.max(1, Math.min(90, (parseInt(el.value,10)||1)+d));
  render();
}
function todayDay(){
  // 2학기 시작을 8월 20일로 보고 그날부터 며칠째인지 (주말 제외 없이 단순 계산)
  const now=new Date(); const start=new Date(now.getFullYear(),7,20);
  let d=Math.floor((now-start)/86400000)+1;
  if(d<1||d>90) d=1;
  document.getElementById("day").value=d; render();
}
function toggleAnswer(){
  showAns=!showAns;
  document.getElementById("ans-btn").textContent = showAns ? "📝 활동지로 돌아가기" : "✅ 답지 보기";
  render();
}

function render(){
  let day = parseInt(document.getElementById("day").value,10) || 1;
  day = Math.max(1, Math.min(90, day));
  document.getElementById("day").value = day;

  const unit = DAY_UNIT[day-1];
  document.getElementById("unit-tag").textContent =
    "수학 " + unit.n + "단원 · " + unit.name;

  const r = rng(day*7919 + 13);
  const M = makeMath(unit.n, r);
  const w1 = WD[((day-1)*3) % WD.length];
  const w2 = WD[((day-1)*3+1) % WD.length];
  const w3 = WD[((day-1)*3+2) % WD.length];
  const jd = JD[(day-1) % JD.length];

  let html = '';
  html += '<div class="sheet-head"><div>'
        + '<h1 class="sheet-title">🌅 아침을 여는 활동지</h1>'
        + '<div class="sheet-sub">3학년 2학기 · 제 '+day+' 일차'
        + (showAns ? ' <span style="color:var(--pink-d)">— 답지</span>' : '') + '</div></div>'
        + '<div class="namebox"><span>날짜 <b class="u-line"></b></span>'
        + '<span>이름 <b class="u-line"></b></span></div></div>';

  /* 수학 */
  html += '<div class="sec"><div class="sec-head"><span class="sec-ico m">🧮</span>'
        + '<h3>수학</h3><span class="tag">'+unit.n+'단원 · '+unit.name+'</span></div>';
  if(M.grid) html += '<div class="gridbox">'+M.grid+'</div>';
  html += '<table class="calc-grid">';
  for(var k=0;k<M.calc.length;k+=2){
    html += '<tr>';
    for(var j=k;j<k+2;j++){
      if(j<M.calc.length){
        var o=M.calc[j];
        html += '<td><div class="q"><div class="q-txt"><span class="q-num">'+(j+1)+'</span>'+o.q+'</div>'
              + (showAns ? '<div class="q-ans ans-shown">'+o.a+'</div>' : '<div class="q-ans"></div>')
              + '</div></td>';
      } else html += '<td></td>';
    }
    html += '</tr>';
  }
  html += '</table><div class="word-lbl">✏️ 문장을 읽고 풀어 보세요</div>';
  M.word.forEach(function(o,i){
    html += '<div class="q word"><div class="q-txt"><span class="q-num w">'+(9+i)+'</span>'+o.q+'</div>'
          + (showAns ? '<div class="q-ans ans-shown">답 : '+o.a+'</div>' : '<div class="q-ans"></div>')
          + '</div>';
  });
  html += '</div>';

  /* 한자 */
  html += '<div class="sec"><div class="sec-head"><span class="sec-ico h">🔤</span>'
        + '<h3>오늘의 영어 단어</h3><span class="tag">세 단어</span></div><div class="word-wrap">';
  [w1,w2,w3].forEach(function(o){
    html += '<div class="eword"><div class="ew-top"><b>'+o.w+'</b><span>'+o.k+'</span></div>'
          + '<div class="ew-line">'+(showAns ? '<span class="ew-fill">'+o.w+'</span>' : '')+'</div>'
          + '<div class="ew-line">'+(showAns ? '<span class="ew-fill">'+o.w+'</span>' : '')+'</div></div>';
  });
  html += '</div></div>';

  html += '<div class="sec"><div class="sec-head"><span class="sec-ico b">🙇</span>'
        + '<h3>오늘의 높임말</h3><span class="tag">바르고 고운 말</span></div>'
        + '<div class="myung"><div class="sok-p">\u201C'+jd.s+'\u201D</div>'
        + '<div class="jd-plain">보통 말 : '+jd.b+'</div>'
        + '<div class="sok-m"><b>배워요</b> \u2014 '+jd.m+'</div>'
        + '<div class="write-line"><div class="write-lbl">\u270F\uFE0F 소리 내어 읽고 아래에 따라 써 보세요.</div>'
        + (showAns
            ? '<div style="border:none;height:auto;color:var(--pink-d);font-weight:700;">'+jd.s+'</div>'
            : '<div></div><div></div>')
        + '</div></div></div>';

  html += '<div class="foot">오늘도 힘차게 시작해요! 💪  ('+day+' / 90 일차)</div>';
  document.getElementById("sheet").innerHTML = html;
}

document.getElementById("day").addEventListener("keydown", e=>{ if(e.key==="Enter") render(); });
render();
</script>
