<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>친환경 농부 학습지 · 지속가능한 미래를 위한 친환경 농업 | 3분 놀이터</title>
<meta name="description" content="6학년 실과 '지속가능한 미래를 위한 친환경 농업' 학습지. 친환경 농부 웹게임 그림으로 꾸민 A4 인쇄용 학습지로 천연 방제, 천적, 돌려짓기, 녹비작물, 탄소 격리, 친환경 생활 실천을 공부해요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#4E3D2F; --soft:#9A8770; --line:#EADBC0; --paper:#FFFCF4;
  --leaf:#6CBF62; --leaf-d:#469A45; --leaf-l:#E4F4D8; --leaf-ll:#F3FAEA;
  --wood:#B98559; --wood-d:#8A5D3B; --wood-l:#E7C9A0;
  --sun:#FFD267; --sun-l:#FFF3CC; --rose:#F49CB0; --rose-l:#FFE9EE; --sky:#8CCBEB; --sky-l:#E6F5FC; --red:#E0645A;
}
*{box-sizing:border-box}
html,body{margin:0;background:#EFF6E6;color:var(--ink);font-family:'Gowun Dodum',sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
img{display:block}
/* 도구 막대 */
.bar{position:sticky;top:0;z-index:10;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;padding:10px 12px;background:#fffffff0;box-shadow:0 3px 12px rgba(80,120,60,.15)}
.bar h1{font-family:'Jua';font-size:20px;margin:0 8px 0 0;color:var(--leaf-d);display:flex;align-items:center;gap:6px}
.bar h1 img{width:28px;height:28px}
.bar button,.bar a{font-family:'Jua';font-size:16px;border:none;border-radius:999px;padding:9px 16px;cursor:pointer;text-decoration:none;color:#fff;background:linear-gradient(180deg,#8fd685,#5cb554);box-shadow:0 4px 0 #3f8f3e}
.bar .b2{background:linear-gradient(180deg,#ffbb8a,#ff925f);box-shadow:0 4px 0 #d26a3b}
.bar .b3{background:linear-gradient(180deg,#a5dcf5,#5aa6d1);box-shadow:0 4px 0 #3f86b3}
.bar .b4{background:#fff;color:var(--wood-d);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.bar button:active,.bar a:active{transform:translateY(3px);box-shadow:none}
.bar .hint{font-size:13px;color:var(--soft);width:100%;text-align:center}

/* A4 종이 */
.page{width:210mm;height:297mm;margin:18px auto;background:var(--paper);border-radius:6px;box-shadow:0 8px 24px rgba(80,110,60,.18);padding:10mm 11mm 12mm;position:relative;overflow:hidden}
.page:before{content:'';position:absolute;inset:0;background:radial-gradient(rgba(154,135,112,.16) 1px,transparent 1.3px) 0 0/5px 5px;pointer-events:none}
.page:after{content:'';position:absolute;left:0;right:0;bottom:0;height:16mm;background:url('../assets/eco-rich/bg_farm.webp') center bottom/100% auto no-repeat;opacity:.22;pointer-events:none}
.page>*{position:relative;z-index:1}
.head{display:flex;align-items:center;gap:9px;margin-bottom:4mm}
.badge{font-family:'Jua';background:var(--leaf-d);color:#fff;border-radius:12px;padding:4px 10px;font-size:12.5px;white-space:nowrap;text-align:center;line-height:1.25;box-shadow:0 3px 0 #2f6f2f}
.title{font-family:'Jua';font-size:23px;line-height:1.15;flex:1;color:var(--wood-d)}
.title small{display:block;font-family:'Gaegu';font-weight:700;font-size:16px;color:var(--soft)}
.who{display:flex;gap:6px;font-family:'Jua';font-size:14px;flex:none}
.who span{border-bottom:2px dashed var(--wood-l);padding:0 2px 2px;min-width:50px}
.who span.nm{min-width:80px}
.sec{font-family:'Jua';font-size:18px;margin:4mm 0 2.5mm;display:flex;align-items:center;gap:7px;color:var(--ink)}
.sec i{font-style:normal;display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--sun);color:#7a4b00;font-size:15px;box-shadow:0 2px 0 #E2A93A;flex:none}
.sec em{font-style:normal;font-family:'Gaegu';font-weight:700;font-size:15.5px;color:var(--soft);margin-left:2px}
.box{background:#fff;border-radius:16px;padding:8px 12px;box-shadow:0 0 0 2px var(--line)}
.tipbox{display:flex;gap:8px;align-items:center;font-family:'Gaegu';font-weight:700;font-size:15.5px;background:var(--sun-l);border-radius:14px;padding:6px 12px;line-height:1.35;margin:0 0 3mm}
.tipbox img{width:40px;height:40px;object-fit:contain;flex:none}
.foot{position:absolute;left:11mm;right:11mm;bottom:5mm;display:flex;justify-content:space-between;font-family:'Jua';font-size:11.5px;color:#9FB78F;z-index:2}
/* 빈칸·정답 */
.blank{display:inline-block;min-width:62px;border-bottom:2px solid var(--wood-l);text-align:center;padding:0 4px;margin:0 2px;line-height:1.2}
.blank .a{color:#D9534F;font-family:'Jua';visibility:hidden}
.show .blank .a,.show .ans{visibility:visible}
.ans{color:#D9534F;font-family:'Jua';visibility:hidden}
.wline{border-bottom:2px dashed var(--wood-l);height:9mm}
.wline.s{height:8mm}

/* 1쪽 */
.hero{position:relative;border-radius:18px;overflow:hidden;height:54mm;box-shadow:0 0 0 3px #fff,0 0 0 5px var(--wood-l)}
.hero img{width:100%;height:100%;object-fit:cover}
.hero .speech{position:absolute;left:4mm;bottom:4mm;right:42%;background:rgba(255,252,244,.94);border-radius:16px 16px 16px 4px;padding:6px 10px;font-family:'Gaegu';font-weight:700;font-size:15px;line-height:1.35}
.hero .gm{position:absolute;right:3mm;bottom:0;width:30mm}
.compare{display:grid;grid-template-columns:24mm .8fr 1.25fr;gap:0;border-radius:14px;overflow:hidden;box-shadow:0 0 0 2px var(--line);font-size:13.5px;background:#fff}
.compare div{padding:6px 8px;border-bottom:1.5px dashed var(--line);display:flex;align-items:center;min-height:11mm}
.compare .c2{display:block;line-height:1.75;padding-top:7px}
.compare .h{font-family:'Jua';font-size:15px;justify-content:center;border-bottom:2px solid var(--line)}
.compare .h.k{background:#F1F1EC} .compare .h.e{background:var(--leaf-l);color:var(--leaf-d)}
.compare .r{font-family:'Jua';background:var(--paper);justify-content:center;color:var(--wood-d)}
.compare .last{border-bottom:0}
.five{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.five .c{background:#fff;border-radius:16px;padding:6px 6px 8px;text-align:center;box-shadow:0 0 0 2px var(--line),0 3px 0 var(--line)}
.five .c img{width:20mm;height:18mm;object-fit:contain;margin:0 auto 2px}
.five .n{display:inline-block;font-family:'Jua';font-size:12px;color:#fff;background:var(--leaf);border-radius:99px;padding:0 8px;margin-bottom:3px}
.five .t{font-family:'Jua';font-size:13.5px;line-height:1.25;min-height:9mm}
.five .d{font-size:11.5px;line-height:1.45;color:var(--ink);margin-top:3px}
.bank{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:3mm 0 0}
.bank span{font-family:'Jua';font-size:14px;background:var(--leaf-ll);border:2px dashed #CDE6BC;border-radius:10px;padding:2px 10px}

/* 2쪽 */
.match{display:grid;grid-template-columns:1fr 16mm 1fr;gap:5px 0;align-items:center}
.mcard{display:flex;align-items:center;gap:8px;background:#fff;border-radius:14px;padding:5px 10px;box-shadow:0 0 0 2px var(--line);min-height:16mm;font-size:13.5px;position:relative}
.mcard img{width:15mm;height:13mm;object-fit:contain;flex:none}
.mcard b{font-family:'Jua';font-weight:400;font-size:15px;display:block}
.dot{width:12px;height:12px;border-radius:50%;background:var(--wood-l);box-shadow:0 0 0 3px #fff,0 0 0 4px var(--wood-l);position:absolute;top:50%;margin-top:-6px}
.mcard.l .dot{right:-6px} .mcard.r .dot{left:-6px}
.mcard.r{padding-left:14px}
.ansline{display:block;font-size:11.5px;font-family:'Jua';color:#D9534F;visibility:hidden;margin-top:1px}
.show .ansline{visibility:visible}
.enemies{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.enemy{background:#fff;border-radius:16px;padding:6px 8px;box-shadow:0 0 0 2px var(--line);display:flex;gap:6px;align-items:center;font-size:13px;line-height:1.45}
.enemy img{width:17mm;height:15mm;object-fit:contain;flex:none}
.enemy b{font-family:'Jua';font-weight:400;font-size:15px}
.rot{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.rot .h{font-family:'Jua';font-size:13px;color:var(--soft)}
.plot{border-radius:14px;padding:5px 4px;font-size:12.5px;line-height:1.35;min-height:24mm;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#B88457,#93603A);color:#fff;box-shadow:inset 0 0 0 3px rgba(120,78,44,.55),0 3px 0 rgba(96,64,36,.35)}
.plot img{width:15mm;height:13mm;object-fit:contain}
.plot.q{background:#fff;color:var(--ink);box-shadow:0 0 0 2px var(--line);border:2px dashed var(--wood-l)}
.plot b{font-family:'Jua';font-weight:400;font-size:14px}
.seedrow{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:3mm}
.seedrow span{display:flex;align-items:center;gap:4px;background:#fff;border-radius:12px;padding:2px 9px 2px 3px;box-shadow:0 0 0 2px var(--line);font-size:12.5px}
.seedrow img{width:9mm;height:9mm;object-fit:contain}
.seedrow small{font-family:'Jua';color:var(--leaf-d);font-size:11.5px}

/* 3쪽 */
.ox{width:100%;border-collapse:separate;border-spacing:0 5px;font-size:13.5px}
.ox td{background:#fff;padding:6px 10px;box-shadow:0 0 0 2px var(--line)}
.ox td:first-child{border-radius:12px 0 0 12px;width:9mm;text-align:center;font-family:'Jua';color:var(--leaf-d);font-size:15px}
.ox td:last-child{border-radius:0 12px 12px 0;width:24mm;text-align:center;font-family:'Jua';color:var(--soft);white-space:nowrap}
.ox .ans{margin-left:4px}
.eco3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.eco3 .c{background:#fff;border-radius:16px;padding:6px 8px 8px;box-shadow:0 0 0 2px var(--line);font-size:12.5px;line-height:1.45}
.eco3 .c .t{display:flex;align-items:center;gap:6px;font-family:'Jua';font-size:14.5px;margin-bottom:2px}
.eco3 .c .t img{width:11mm;height:10mm;object-fit:contain}
.dilemma{display:flex;gap:10px;align-items:stretch}
.dilemma .pic{flex:none;width:36mm;background:var(--rose-l);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Gaegu';font-weight:700;font-size:13px;text-align:center;padding:6px;line-height:1.3}
.dilemma .pic img{width:20mm;height:18mm;object-fit:contain}
.choice{display:flex;gap:8px;margin:2mm 0}
.choice span{flex:1;background:#fff;border-radius:12px;padding:5px 8px;box-shadow:0 0 0 2px var(--line);font-size:13px;display:flex;align-items:center;gap:6px}
.choice span:before{content:'';width:14px;height:14px;border-radius:4px;border:2px solid var(--wood);flex:none}

/* 4쪽 */
.record{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.record .c{background:#fff;border-radius:16px;padding:6px 10px;box-shadow:0 0 0 2px var(--line);font-size:13px;display:flex;align-items:center;gap:8px}
.record .c img{width:12mm;height:11mm;object-fit:contain;flex:none}
.record .c b{font-family:'Jua';font-weight:400;font-size:14.5px;white-space:nowrap}
.record .c .fill{flex:1;border-bottom:2px dashed var(--wood-l);height:7mm;text-align:right;font-family:'Jua';color:var(--soft);padding-top:2px}
.cre{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;text-align:center}
.cre div{background:#fff;border-radius:14px;padding:4px 2px 6px;box-shadow:0 0 0 2px var(--line);font-family:'Jua';font-size:12.5px}
.cre img{width:13mm;height:11mm;object-fit:contain;margin:0 auto}
.cre div:after{content:'';display:block;width:12px;height:12px;border:2px solid var(--wood);border-radius:4px;margin:3px auto 0}
.items{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.items div{background:#fff;border-radius:14px;padding:4px 3px;box-shadow:0 0 0 2px var(--line);text-align:center;font-size:11.5px;line-height:1.25;position:relative}
.items img{width:13mm;height:11mm;object-fit:contain;margin:0 auto 2px}
.items div:before{content:'';position:absolute;top:4px;left:4px;width:11px;height:11px;border:2px solid var(--wood);border-radius:4px;background:#fff}
.promise{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
.promise .c{background:#fff;border-radius:16px;padding:6px 8px;box-shadow:0 0 0 2px var(--line)}
.promise .c .t{font-family:'Jua';font-size:14px;display:flex;align-items:center;gap:5px;margin-bottom:2px}
.promise .c .t img{width:10mm;height:9mm;object-fit:contain}
.stamp{position:absolute;right:11mm;bottom:15mm;width:30mm;height:30mm;border-radius:50%;border:3px dashed var(--leaf);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Jua';color:var(--leaf-d);font-size:12px;background:rgba(255,255,255,.85);transform:rotate(-8deg);z-index:3}
.stamp img{width:14mm}

/* 정답지 */
.anspage h3{font-family:'Jua';font-size:16px;margin:4mm 0 2mm;color:var(--leaf-d)}
.anspage .box{font-size:13.5px;line-height:1.7}
.anspage .ans{visibility:visible}

@media screen and (max-width:820px){
  .page{width:auto;height:auto;min-height:0;margin:10px;padding:16px 14px 46px}
  .five{grid-template-columns:repeat(3,1fr)} .enemies,.eco3,.promise{grid-template-columns:1fr} .cre{grid-template-columns:repeat(3,1fr)} .items{grid-template-columns:repeat(3,1fr)}
  .head{flex-wrap:wrap} .record{grid-template-columns:1fr} .stamp{position:static;margin:10px auto 0}
  .dilemma{flex-direction:column} .dilemma .pic{width:auto}
}
@media print{
  html,body{background:#fff}
  .bar{display:none}
  .page{margin:0;box-shadow:none;border-radius:0;width:210mm;height:297mm;page-break-after:always;break-after:page}
  .page:last-child{page-break-after:auto;break-after:auto}
  @page{size:A4;margin:0}
}
</style>
</head>
<body>
<div class="bar">
  <h1><img src="../assets/eco-rich/sprout.webp" alt="">친환경 농부 학습지</h1>
  <button onclick="window.print()">🖨️ 인쇄하기</button>
  <button class="b2" id="ansBtn">👀 정답 보이기</button>
  <a class="b3" href="eco-rich.html">🎮 게임하러 가기</a>
  <a class="b4" href="../index.html">🏠 3분 놀이터</a>
  <div class="hint">A4 4쪽 학습지 + 정답지 1쪽 · 학생용은 정답을 숨긴 채로, 선생님용은 '정답 보이기'를 누른 뒤 인쇄하세요.</div>
</div>
<main id="pages"></main>

<script>
const I = n => `<img src="../assets/eco-rich/${n}.webp" alt="">`;
const B = a => `<span class="blank"><span class="a">${a}</span></span>`;
const head = (no, title, sub, noWho) => `<div class="head"><span class="badge">🌱 친환경 농부<br>${no}</span><div class="title">${title}<small>${sub}</small></div>${noWho?'':'<div class="who"><span>6학년</span><span>반</span><span>번</span><span class="nm">이름</span></div>'}</div>`;
const foot = n => `<div class="foot"><span>6학년 실과 · 지속가능한 미래를 위한 친환경 농업</span><span>🌱 친환경 농부 · 3분 놀이터 · ${n}</span></div>`;
const pages = [];

/* ---------- 1쪽: 친환경 농업이란? ---------- */
pages.push(`<section class="page">${head('1쪽','① 친환경 농업이란?','땅과 물, 생물을 함께 살리는 농사를 알아봐요')}
<div class="hero">${I('bg_title')}
  <div class="speech">“손주야, 농약 없이 <b>땅을 살리는 농사</b>를 지어 보렴. 땅이 건강해야 사람도, 생물도, 지구도 오래오래 건강하단다.”</div>
  <img class="gm" src="../assets/eco-rich/grandma.webp" alt="">
</div>

<div class="sec"><i>1</i>관행 농업과 친환경 농업을 비교해 봐요 <em>빈칸에 알맞은 말을 써요</em></div>
<div class="compare">
  <div class="h"></div><div class="h k">🧪 관행 농업</div><div class="h e">🌱 친환경 농업</div>
  <div class="r">해충 막기</div><div class="c2">합성 ${B('농약')}을 뿌려요</div><div class="c2">마늘·님오일 같은 ${B('천연')} 추출물, 천적 곤충을 써요</div>
  <div class="r">양분 주기</div><div class="c2">화학비료를 많이 줘요</div><div class="c2">완숙 ${B('퇴비')}, 깻묵, 볏짚 같은 유기질 비료를 줘요</div>
  <div class="r">잡초 없애기</div><div class="c2">제초제를 뿌려요</div><div class="c2">손으로 김매기, 볏짚 덮기, ${B('우렁이')}·오리를 이용해요</div>
  <div class="r last">땅 관리</div><div class="c2 last">같은 작물을 계속 심기도 해요</div><div class="c2 last">${B('돌려짓기')}(윤작)와 녹비작물로 땅의 힘을 길러요</div>
</div>

<div class="sec"><i>2</i>친환경 농업의 다섯 가지 특징 <em>게임 속 그림을 보며 읽어 봐요</em></div>
<div class="five">
  <div class="c">${I('t_garlic')}<span class="n">특징 1</span><div class="t">합성농약·화학비료 줄이기</div><div class="d">천연 추출물, 미생물 제제, 페로몬 트랩, 유기질 비료를 써요.</div></div>
  <div class="c">${I('t_lady')}<span class="n">특징 2</span><div class="t">생태계 순환과 천적 활용</div><div class="d">무당벌레·우렁이·오리 같은 생물이 해충과 잡초를 줄여요.</div></div>
  <div class="c">${I('bean')}<span class="n">특징 3</span><div class="t">토양의 자생력 강화</div><div class="d">돌려짓기와 녹비작물로 흙이 스스로 건강해져요.</div></div>
  <div class="c">${I('c_loach')}<span class="n">특징 4</span><div class="t">환경오염 줄이기·탄소 격리</div><div class="d">하천과 지하수를 지키고, 흙 속에 탄소를 저장해요.</div></div>
  <div class="c">${I('t_weed')}<span class="n">특징 5</span><div class="t">높은 노동력·높은 가격</div><div class="d">손이 많이 가고 수확량이 적을 수 있어 값이 더 비싸요.</div></div>
</div>
<div class="bank">${['농약','천연','퇴비','우렁이','돌려짓기'].sort().map(w=>`<span>${w}</span>`).join('')}</div>
<div class="tipbox" style="margin-top:3mm">${I('seal')}<span>친환경 농산물 인증에는 농약을 쓰지 않은 <b>무농약</b>, 농약과 화학비료를 모두 쓰지 않은 <b>유기농</b> 등이 있어요. 장 볼 때 포장에서 인증 표시를 찾아보세요!</span></div>
${foot('1쪽')}</section>`);

<h3>① 친환경 농업이란?</h3>

  2. 진딧물 / 응애 / 잡초<br>
  3. 1번 밭: O(토마토와 감자는 둘 다 가지과) · 2번 밭: X(박과 → 콩과)<br>
