<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>학생자치실 · 나 알아보기 — 3분 놀이터</title>
<meta name="description" content="3분 놀이터의 학생자치실. 테스트로 알아보는 진짜 나의 모습.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/common.css">
<style>
  body {
    min-height: 100vh;
    background-color: #c8975c;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(0,0,0,.08) 1px, transparent 1.5px),
      radial-gradient(circle at 70% 60%, rgba(255,255,255,.12) 1px, transparent 1.5px),
      radial-gradient(circle at 40% 80%, rgba(0,0,0,.06) 1.2px, transparent 1.8px);
    background-size: 9px 9px, 13px 13px, 17px 17px;
    box-shadow: inset 0 0 0 14px #8a5a32;
  }
  .pen { font-family: 'Nanum Pen Script', cursive; }
  /* 가랜드 */
  .bunting { position: relative; height: 70px; max-width: 1120px; margin: -6px auto 0; }
  .bunting svg { width: 100%; height: 100%; }
  .flag { animation: flutter 2.4s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 0; }
  .flag:nth-child(odd) { animation-delay: -1.2s; }
  @keyframes flutter { from { transform: rotate(-5deg); } to { transform: rotate(5deg); } }

  .banner { text-align: center; padding: 0 20px; }
  .banner .ribbon {
    display: inline-block; position: relative; background: #e8668f; color: #fff; padding: 14px 46px 16px;
    box-shadow: 0 6px 0 #b8456c, 0 14px 22px rgba(0,0,0,.2);
  }
  .banner .ribbon::before, .banner .ribbon::after {
    content: ''; position: absolute; top: 12px; width: 34px; height: 100%; background: #c94f78; z-index: -1;
  }
  .banner .ribbon::before { left: -24px; clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 30% 50%); }
  .banner .ribbon::after { right: -24px; clip-path: polygon(0 0, 100% 0, 70% 50%, 100% 100%, 0 100%); }
  .banner h1 { margin: 0; font-size: clamp(30px, 6vw, 46px); }
  .banner p { margin: 14px 0 0; font-family: 'Nanum Pen Script', cursive; font-size: 30px; color: #fff8ec; text-shadow: 0 2px 0 rgba(0,0,0,.2); }

  /* 메모 쪽지 */
  .memo {
    position: absolute; right: max(30px, calc(50% - 540px)); top: 150px; width: 170px; padding: 16px 14px;
    background: #fffbe0; transform: rotate(5deg); box-shadow: 0 10px 16px rgba(0,0,0,.2);
    font-family: 'Nanum Pen Script', cursive; font-size: 22px; line-height: 1.2; color: #444;
  }
  .memo::before { content: '📌'; position: absolute; top: -14px; left: 50%; transform: translateX(-50%); font-size: 22px; }
  @media (max-width: 900px) { .memo { display: none; } }

  main { max-width: 1120px; margin: 0 auto; padding: 46px 30px 0; }
  .programs { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 40px 30px; }
  /* 폴라로이드 */
  .polaroid {
    --r: -3deg; --c1: #ffd1dc; --c2: #ffe8a3;
    position: relative; display: block; text-decoration: none; color: #2b2f3a;
    background: #fff; padding: 14px 14px 18px; transform: rotate(var(--r));
    box-shadow: 0 2px 2px rgba(0,0,0,.1), 0 16px 24px rgba(0,0,0,.25);
    transition: transform .25s cubic-bezier(.3,1.5,.5,1), box-shadow .25s;
  }
  .polaroid:hover { transform: rotate(0) translateY(-10px) scale(1.03); box-shadow: 0 2px 2px rgba(0,0,0,.1), 0 26px 34px rgba(0,0,0,.3); z-index: 2; }
  .pin {
    position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 22px; height: 22px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ff9bb5, #d6336c 70%); box-shadow: 0 4px 4px rgba(0,0,0,.3);
  }
  .photo {
    aspect-ratio: 1 / .85; display: grid; place-items: center; font-size: 72px;
    background: linear-gradient(135deg, var(--c1), var(--c2));
    position: relative; overflow: hidden;
  }
  .photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(120deg, rgba(255,255,255,.35) 0 30%, transparent 30%); }
  .polaroid h3 { margin: 12px 0 0; font-family: 'Nanum Pen Script', cursive; font-size: 32px; line-height: 1.1; }
  .polaroid p { margin: 2px 0 0; font-size: 14px; color: #666; }
  .polaroid .go { display: inline-block; margin-top: 8px; font-family: 'Jua', sans-serif; font-size: 14px; color: #e8668f; }
  .ptag { font-size: 12px; color: #999; margin-left: 4px; }
  .room-nav-title { color: #fff8ec; text-shadow: 0 2px 0 rgba(0,0,0,.2); }
  .site-foot { color: #fbe7cc; }
</style>
</head>
<body class="room room-council">

<header class="room-top">
  <a class="back-link" href="index.html">← 학교 지도로</a>
  <div class="nameplate"><span class="np-floor">3층</span><span class="np-name">학생자치실<small>STUDENT COUNCIL</small></span></div>
</header>

<div class="bunting" aria-hidden="true">
  <svg viewBox="0 0 1120 70" preserveAspectRatio="none" id="buntingSvg"></svg>
</div>

<section class="banner">
  <div class="ribbon"><h1>🎗️ 나 알아보기</h1></div>
  <p>나는 어떤 사람일까? 테스트로 알아보는 진짜 나</p>
</section>
<div class="memo">학생자치회 공지<br>나 알아보기 <span data-count>0</span>개!<br>결과는 친구와 비교해 봐요 ♡</div>

<main>
  <div id="programs" class="programs"></div>
</main>

<nav class="room-nav" id="roomNav" aria-label="다른 장소"></nav>
<footer class="site-foot">
  <p class="foot-copy">© 2026 3분 놀이터. 콘텐츠는 재미로 즐겨주세요.</p>
  <p class="foot-links">
    <a class="site-link" href="privacy.html">개인정보처리방침</a>
    <span class="foot-sep" aria-hidden="true">|</span>
    <span>문의: <a href="mailto:dasihaza@gmail.com">dasihaza@gmail.com</a></span>
  </p>
</footer>

<script src="assets/rooms.js"></script>
<script>
  // 가랜드 그리기
  const cols = ['#ff7a59', '#ffd34d', '#3fb6d9', '#7be0c3', '#e8668f', '#9b6cf0'];
  let g = '<path d="M0 8 Q560 52 1120 8" stroke="#fff" stroke-width="2" fill="none"/>';
  for (let i = 0; i < 18; i++) {
    const x = 20 + i * 62, t = x / 1120, y = 8 + 4 * t * (1 - t) * 44;
    g += `<path class="flag" d="M${x} ${y} h40 l-20 34z" fill="${cols[i % cols.length]}"/>`;
  }
  document.getElementById('buntingSvg').innerHTML = g;

  const LOOKS = [['-3deg', '#ffd1dc', '#ffe8a3'], ['2.5deg', '#c9f0ff', '#d9ccff'], ['-1.5deg', '#d4f5d0', '#fff3b0'], ['3deg', '#ffe0c7', '#ffc9d9']];
  mountPrograms('council', (p, i) => {
    const [r, c1, c2] = LOOKS[i % LOOKS.length];
    return `
    <a class="polaroid prog-link" href="${p.href}" data-title="${esc(p.title)}" style="--r:${r};--c1:${c1};--c2:${c2}">
      <span class="pin"></span>
      <div class="photo">${p.emoji}</div>
      <h3>${esc(p.title)}${p.isNew ? '<span class="new-badge">NEW</span>' : ''}</h3>
      <p>${esc(p.desc)}</p>
      <span class="go">테스트 시작 →</span> ${p.tag ? `<span class="ptag">${esc(p.tag)}</span>` : ''}
    </a>`;
  });
  mountRoomNav('council');
</script>
</body>
</html>
