<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>회의실 · 이야기방 — 3분 놀이터</title>
<meta name="description" content="3분 놀이터의 회의실. 교육자로서의 생각과 관점을 나누는 이야기 공간.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/common.css">
<style>
  body { min-height: 100vh; background: linear-gradient(#e4e9f2 0 520px, #cfd6e3 520px); }
  .pen { font-family: 'Nanum Pen Script', cursive; }
  /* 화이트보드 */
  .board-wrap { max-width: 1060px; margin: 22px auto 0; padding: 0 20px; }
  .board {
    position: relative; background: #fbfcfe; border-radius: 10px; padding: 30px 34px 40px;
    border: 12px solid #c7ced9; border-bottom-width: 18px;
    box-shadow: inset 0 0 40px rgba(120,140,170,.15), 0 16px 30px rgba(40,60,90,.18);
    background-image: radial-gradient(ellipse at 70% 20%, rgba(255,255,255,1), rgba(240,244,250,.6));
  }
  .board::after { /* 마커 받침 */
    content: ''; position: absolute; left: 10%; right: 10%; bottom: -30px; height: 10px; border-radius: 4px; background: #aeb7c5;
  }
  .markers { position: absolute; right: 13%; bottom: -30px; display: flex; gap: 6px; }
  .markers i { display: block; width: 44px; height: 9px; border-radius: 3px; }
  .board h1 { margin: 0; font-family: 'Nanum Pen Script', cursive; font-size: clamp(52px, 9vw, 84px); line-height: 1; color: #3949ab; transform: rotate(-2deg); }
  .board h1 u { text-decoration-color: #e53950; text-decoration-thickness: 4px; text-underline-offset: 6px; }
  .board .sub { font-family: 'Nanum Pen Script', cursive; font-size: 28px; color: #444b5a; margin: 6px 0 16px; }
  .agenda { font-family: 'Nanum Pen Script', cursive; font-size: 26px; color: #2b2f3a; margin: 0; padding-left: 0; list-style: none; line-height: 1.35; }
  .agenda li::before { content: '✔ '; color: #e53950; }
  .agenda li.todo::before { content: '○ '; color: #8a93a8; }
  .agenda li.todo { color: #8a93a8; }
  .magnet { position: absolute; width: 22px; height: 22px; border-radius: 50%; box-shadow: inset 0 -3px 0 rgba(0,0,0,.2), 0 3px 4px rgba(0,0,0,.2); }
  .doodle { position: absolute; right: 34px; top: 26px; width: 200px; opacity: .9; }
  @media (max-width: 640px) { .doodle { display: none; } }

  main { max-width: 1060px; margin: 0 auto; padding: 60px 20px 0; }
  .table-label { text-align: center; font-family: 'Jua', sans-serif; color: #5a6478; font-size: 18px; margin: 0 0 20px; }
  .programs { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 26px; }
  /* 포스트잇 */
  .note {
    --bg: #fff59d; --r: -2deg;
    position: relative; display: block; text-decoration: none; color: #2b2f3a; min-height: 220px;
    background: var(--bg); padding: 30px 22px 20px; transform: rotate(var(--r));
    box-shadow: 0 1px 1px rgba(0,0,0,.08), 0 14px 18px -10px rgba(0,0,0,.35);
    transition: transform .2s;
  }
  .note::before { /* 테이프 */
    content: ''; position: absolute; top: -12px; left: 50%; width: 90px; height: 26px; transform: translateX(-50%) rotate(-3deg);
    background: rgba(255,255,255,.55); border: 1px solid rgba(0,0,0,.05);
  }
  .note::after { /* 접힌 모서리 */
    content: ''; position: absolute; right: 0; bottom: 0; width: 30px; height: 30px;
    background: linear-gradient(135deg, rgba(0,0,0,.12) 50%, transparent 50%);
  }
  .note:hover { transform: rotate(0) translateY(-6px) scale(1.02); }
  .note .emoji { font-size: 36px; }
  .ptag { display: inline-block; margin-top: 8px; font-size: 12px; background: rgba(0,0,0,.07); border-radius: 4px; padding: 1px 8px; }
  .note h3 { margin: 6px 0 6px; font-size: 24px; }
  .note p { margin: 0; font-size: 15px; color: #4a4f5c; }
  .note .go { display: inline-block; margin-top: 12px; font-family: 'Nanum Pen Script', cursive; font-size: 26px; color: #3949ab; }
  .note.empty { --bg: transparent; border: 3px dashed #aab3c4; box-shadow: none; color: #7a8091; display: grid; place-items: center; text-align: center; }
  .note.empty::before, .note.empty::after { display: none; }
  .note.empty .pen { font-size: 28px; }
</style>
</head>
<body class="room room-meeting">

<header class="room-top">
  <a class="back-link" href="index.html">← 학교 지도로</a>
  <div class="nameplate"><span class="np-floor">2층</span><span class="np-name">회의실<small>MEETING ROOM</small></span></div>
</header>

<section class="board-wrap">
  <div class="board">
    <span class="magnet" style="background:#e53950;left:18px;top:14px"></span>
    <span class="magnet" style="background:#3949ab;right:18px;top:14px"></span>
    <h1><u>이야기방</u></h1>
    <p class="sub">교육자로서 느끼는 점, 생각, 관점을 나누는 자리</p>
    <ol class="agenda">
      <li>오늘의 안건 — 정보교육과 AI, 우리는 어떻게 바라볼까?</li>
      <li class="todo">다음 안건 모집 중 (주제 제안 환영!)</li>
    </ol>
    <svg class="doodle" viewBox="0 0 200 120" aria-hidden="true">
      <path d="M10 70 q0 -40 50 -40 h40 q30 0 30 28 q0 28 -30 28 h-50 l-20 18 v-18 q-20 -2 -20 -16z" fill="none" stroke="#3949ab" stroke-width="3" stroke-linecap="round"/>
      <path d="M100 30 q0 -26 40 -26 h20 q30 0 30 24 q0 24 -30 24 h-10 l12 14 l-24 -14" fill="none" stroke="#e53950" stroke-width="3" stroke-linecap="round"/>
      <circle cx="50" cy="60" r="4" fill="#3949ab"/><circle cx="70" cy="60" r="4" fill="#3949ab"/><circle cx="90" cy="60" r="4" fill="#3949ab"/>
    </svg>
    <div class="markers" aria-hidden="true"><i style="background:#3949ab"></i><i style="background:#e53950"></i><i style="background:#2b2f3a"></i></div>
  </div>
</section>

<main>
  <p class="table-label">💬 지금 열린 이야기방</p>
  <div id="programs" class="programs"></div>
</main>

<nav class="room-nav" id="roomNav" aria-label="다른 장소"></nav>
<footer class="site-foot">
  <p class="foot-copy">© 2026 3분 놀이터. 콘텐츠는 재미로 즐겨주세요.</p>
  <p class="foot-links">
    <a class="site-link" href="privacy.html">개인정보처리방침</a>
    <span class="foot-sep" aria-hidden="true">|</span>
    <span>문의: <a href="mailto:dasihaza@gmail.com">dasihaza@gmail.com</a></span>
  </p>
</footer>

<script src="assets/rooms.js"></script>
<script>
  const NOTES = [['#fff59d', '-2deg'], ['#ffccbc', '1.5deg'], ['#c8e6c9', '-1deg'], ['#bbdefb', '2deg']];
  mountPrograms('meeting', (p, i) => {
    const [bg, r] = NOTES[i % NOTES.length];
    return `
    <a class="note prog-link" href="${p.href}" data-title="${esc(p.title)}" style="--bg:${bg};--r:${r}">
      <span class="emoji">${p.emoji}</span>
      <h3>${esc(p.title)}${p.isNew ? '<span class="new-badge">NEW</span>' : ''}</h3>
      <p>${esc(p.desc)}</p>
      ${p.tag ? `<span class="ptag">${esc(p.tag)}</span>` : ''}<br>
      <span class="go">이야기하러 가기 →</span>
    </a>`;
  });
  // 빈 자리: 앞으로 열릴 이야기방
  document.getElementById('programs').insertAdjacentHTML('beforeend',
    `<div class="note empty" style="--r:1deg"><div><div class="pen">다음 이야기방 자리</div><small>새 주제가 곧 붙을 예정이에요</small></div></div>`);
  mountRoomNav('meeting');
</script>
</body>
</html>
